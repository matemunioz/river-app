<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Plate · Videoanálisis</title>
  <style>
    :root {
      --rojo:    #CC0000;
      --rojo2:   #990000;
      --negro:   #0a0a0a;
      --gris1:   #141414;
      --gris2:   #1e1e1e;
      --gris3:   #2a2a2a;
      --gris4:   #3a3a3a;
      --gris5:   #555;
      --grisc:   #ccc;
      --blanco:  #f5f5f5;
      --verde:   #3ecf8e;
      --ambar:   #f5a623;
      --azul:    #4a90d9;
      --r: var(--border-radius-md, 8px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--negro);
      color: var(--blanco);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--gris1);
      border-bottom: 3px solid var(--rojo);
      padding: 0 1.5rem;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-img { height: 42px; filter: drop-shadow(0 0 6px rgba(204,0,0,0.4)); }
    .brand { display: flex; flex-direction: column; }
    .brand-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
    .brand-sub { font-size: 10px; color: var(--gris5); letter-spacing: 1px; text-transform: uppercase; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    /* MAIN */
    main { max-width: 1180px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
    .section { margin-top: 2.5rem; }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: .5rem;
      border-bottom: 1px solid var(--gris3);
    }
    .section-title {
      font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--blanco);
    }
    .section-title span { color: var(--rojo); }
    .section-hint { font-size: 11px; color: var(--gris5); }

    /* DROP ZONE */
    #drop-zone {
      border: 1.5px dashed var(--gris4);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--rojo);
      background: rgba(204,0,0,0.05);
    }
    #drop-zone input { display: none; }
    .drop-icon { font-size: 32px; margin-bottom: 10px; display: block; }
    .drop-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
    .drop-sub { color: var(--gris5); font-size: 12px; }

    /* BTN */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 6px;
      border: 1px solid var(--gris4);
      background: var(--gris3); color: var(--blanco);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background .15s, border-color .15s; text-decoration: none;
    }
    .btn:hover { background: var(--gris4); border-color: var(--gris5); }
    .btn-red { background: var(--rojo); border-color: var(--rojo); }
    .btn-red:hover { background: var(--rojo2); }
    .btn-outline { background: transparent; border-color: var(--rojo); color: var(--rojo); }
    .btn-outline:hover { background: rgba(204,0,0,0.1); }
    .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

    /* STATUS */
    #status-bar {
      display: none; align-items: center; gap: 10px;
      margin-top: 1.2rem; padding: 10px 14px;
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 6px; font-size: 12px; color: var(--gris5);
    }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--gris4);
      border-top-color: var(--rojo); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULTADOS */
    #results { margin-top: 2rem; }

    .partido-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem;
    }
    .partido-title { font-size: 18px; font-weight: 700; }
    .partido-title span { color: var(--rojo); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* SCORE */
    .score-box {
      background: linear-gradient(135deg, var(--gris1) 0%, var(--gris2) 100%);
      border-radius: 14px;
      border: 1px solid var(--gris3);
      display: flex; align-items: center; justify-content: center;
      gap: 3rem; padding: 2rem 2rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .score-box::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(204,0,0,.08) 0, transparent 50%);
      pointer-events: none;
    }
    .score-team { text-align: center; position: relative; }
    .score-name { font-size: 11px; color: var(--gris5); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
    .score-num { font-size: 78px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
    .score-num.river { color: var(--rojo); text-shadow: 0 0 30px rgba(204,0,0,.3); }
    .score-num.rival { color: var(--grisc); }
    .score-sep { font-size: 40px; color: var(--gris4); font-weight: 200; }

    /* KPI HERO (los 4 destacados) */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 0;
    }
    @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card {
      background: var(--gris2);
      border: 1px solid var(--gris3);
      border-radius: 12px;
      padding: 18px 20px;
      transition: border-color .2s, transform .2s;
    }
    .kpi-card:hover { border-color: var(--gris4); transform: translateY(-1px); }
    .kpi-card.clickable { cursor: pointer; }
    .kpi-card.clickable:hover { border-color: var(--rojo); }
    .kpi-card.clickable.active {
      border-color: var(--rojo); border-width: 2px;
      box-shadow: 0 0 0 2px rgba(204,0,0,0.18);
    }

    .plantel-detalle:empty { display: none; }
    .plantel-detalle { margin-bottom: 1.5rem; }
    .plantel-detalle-card {
      background: var(--gris1); border: 1px solid var(--gris3); border-left: 3px solid var(--rojo);
      border-radius: 10px; padding: 1.2rem 1.4rem;
      animation: fadeIn .2s ease-out;
    }
    .plantel-detalle-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem; }
    .plantel-detalle-titulo { font-size: 14px; font-weight: 700; color: var(--blanco); }
    .plantel-detalle-x {
      background: transparent; border: none; color: var(--gris5);
      cursor: pointer; font-size: 22px; line-height: 1; padding: 0 4px;
    }
    .plantel-detalle-x:hover { color: var(--rojo); }
    .plantel-detalle-expl {
      font-size: 11.5px; color: var(--gris5); margin-bottom: 12px;
      font-style: italic; line-height: 1.5;
    }
    .det-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 2px; border-bottom: 1px solid var(--gris3);
      font-size: 12px;
    }
    .det-item:last-child { border-bottom: none; }
    .det-item > span:first-child { flex: 1; color: var(--blanco); }
    .det-num { color: var(--gris5); min-width: 22px; }
    .det-tag { color: var(--rojo); font-weight: 600; font-size: 11px; }
    .det-sub {
      font-size: 10px; color: var(--gris5); text-transform: uppercase;
      letter-spacing: 1px; margin: 10px 0 4px; font-weight: 700;
    }
    .det-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    .kpi-card-label { font-size: 10px; color: var(--gris5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; }
    .kpi-card-val { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .kpi-card-val.red { color: var(--rojo); }
    .kpi-card-val.amber { color: var(--ambar); }
    .kpi-card-val.green { color: var(--verde); }
    .kpi-card-sub { font-size: 10px; color: var(--gris5); margin-top: 6px; }

    /* TABS */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 2rem; overflow-x: auto;
      padding: 5px; background: var(--gris1); border-radius: 10px;
      border: 1px solid var(--gris3);
    }
    .tab {
      padding: 10px 18px; font-size: 12px; font-weight: 600;
      color: var(--gris5); cursor: pointer;
      border-radius: 7px; white-space: nowrap;
      transition: color .15s, background .15s;
      flex: 1; text-align: center; min-width: max-content;
    }
    .tab:hover { color: var(--blanco); background: var(--gris2); }
    .tab.active { color: white; background: var(--rojo); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* SECTION TITLE (subtítulo dentro de tab) */
    .sec-title {
      font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--gris5);
      margin: 1.5rem 0 .8rem;
    }
    .sec-title.red { color: var(--rojo); }
    .sec-title:first-child { margin-top: 0; }

    /* BAR COMPARE — más aire */
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .bar-track { flex: 1; height: 10px; background: var(--gris3); border-radius: 5px; overflow: hidden; position: relative; }
    .bar-fill-river { height: 100%; background: linear-gradient(90deg, var(--rojo2), var(--rojo)); border-radius: 5px; transition: width .5s; }
    .bar-fill-rival { height: 100%; background: var(--gris5); border-radius: 5px; transition: width .5s; }
    .bar-val { font-size: 13px; font-weight: 700; min-width: 28px; }
    .bar-val.river { color: var(--rojo); text-align: right; }

    .compare-panel {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 1.5rem 1.8rem;
    }
    .compare-legend { display: flex; gap: 24px; margin-bottom: 1.2rem; font-size: 11px; font-weight: 600; }
    .compare-legend .lg-river { color: var(--rojo); }
    .compare-legend .lg-rival { color: var(--gris5); }
    .compare-legend .lg-river::before, .compare-legend .lg-rival::before {
      content: ''; display: inline-block; width: 10px; height: 10px;
      border-radius: 2px; margin-right: 6px; vertical-align: middle;
    }
    .compare-legend .lg-river::before { background: var(--rojo); }
    .compare-legend .lg-rival::before { background: var(--gris5); }

    /* MINI GRID — cards más generosas */
    .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
    .mini-card {
      background: var(--gris2); border: 1px solid var(--gris3);
      border-radius: 10px; padding: 14px 12px; text-align: center;
      transition: border-color .15s;
    }
    .mini-card:hover { border-color: var(--gris4); }
    .mini-label { font-size: 10px; color: var(--gris5); text-transform: uppercase; margin-bottom: 6px; letter-spacing: .5px; }
    .mini-val { font-size: 22px; font-weight: 800; line-height: 1; }
    .mini-val.red { color: var(--rojo); }
    .mini-val.green { color: var(--verde); }
    .mini-val.amber { color: var(--ambar); }

    /* PANEL — contenedor genérico para tabs */
    .panel-card {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 1.5rem 1.8rem;
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }

    /* GOLES */
    .gol-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; background: var(--gris2);
      border: 1px solid var(--gris3); border-radius: 10px; margin-bottom: 8px;
      transition: border-color .15s;
    }
    .gol-item:hover { border-color: var(--gris4); }
    .gol-min { font-size: 14px; font-weight: 800; color: var(--rojo); min-width: 56px; }
    .gol-eq { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: .5px; }
    .gol-eq.river { background: rgba(204,0,0,.2); color: var(--rojo); }
    .gol-eq.rival { background: var(--gris3); color: var(--grisc); }
    .gol-info { flex: 1; }
    .gol-tipo { font-size: 10px; color: var(--gris5); margin-bottom: 2px; letter-spacing: .3px; }
    .gol-carril { font-weight: 700; font-size: 13px; }

    /* CAMBIOS */
    .cambio-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; background: var(--gris2);
      border: 1px solid var(--gris3); border-radius: 10px; margin-bottom: 8px;
    }
    .cambio-item:hover { border-color: var(--gris4); }
    .cambio-min { font-size: 14px; font-weight: 800; color: var(--rojo); min-width: 56px; }
    .cambio-sale { color: #ff6666; font-weight: 600; font-size: 12px; }
    .cambio-entra { color: #66ff99; font-weight: 600; font-size: 12px; }
    .cambio-eq { font-size: 9px; color: var(--gris5); margin-left: auto; letter-spacing: .5px; }

    /* MINUTOS */
    .min-jugador {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px;
    }
    .min-nombre { font-size: 12px; min-width: 160px; font-weight: 600; }
    .min-track { flex: 1; height: 12px; background: var(--gris3); border-radius: 6px; overflow: hidden; }
    .min-fill { height: 100%; border-radius: 6px; transition: width .4s; }
    .min-fill.titular { background: linear-gradient(90deg, var(--rojo2), var(--rojo)); }
    .min-fill.suplente { background: var(--gris5); }
    .min-tiempo { font-size: 12px; color: var(--blanco); font-weight: 700; min-width: 50px; text-align: right; }
    .min-cond { font-size: 9px; padding: 3px 8px; border-radius: 10px; font-weight: 600; letter-spacing: .5px; }
    .min-cond.titular { background: rgba(204,0,0,.2); color: var(--rojo); }
    .min-cond.suplente { background: var(--gris3); color: var(--gris5); }

    /* INDIVIDUAL */
    .ind-selector {
      display: flex; gap: 8px; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .ind-selector label { font-size: 12px; color: var(--gris5); }
    .ind-selector select {
      padding: 6px 10px; background: var(--gris2); border: 1px solid var(--gris4);
      color: var(--blanco); border-radius: 6px; font-size: 12px;
    }

    /* COMBOBOX custom (búsqueda de jugador) */
    .combo { position: relative; }
    .combo input {
      background: var(--gris2); border: 1px solid var(--gris4);
      color: var(--blanco); padding: 8px 32px 8px 12px;
      border-radius: 8px; font-size: 12px; min-width: 280px;
      transition: border-color .15s;
    }
    .combo input:focus { outline: none; border-color: var(--rojo); }
    .combo::after {
      content: '▾'; position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%); color: var(--gris5); pointer-events: none; font-size: 10px;
    }
    .combo-list {
      position: absolute; top: calc(100% + 4px); left: 0;
      width: 100%; max-height: 260px; overflow-y: auto;
      background: var(--gris1); border: 1px solid var(--gris4);
      border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
      z-index: 100; padding: 4px;
      display: none;
    }
    .combo-list.open { display: block; }
    .combo-item {
      padding: 7px 10px; font-size: 12px; cursor: pointer;
      border-radius: 5px; color: var(--blanco);
    }
    .combo-item:hover, .combo-item.active { background: var(--rojo); }
    .combo-empty { padding: 10px; color: var(--gris5); font-size: 11px; text-align: center; }

    /* IND stats */
    .ind-header {
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 10px; padding: 1rem 1.2rem;
      display: flex; gap: 16px; align-items: center; margin-bottom: 1rem;
    }
    .ind-nombre { font-size: 20px; font-weight: 800; }
    .ind-sub { font-size: 11px; color: var(--gris5); margin-top: 3px; }
    .ind-kpis { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
    .kpi { text-align: center; }
    .kpi-val { font-size: 22px; font-weight: 800; }
    .kpi-val.red { color: var(--rojo); }
    .kpi-val.amber { color: var(--ambar); }
    .kpi-val.blue { color: var(--azul); }
    .kpi-label { font-size: 9px; color: var(--gris5); text-transform: uppercase; }

    .ind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .ind-grid { grid-template-columns: 1fr; } }
    .ind-block {
      background: var(--gris2); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 16px 18px;
      transition: border-color .15s;
    }
    .ind-block:hover { border-color: var(--gris4); }
    .ind-block-title {
      font-size: 10px; font-weight: 700; letter-spacing: 1.3px;
      text-transform: uppercase; color: var(--rojo);
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--gris3);
    }
    .ind-block-title.sub { color: var(--gris5); margin-top: 16px; border-bottom: none; padding-bottom: 4px; }
    /* Tooltip de ayuda */
    .info-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--gris3); border: 1px solid var(--gris4);
      color: var(--gris5); font-size: 9px; font-weight: 700;
      margin-left: 6px; cursor: help; position: relative;
    }
    .info-dot:hover { color: var(--rojo); border-color: var(--rojo); }
    .info-dot::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: var(--negro); color: var(--blanco);
      border: 1px solid var(--rojo); border-radius: 6px;
      padding: 8px 10px; font-size: 11px; font-weight: 400;
      white-space: normal; width: 240px; text-align: left; line-height: 1.4;
      opacity: 0; pointer-events: none; transition: opacity .15s;
      z-index: 1000; box-shadow: 0 6px 20px rgba(0,0,0,.6);
    }
    .info-dot:hover::after { opacity: 1; }

    .ind-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--gris3); }
    .ind-row:last-child { border-bottom: none; }
    .ind-row-label { font-size: 11px; color: var(--grisc); }
    .ind-row-val { font-size: 14px; font-weight: 700; }
    .ind-row-val.red { color: var(--rojo); }
    .ind-row-val.green { color: var(--verde); }
    .ind-row-val.amber { color: var(--ambar); }

    .efect-bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .efect-pct { font-size: 26px; font-weight: 800; }
    .efect-track { flex: 1; height: 8px; background: var(--gris3); border-radius: 4px; overflow: hidden; }
    .efect-fill { height: 100%; border-radius: 4px; }

    .part-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 14px;
      background: var(--gris2); border: 1px solid var(--gris4);
      font-size: 11px; cursor: pointer; user-select: none;
    }
    .part-chip input { accent-color: var(--rojo); cursor: pointer; }
    .part-chip:has(input:not(:checked)) { opacity: 0.45; }
    .part-chip:hover { border-color: var(--rojo); }
    .part-chip-x {
      border: none; background: transparent; color: var(--gris5);
      font-size: 13px; font-weight: 700; cursor: pointer; padding: 0 2px;
      margin-left: 2px; line-height: 1; transition: color .15s;
    }
    .part-chip-x:hover { color: var(--rojo); }

    /* SUB-TABS DENTRO DE INDIVIDUAL */
    .ind-subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--gris4); margin-bottom: 1rem; }
    .ind-subtab {
      padding: 7px 14px; font-size: 11px; font-weight: 600; cursor: pointer;
      color: var(--gris5); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .ind-subtab:hover { color: var(--blanco); }
    .ind-subtab.active { color: var(--rojo); border-bottom-color: var(--rojo); }

    .col-modos { display: inline-flex; gap: 4px; background: var(--gris2); border: 1px solid var(--gris4); border-radius: 6px; padding: 3px; margin-bottom: 1rem; }
    .col-modos button { padding: 4px 12px; font-size: 11px; border: none; background: transparent; color: var(--gris5); cursor: pointer; border-radius: 4px; }
    .col-modos button.active { background: var(--rojo); color: white; }

    /* CREADOR DE GRÁFICOS */
    .chart-builder { background: var(--gris2); border: 1px solid var(--gris4); border-radius: 10px; padding: 14px; margin-bottom: 1rem; }
    .chart-builder-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .chart-builder-row:last-child { margin-bottom: 0; }
    .chart-builder-label {
      font-size: 10px; color: var(--gris5); text-transform: uppercase;
      letter-spacing: .5px; min-width: 90px; font-weight: 700;

<main>

       onclick="document.getElementById('fi').click()"
       ondragover="ev(event,'over')" ondragleave="ev(event,'leave')" ondrop="ev(event,'drop')">

<script>
let archivosActuales = [];
let datosActuales = null;
let nombresPartidos = [];
let partidosSel = new Set();
let tabActiva = 'individual';
let jugadorActivo = '';
let vistaInd = 'jugador';
let modoColectivo = 'suma';
let jugadoresSel = new Set();
let datosJugadores = null;
let xMetric = 'pases_total';
let yMetric = 'pases_efect';
let tMinMin = 0;     // minutos
let tMaxMin = 90;    // minutos
let tiempoTimer = null;
let chartType = 'scatter';
let radarMetrics = ['pases_efect', 'remates_arco', 'recup_posic', 'toques_area', 'dao_plus'];

// ─── Radar individual (exportable, escalado contra baremos del histórico) ───
let BAREMOS = null; // cargado de /static/baremos.json
let radarIndJugador = null; // jugador elegido para el radar individual
let radarIndMetrics = ['pases_efect', 'pct_progresivo', 'remates_arco', 'recup_total', 'dao_plus', 'intercepciones'];
let radarIndBase = 'auto'; // 'auto' (por posición) | 'global' | 'def' | 'med' | 'atk'
// Colores personalizables del radar individual (todo el gráfico).
let radarIndBgTransparente = false;        // si true, el PNG sale con fondo transparente
let radarIndColores = {                    // default: legible sobre fondo blanco (para exportar)
  bg:      '#ffffff',  // fondo
  jugador: '#CC0000',  // relleno + líneas + vértices del jugador
  numeros: '#1a1a1a',  // valores numéricos en cada eje (gris oscuro, legible sobre claro)
  texto:   '#1a1a1a',  // nombre de la métrica, título y subtítulo
  grilla:  '#d6d6d6',  // grilla y ejes
};

async function cargarBaremos() {

  try {
    const r = await fetch('/static/baremos.json');
    BAREMOS = r.ok ? await r.json() : {};
  } catch { BAREMOS = {}; }

}

const METRICAS = [
  ['minutos', 'Minutos'],
  ['intervenciones', 'Intervenciones'],
  ['pases_total', 'Pases totales'],
  ['pases_completos', 'Pases completos'],

  ['pases_filtrado', 'Pases filtrados'],
  ['pases_largo_c', 'Pases largos completos'],

  ['faltas_rec', 'Faltas recibidas'],

  ['pct_ultimo_tercio', '% Último tercio'],
  ['pct_area', '% Área rival'],
  ['pct_progresivo', '% Acciones progresivas'],
  ['progresion_media', 'Progresión media (m)'],
  ['distancia_media', 'Distancia media (m)'],
];

const STORAGE_KEY = 'river_csvs_v1';

function fileToB64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

function b64ToFile(dataUrl, name) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/data:(.*?);base64/) || [, 'text/csv'])[1];
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new File([buf], name, { type: mime });
}

async function guardarEnCache(files) {
  try {
    const arr = await Promise.all(Array.from(files).map(async f => ({
      name: f.name,
      data: await fileToB64(f),
    })));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    actualizarBarraCache();
  } catch (e) {
    console.warn('No se pudo guardar en cache:', e);
  }
}

function cargarDeCache() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return arr.map(o => b64ToFile(o.data, o.name));
  } catch { return []; }
}

function actualizarBarraCache() {
  const bar = document.getElementById('cache-bar');
  const info = document.getElementById('cache-info');
  if (archivosActuales.length) {
    bar.style.display = 'flex';
    info.textContent = `${archivosActuales.length} archivo(s) guardado(s) en este navegador`;
  } else {
    bar.style.display = 'none';
  }
}

function borrarCache() {
  localStorage.removeItem(STORAGE_KEY);
  archivosActuales = [];
  partidosSel = new Set();
  datosActuales = null;
  datosJugadores = null;
  jugadorActivo = '';
  nombresPartidos = [];
  tabActiva = 'individual';
  document.getElementById('results').innerHTML = '';
  document.getElementById('drop-icon').textContent = '📂';
  actualizarBarraCache();
}

window.addEventListener('DOMContentLoaded', () => {
  const stored = cargarDeCache();
  if (stored.length) procesar(stored, { fromCache: true });

  // Tooltip flotante para la cancha (instantáneo, sin delay nativo)
  const tip = document.createElement('div');
  tip.id = 'pitch-tooltip';
  tip.style.cssText =
    'position:fixed;background:#0a0a0a;color:#fff;border:1px solid #CC0000;' +
    'border-radius:6px;padding:6px 10px;font-size:11px;font-weight:500;' +
    'line-height:1.4;pointer-events:none;z-index:10000;display:none;' +
    'box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:280px';
  document.body.appendChild(tip);

  document.addEventListener('mouseover', e => {
    const g = e.target.closest && e.target.closest('[data-pitch-tip]');
    if (!g) return;
    tip.textContent = g.getAttribute('data-pitch-tip');
    tip.style.display = 'block';
  });
  document.addEventListener('mousemove', e => {
    if (tip.style.display === 'none') return;
    const x = e.clientX + 14, y = e.clientY + 14;
    const maxX = window.innerWidth - tip.offsetWidth - 8;
    tip.style.left = Math.min(x, maxX) + 'px';
    tip.style.top  = y + 'px';
  });
  document.addEventListener('mouseout', e => {
    const g = e.target.closest && e.target.closest('[data-pitch-tip]');
    if (!g) return;
    const rel = e.relatedTarget;
    if (rel && rel.closest && rel.closest('[data-pitch-tip]') === g) return;
    tip.style.display = 'none';
  });
});

function ev(e, tipo) {
  e.preventDefault();
  const dz = document.getElementById('drop-zone');
  if (tipo === 'over') dz.classList.add('drag-over');
  else if (tipo === 'leave') dz.classList.remove('drag-over');
  else { dz.classList.remove('drag-over'); if (e.dataTransfer.files.length) procesar(e.dataTransfer.files); }
}

async function procesar(files, opts = {}) {
  const entrantes = Array.from(files || []);
  if (!entrantes.length) return;

  let lista;
  if (opts.fromCache) {
    lista = entrantes;
  } else {
    // Sumar a los existentes (evitando duplicados por nombre)
    const previos = archivosActuales || [];
    const nombresPrev = new Set(previos.map(f => f.name));
    const realmenteNuevos = entrantes.filter(f => !nombresPrev.has(f.name));
    if (!realmenteNuevos.length && previos.length) {
      // todos eran duplicados — avisar y salir
      mostrarStatusBreve(`Ya tenías cargado: ${entrantes.map(f => f.name).join(', ')}`);
      const fi = document.getElementById('fi'); if (fi) fi.value = '';
      return;
    }
    lista = [...previos, ...realmenteNuevos];
  }

  const eraVacio = !archivosActuales.length;
  archivosActuales = lista;
  partidosSel = new Set(lista.map((_, i) => i));
  nombresPartidos = lista.map(f => f.name.replace(/\.(csv|xlsx|xls)$/i, ''));
  if (eraVacio || opts.fromCache) {
    tabActiva = 'individual';
    jugadorActivo = '';
  }
  if (!opts.fromCache) guardarEnCache(lista);
  actualizarBarraCache();

  // Reset input para permitir re-seleccionar el mismo archivo
  const fi = document.getElementById('fi'); if (fi) fi.value = '';

  await analizarConFiltro({ mostrarStatus: true });
}

function mostrarStatusBreve(msg) {
  const bar = document.getElementById('status-bar');
  const m = document.getElementById('status-msg');
  if (!bar || !m) return;
  bar.style.display = 'flex';
  m.textContent = msg;
  setTimeout(() => { bar.style.display = 'none'; }, 2500);
}

function removerPartido(idx) {
  if (!archivosActuales[idx]) return;
  const nombre = archivosActuales[idx].name;
  if (!confirm(`Quitar "${nombre}" del análisis?`)) return;
  archivosActuales = archivosActuales.filter((_, i) => i !== idx);
  if (!archivosActuales.length) {
    borrarCache();
    return;
  }
  partidosSel = new Set(archivosActuales.map((_, i) => i));
  nombresPartidos = archivosActuales.map(f => f.name.replace(/\.(csv|xlsx|xls)$/i, ''));
  guardarEnCache(archivosActuales);
  actualizarBarraCache();
  analizarConFiltro({ mostrarStatus: true });
}

function actualizarRangeBar() {
  const bar = document.getElementById('tiempo-range');
  const vals = document.getElementById('tiempo-vals');
  if (bar) {
    const a = (tMinMin / 90) * 100;
    const b = (tMaxMin / 90) * 100;
    bar.style.left  = a + '%';
    bar.style.width = (b - a) + '%';
  }
  if (vals) vals.textContent = `${tMinMin}' – ${tMaxMin}'`;
}

function onTiempo(thumb) {
  const a = parseInt(document.getElementById('t-min').value) || 0;
  const b = parseInt(document.getElementById('t-max').value) || 90;
  if (thumb === 'min' && a > b) {
    tMinMin = b; tMaxMin = b;
    document.getElementById('t-min').value = b;
  } else if (thumb === 'max' && b < a) {
    tMaxMin = a; tMinMin = a;
    document.getElementById('t-max').value = a;
  } else {
    tMinMin = a; tMaxMin = b;
  }
  actualizarRangeBar();
  if (tiempoTimer) clearTimeout(tiempoTimer);
  tiempoTimer = setTimeout(() => analizarConFiltro(), 250);
}

function presetTiempo(a, b) {
  tMinMin = a; tMaxMin = b;
  const mi = document.getElementById('t-min'), ma = document.getElementById('t-max');
  if (mi) mi.value = a;
  if (ma) ma.value = b;
  actualizarRangeBar();
  analizarConFiltro();
}

function fdTiempo(fd) {
  if (tMinMin > 0)  fd.append('t_min', String(tMinMin * 60));
  if (tMaxMin < 90) fd.append('t_max', String(tMaxMin * 60));
  return fd;
}

async function analizarConFiltro({ mostrarStatus = false } = {}) {
  datosJugadores = null;
  _notasTaggingCache = null; // recalcula notas con la selección nueva de partidos
  perfilCompararSet = null;  // resetea selección de compañeros con el nuevo set de partidos
  perfilPosicionForzada = null;
  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (mostrarStatus) {
    document.getElementById('status-bar').style.display = 'flex';
    document.getElementById('status-msg').textContent =
      archivosActuales.length === 1 ? `Analizando ${archivosActuales[0].name}...`
                                    : `Analizando ${archivosActuales.length} partidos...`;
    document.getElementById('results').innerHTML = '';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('drop-icon').textContent = '⏳';
  }

  if (!idxs.length) {
    datosActuales = null;
    document.getElementById('status-bar').style.display = 'none';
    document.getElementById('results').innerHTML =
      '<p style="color:var(--gris5);text-align:center;padding:2rem">Seleccioná al menos un partido.</p>';
    renderFiltroPartidos();
    return;
  }

  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fdTiempo(fd);

  try {
    const r = await fetch('/api/analizar', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok || data.error) { showError(data.error || 'Error'); document.getElementById('drop-icon').textContent = '❌'; return; }
    datosActuales = data;
    if (data.partidos && data.partidos.length === idxs.length) {
      idxs.forEach((origIdx, k) => { nombresPartidos[origIdx] = data.partidos[k]; });
    }
    document.getElementById('status-bar').style.display = 'none';
    document.getElementById('drop-icon').textContent = '✅';
    renderResultados(data);
    renderNotasTagging(); // tarjeta global de errores de tagging, debajo de los archivos
    // Precarga del plantel + selección automática del jugador más destacado
    fetchJugadoresStats().then(ds => {
      if (!ds) return;
      datosJugadores = ds;
      // Inicializar selección de jugadores si está vacía
      if (!jugadoresSel.size) {
        jugadoresSel = new Set(Object.keys(ds));
      }
      _sincronizarChipsJugadores();
      if (!jugadorActivo) {
        jugadorActivo = jugadorDestacado(ds);
        const inp = document.getElementById('jug-select');
        if (inp && jugadorActivo) inp.value = jugadorActivo;
      }
      if (jugadorActivo) renderIndividual(jugadorActivo);
      // Re-render del panel activo cuando llegan stats nuevas
      if (tabActiva === 'colectivo') renderColContent();
      else if (tabActiva === 'creador') renderCreadorContent();
    });
  } catch(e) {
    showError('No se pudo conectar con el servidor. ¿Está corriendo app.py?');
    document.getElementById('drop-icon').textContent = '❌';
  }
}

function renderFiltroPartidos() {
  // Sólo re-pinta los checkboxes (sin recalcular). Útil cuando no hay datos.
  const cont = document.getElementById('part-filter');
  if (!cont) return;
  cont.querySelectorAll('input[type=checkbox]').forEach(b => {
    b.checked = partidosSel.has(parseInt(b.dataset.idx, 10));
  });
}

function showError(msg) {
  document.getElementById('status-bar').style.display = 'none';
  const el = document.getElementById('error-box');
  el.textContent = '⚠ ' + msg; el.style.display = 'block';
}

async function exportarPDF(tipo) {
  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (!idxs.length) { alert('Seleccioná al menos un partido'); return; }
  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fdTiempo(fd);
  if (tipo === 'individual') {
    const sel = document.getElementById('jug-select');
    if (!sel || !sel.value) { alert('Seleccioná un jugador primero'); return; }
    fd.append('jugador', sel.value);
  }
  const url = tipo === 'colectivo' ? '/api/pdf/colectivo' : '/api/pdf/individual';
  const r = await fetch(url, { method: 'POST', body: fd });
  if (!r.ok) { alert('Error al generar PDF'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${tipo}_${(datosActuales?.partido||'partido').replace(/\s+/g,'_')}.pdf`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function switchTab(id, el) {
  tabActiva = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
  // Auto-init de paneles que dependen de datosJugadores
  if (id === 'colectivo' || id === 'creador') {
    (async () => {
      if (!datosJugadores) datosJugadores = await fetchJugadoresStats();
      if (datosJugadores && !jugadoresSel.size) {
        jugadoresSel = new Set(Object.keys(datosJugadores));
        document.querySelectorAll('[data-jug]').forEach(b => { b.checked = jugadoresSel.has(b.dataset.jug); });
      }
      if (id === 'colectivo') renderColContent();
      else if (id === 'creador') renderCreadorContent();
    })();
  }
  // Re-sync del Mapa en cancha al cambiar de tab: el panel recién visible refleja el estado actual de filtros/modo
  if (typeof _redibujarCancha === 'function') _redibujarCancha();
}

function renderResultados(d) {
  const { partido, jugadores, colectivas: col, minutos, cambios, goles } = d;
  const gp = col.goles_propios;
  const gr = col.goles_rivales;
  const lp = col.llegadas_prop;
  const lr = col.llegadas_riv;
  const sp = col.salidas_prop;
  const sr = col.salidas_riv;
  const cp = col.centros_prop;
  const cr = col.centros_riv;

  function bar(val, max, cls) {
    const pct = max > 0 ? Math.min(100, Math.round(val/max*100)) : 0;
    return `<div class="bar-fill-${cls}" style="width:${pct}%"></div>`;
  }

  function compareRow(label, vr, vv) {
    // Barras que PARTEN DEL CENTRO hacia afuera (pedido A. Urricelqui):
    // River crece hacia la izquierda, rival hacia la derecha. Escala: el mayor
    // del par llega al 100% de su track; el otro queda proporcional.
    const max = Math.max(vr||0, vv||0, 1);
    const wr = Math.round((vr||0)/max*100);
    const wv = Math.round((vv||0)/max*100);
    return `<div class="bar-row">
      <span class="bar-val river">${vr||0}</span>
      <div class="bar-track" style="flex:1;display:flex;justify-content:flex-end">
        <div class="bar-fill-river" style="width:${wr}%"></div>
      </div>
      <span style="font-size:10px;color:var(--gris5);min-width:140px;text-align:center">${label}</span>
      <div class="bar-track" style="flex:1">
        <div class="bar-fill-rival" style="width:${wv}%"></div>
      </div>
      <span class="bar-val">${vv||0}</span>
    </div>`;
  }

  function miniCard(label, val, color='') {
    return `<div class="mini-card"><div class="mini-label">${label}</div><div class="mini-val ${color}">${val}</div></div>`;
  }

  // Grilla de salidas Sector × Tipo con % de progresión por celda (pedido A.U.:
  // el gráfico anterior repetía el mismo valor en todas las celdas).
  function gridSalidas(s) {
    const m = s.matriz || {};
    const filas = ['Izquierda', 'Eje', 'Derecha'];
    const cols = ['Corta', 'Larga'];
    const celda = (sec, tipo) => {
      const c = (m[sec] && m[sec][tipo]) || { n: 0, progresa: 0 };
      if (!c.n) return `<td style="padding:6px 10px;text-align:center;color:var(--gris4);border:1px dashed var(--gris3);font-size:11px">—</td>`;
      const pct = Math.round(c.progresa / c.n * 100);
      const col = pct >= 50 ? 'var(--verde)' : pct >= 30 ? 'var(--ambar)' : 'var(--gris5)';
      return `<td style="padding:6px 10px;text-align:center;border:1px dashed var(--gris3)">
        <span style="font-size:14px;font-weight:800">${c.progresa}/${c.n}</span>
        <span style="font-size:10px;color:${col};display:block">(${pct}% progresa)</span>
      </td>`;
    };
    const filaSec = (sec) => {
      const tot = cols.reduce((a, t) => a + (((m[sec]||{})[t]||{}).n || 0), 0);
      const prog = cols.reduce((a, t) => a + (((m[sec]||{})[t]||{}).progresa || 0), 0);
      const pct = tot ? Math.round(prog / tot * 100) : 0;
      return `<tr>
        <td style="padding:6px 8px;font-size:10px;color:var(--gris5);font-weight:700;text-transform:uppercase">${sec === 'Izquierda' ? 'IZQ' : sec === 'Derecha' ? 'DER' : 'EJE'}</td>
        ${cols.map(t => celda(sec, t)).join('')}
        <td style="padding:6px 8px;font-size:11px;color:${tot ? (pct>=50?'var(--verde)':'var(--gris5)') : 'var(--gris4)'};font-weight:700">${tot ? `(${pct}%)` : ''}</td>
      </tr>`;
    };
    return `<div class="sec-title">Salidas por sector y tipo</div>
    <table style="width:100%;border-collapse:collapse;margin-top:4px">
      <tr>
        <td></td>
        <td style="text-align:center;font-size:9px;color:var(--gris5);text-transform:uppercase;letter-spacing:.5px;padding-bottom:2px">En corto</td>
        <td style="text-align:center;font-size:9px;color:var(--gris5);text-transform:uppercase;letter-spacing:.5px;padding-bottom:2px">En largo</td>
        <td style="text-align:center;font-size:9px;color:var(--gris5)">% prog.</td>
      </tr>
      ${filas.map(filaSec).join('')}
    </table>`;
  }

  // Mapa de remates sobre media cancha, desde el tagging COLECTIVO (llegadas +
  // goles), no de la suma individual.
  //   lado 'riv'  → media cancha propia, nuestro arco a la izquierda (nos rematan)
  //   lado 'prop' → media cancha rival, arco rival a la derecha (rematamos)
  // Los dos quedan espejados para leerlos juntos: ellos atacan ←, nosotros →.
  function mapaRemates(puntos, lado) {
    const esProp = lado === 'prop';
    if (!puntos.length) {
      return `<p style="font-size:11px;color:var(--gris5);padding:8px 0">Sin remates ${esProp ? 'propios' : 'rivales'} con coordenadas.</p>`;
    }
    const COL = { gol: null, arco: '#3ecf8e', afuera: '#CC0000', bloqueado: '#f5a623',
                  incompleto: '#5a5a5a', sin_dato: '#6b6b6b' };
    // viewBox 0-60 en x: para los propios se traslada la mitad de ataque (x 60-120)
    let svg = `<svg viewBox="0 0 60 80" style="width:100%;max-width:340px;height:auto;background:#141414;border-radius:6px;display:block;margin:6px auto">`;
    svg += `<rect x="0.5" y="0.5" width="59" height="79" fill="none" stroke="#3a3a3a" stroke-width="0.5"/>`;
    if (esProp) {
      // arco rival a la derecha
      svg += `<rect x="42" y="18" width="18" height="44" fill="none" stroke="#3a3a3a" stroke-width="0.5"/>`;
      svg += `<rect x="54" y="30" width="6" height="20" fill="none" stroke="#3a3a3a" stroke-width="0.5"/>`;
      svg += `<path d="M 42 33.5 A 9.15 9.15 0 0 1 42 46.5" fill="none" stroke="#3a3a3a" stroke-width="0.5"/>`;
      svg += `<text x="3" y="77" fill="#666" font-size="3">atacamos →</text>`;
    } else {
      // nuestro arco a la izquierda
      svg += `<rect x="0" y="18" width="18" height="44" fill="none" stroke="#3a3a3a" stroke-width="0.5"/>`;
      svg += `<rect x="0" y="30" width="6" height="20" fill="none" stroke="#3a3a3a" stroke-width="0.5"/>`;
      svg += `<path d="M 18 33.5 A 9.15 9.15 0 0 0 18 46.5" fill="none" stroke="#3a3a3a" stroke-width="0.5"/>`;
      svg += `<text x="57" y="77" fill="#666" font-size="3" text-anchor="end">← atacan ellos</text>`;
    }
    const ETIQ = { gol: 'Gol', arco: 'Remate al arco', bloqueado: 'Remate bloqueado',
                   afuera: 'Remate afuera',
                   incompleto: 'Llegada sin remate (incompleta)',
                   sin_dato: 'Llegada sin resultado cargado' };
    let hayGris = 0, hayIncompleto = 0;
    puntos.forEach(p => {
      // propios: x viene 60-120 (mitad de ataque) → se lleva a 0-60 del viewBox
      const xRaw = esProp ? p[0] - 60 : p[0];
      const x = Math.min(59, Math.max(1, xRaw));
      const y = 80 - Math.min(79, Math.max(1, p[1]));  // flip vertical como el resto de los mapas
      const res = COL.hasOwnProperty(p[2]) || p[2] === 'gol' ? p[2] : 'sin_dato';
      if (res === 'sin_dato') hayGris++;
      if (res === 'incompleto') hayIncompleto++;
      // Tooltip: qué fue, cuándo y de qué jugada salió
      const partes = [ (res === 'gol' && !esProp) ? 'Gol rival' : ETIQ[res] ];
      if (p[3] != null) partes.push(`${Math.floor(p[3] / 60)}'${String(Math.floor(p[3] % 60)).padStart(2,'0')}"`);
      const ctx = [p[5], p[6] ? `por ${String(p[6]).toLowerCase()}` : null].filter(Boolean).join(' ');
      if (ctx) partes.push(ctx);
      const tip = partes.join(' · ').replace(/"/g, '&quot;');
      if (res === 'gol') {
        svg += `<g data-pitch-tip="${tip}" style="cursor:help"><image href="/static/pelota.png" x="${x-1.8}" y="${y-1.8}" width="3.6" height="3.6"/>` +
               `<circle cx="${x}" cy="${y}" r="3" fill="transparent"/></g>`;
      } else {
        svg += `<g data-pitch-tip="${tip}" style="cursor:help">` +
               `<circle cx="${x}" cy="${y}" r="3" fill="transparent"/>` +
               `<circle cx="${x}" cy="${y}" r="1.4" fill="${COL[res]}" opacity="${res === 'sin_dato' ? 0.6 : 0.9}"/></g>`;
      }
    });
    svg += `</svg>`;
    svg += `<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:9.5px;color:var(--gris5);margin-top:2px">
      <span>⚽ Gol</span>
      <span style="color:#3ecf8e">● Al arco</span>
      <span style="color:#f5a623">● Bloqueado</span>
      <span style="color:#CC0000">● Afuera</span>
      ${hayIncompleto ? `<span style="color:#5a5a5a">● Llegada sin remate</span>` : ''}
      ${hayGris ? `<span style="color:#6b6b6b">● Sin resultado cargado</span>` : ''}
    </div>`;
    if (hayGris || hayIncompleto) {
      const partes = [];
      if (hayIncompleto) partes.push(`${hayIncompleto} llegada(s) que no terminaron en remate`);
      if (hayGris) partes.push(`${hayGris} sin el resultado taggeado`);
      svg += `<div style="font-size:9.5px;color:var(--gris5);text-align:center;margin-top:4px;line-height:1.4">
        ${partes.join(' · ')} — no se cuentan como remate.
      </div>`;
    }
    return svg;
  }

  // Resumen de un set de remates: total, al arco y efectividad — para leer los
  // dos mapas comparándolos, no como dos dibujos sueltos.
  // Resumen que va debajo de cada mapa. Usa EXACTAMENTE las mismas fuentes que
  // el resto del panel, para que los números coincidan:
  //   · Goles   → categoría "Goles Propios"/"Goles Rivales" (el marcador)
  //   · Resto   → llegadas_prop / llegadas_riv
  // Contar los puntos dibujados daría otro número, porque las llegadas sin
  // coordenadas son remates igual pero no se pueden ubicar en la cancha.
  function resumenRemates(det, golesDet, puntos) {
    if (!det) return '';
    const arco  = det.tiros_arco || 0;                 // en el tagging, un gol también es "Arco"
    const goles = (golesDet && golesDet.total) || 0;   // marcador real
    const n = arco + (det.afuera || 0) + (det.bloqueado || 0);
    if (!n && !goles) return '';
    const pctArco = n ? Math.round(arco / n * 100) : 0;
    const colArco = pctArco >= 50 ? 'green' : pctArco >= 30 ? 'amber' : '';
    let html = `<div class="mini-grid" style="grid-template-columns:repeat(3,1fr);margin-top:6px">
      ${miniCard('Remates', n)}
      ${miniCard('Al arco', `${arco} (${pctArco}%)`, colArco)}
      ${miniCard('Goles', goles, goles ? 'green' : '')}
    </div>`;

    const avisos = [];
    // Goles que no se pueden ubicar en la cancha (ni el gol ni su llegada
    // tienen coordenadas): explica por qué se cuentan menos pelotitas.
    const golesDibujados = (puntos || []).filter(p => p[2] === 'gol').length;
    if (goles > golesDibujados) {
      avisos.push(`${goles - golesDibujados} gol(es) sin coordenadas`);
    }

      jugadorActivo = '';
    }
  }
}

let comboHover = -1;

function comboAbrir() {
  // Al hacer foco, mostrar TODOS los jugadores (no filtrar por el nombre ya elegido)
  // y seleccionar el texto actual para que escribir lo reemplace directo.
  const inp = document.getElementById('jug-select');
  if (inp) inp.select();
  comboFiltrar('');
}

function comboCerrar() {
  document.getElementById('jug-combo-list')?.classList.remove('open');
  comboHover = -1;
}

function comboFiltrar(q) {
  const lista = document.getElementById('jug-combo-list');
  if (!lista || !datosActuales) return;
  const txt = (q || '').toLowerCase().trim();
  const todos = datosActuales.jugadores || [];
  const filtrados = txt ? todos.filter(j => j.toLowerCase().includes(txt)) : todos;
  comboHover = -1;
  if (!filtrados.length) {
    lista.innerHTML = '<div class="combo-empty">Sin coincidencias</div>';
  } else {
    lista.innerHTML = filtrados.map((j, i) =>
      `<div class="combo-item" data-jug="${j}" onmousedown="comboElegir('${j.replace(/'/g, "\\'")}')">${j}</div>`
    ).join('');
  }
  lista.classList.add('open');
}

function comboElegir(jugador) {
  document.getElementById('jug-select').value = jugador;
  comboCerrar();
  renderIndividual(jugador);
}

function comboTecla(e) {
  const lista = document.getElementById('jug-combo-list');
  const items = lista?.querySelectorAll('.combo-item') || [];
  if (e.key === 'ArrowDown') { e.preventDefault(); comboHover = Math.min(items.length - 1, comboHover + 1); pintarHover(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); comboHover = Math.max(0, comboHover - 1); pintarHover(items); }
  else if (e.key === 'Enter') { e.preventDefault(); if (comboHover >= 0 && items[comboHover]) comboElegir(items[comboHover].dataset.jug); }
  else if (e.key === 'Escape') comboCerrar();
}

function pintarHover(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === comboHover));
  if (comboHover >= 0) items[comboHover]?.scrollIntoView({ block: 'nearest' });
}

function renderIndividual(jugador) {
  if (!jugador || !datosActuales) return;
  // Si cambia el jugador activo, resetear el set de compañeros y la posición forzada
  if (jugadorActivo !== jugador) {
    perfilCompararSet = null;
    perfilPosicionForzada = null;
  }
  jugadorActivo = jugador;
  mapaTerJugsPorZona = null; // el filtro de zona territorial no aplica a la vista individual

  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (!idxs.length) {
    document.getElementById('ind-content').innerHTML =
      '<p style="color:var(--gris5)">Seleccioná al menos un partido.</p>';
    return;
  }

  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fd.append('jugador', jugador);
  fdTiempo(fd);

  // Stats individuales + coordenadas en paralelo
  Promise.all([
    fetch('/api/individual',     { method: 'POST', body: fd }).then(r => r.json()),
    fetchCoordsJugador(jugador),
  ]).then(([ind, coords]) => {
    coordsActuales = coords || [];
    document.getElementById('ind-content').innerHTML = buildIndHTML(ind);
    iniciarMaquinaEscribir();
  }).catch(() => {
    coordsActuales = [];
    document.getElementById('ind-content').innerHTML = `<p style="color:var(--gris5)">Sin datos individuales disponibles para ${jugador}.</p>`;
  });
}

function jugadorDestacado(ds) {
  if (!ds) return '';
  const arr = Object.values(ds);
  if (!arr.length) return '';
  // Score: actividad + aporte ofensivo · sirve como "más destacado del partido"
  arr.sort((a, b) => {
    const sa = (a.intervenciones||0) + (a.goles||0)*15 + (a.asistencias||0)*8 + (a.pases_clave||0)*2;
    const sb = (b.intervenciones||0) + (b.goles||0)*15 + (b.asistencias||0)*8 + (b.pases_clave||0)*2;
    return sb - sa;
  });
  return arr[0].jugador;
}

function presetJugadoresCol(preset) {
  if (!datosJugadores) return;
  const todos = Object.keys(datosJugadores);
  // Para clasificación por línea sólo considerar jugadores con volumen
  const conVolumen = todos.filter(j =>
    (datosJugadores[j].minutos || 0) >= 15 &&
    (datosJugadores[j].acciones_xy || 0) >= 10
  );

  if (preset === 'todos') {
    jugadoresSel = new Set(todos);
  } else if (preset === 'ninguno') {
    jugadoresSel = new Set();
  } else if (preset === 'top5') {
    const ord = todos.slice().sort((a,b) =>
      (datosJugadores[b].minutos||0) - (datosJugadores[a].minutos||0)).slice(0, 5);
    jugadoresSel = new Set(ord);
  } else if (preset === 'titulares11') {
    // Titulares ordenados por minutos, top 11
    const tit = todos.filter(j => datosJugadores[j].condicion === 'Titular');
    const ord = tit.sort((a,b) =>
      (datosJugadores[b].minutos||0) - (datosJugadores[a].minutos||0)).slice(0, 11);
    jugadoresSel = new Set(ord);
  } else if (preset === 'suplentes') {
    jugadoresSel = new Set(todos.filter(j => datosJugadores[j].condicion === 'Suplente'));
  } else if (preset === 'delanteros' || preset === 'mediocampistas' || preset === 'defensores') {
    // Categorización por altura (centro_grav_x). 0-120 → 3 tercios
    // Más adelantado (x mayor) = delantero
    const ord = [...conVolumen].sort((a,b) =>
      (datosJugadores[a].centro_grav_x||0) - (datosJugadores[b].centro_grav_x||0));
    const n = ord.length;
    if (n < 3) { jugadoresSel = new Set(ord); }
    else {
      const tercio = Math.max(2, Math.round(n / 3));
      if (preset === 'defensores')          jugadoresSel = new Set(ord.slice(0, tercio));
      else if (preset === 'mediocampistas') jugadoresSel = new Set(ord.slice(tercio, n - tercio));
      else /* delanteros */                 jugadoresSel = new Set(ord.slice(n - tercio));
    }
  }
  _sincronizarChipsJugadores();
  _refrescarColYCreador();
}

function sumarJugadores(lista) {
  const out = {};
  lista.forEach(j => {
    const st = datosJugadores[j];
    if (!st) return;
    Object.entries(st).forEach(([k,v]) => {
      if (typeof v === 'number') out[k] = (out[k]||0) + v;
    });
  });
  // Recalcular todos los porcentajes / efectividades sobre los totales sumados
  // (caso contrario quedaron sumados los % de cada jugador: 50%+75%+... = 766%)
  const pt = out.pases_total || 0;
  out.pases_efect = pt ? Math.round((out.pases_completos||0)/pt*100) : 0;
  // Efectividades de remate (global + por superficie)
  const recEf = (pre) => {
    const arco = out[pre+'arco']||0, gol = out[pre+'gol']||0, tot = out[pre+'total']||0;
    out[pre+'efect'] = tot ? Math.round((arco+gol)/tot*100) : 0;
  };
  const rTot = out.remates_total||0;
  out.remates_efect = rTot ? Math.round(((out.remates_arco||0)+(out.remates_gol||0))/rTot*100) : 0;
  ['rem_cab_','rem_pieh_','rem_piei_'].forEach(recEf);
  return out;
}

function promediarJugadores(lista) {
  // Promedio por jugador — base honesta para comparar el grupo contra el plantel
  const n = lista.length;
  if (!n) return {};
  const suma = sumarJugadores(lista);
  const out = {};
  Object.entries(suma).forEach(([k, v]) => {
    if (typeof v === 'number') out[k] = Math.round((v / n) * 10) / 10;
  });
  // Para % la división simple sirve (es promedio de porcentajes)
  // Pero re-deriva efectividad de pase del agregado
  const pt = suma.pases_total || 0;
  out.pases_efect = pt ? Math.round((suma.pases_completos||0)/pt*100) : 0;
  // Reconstruir centro de gravedad y dispersión desde sumas crudas del grupo
  if (suma.acciones_xy) {
    out.centro_grav_x = Math.round(suma._sum_x / suma.acciones_xy * 10) / 10;
    out.centro_grav_y = Math.round(suma._sum_y / suma.acciones_xy * 10) / 10;
    const var_x = suma._sum_x2 / suma.acciones_xy - (suma._sum_x / suma.acciones_xy) ** 2;
    const var_y = suma._sum_y2 / suma.acciones_xy - (suma._sum_y / suma.acciones_xy) ** 2;
    out.dispersion_x = var_x > 0 ? Math.round(Math.sqrt(var_x) * 10) / 10 : 0;
    out.dispersion_y = var_y > 0 ? Math.round(Math.sqrt(var_y) * 10) / 10 : 0;
    out.pct_ultimo_tercio = Math.round((suma.acciones_ult3||0) / suma.acciones_xy * 100);
    out.pct_area = Math.round((suma.acciones_area||0) / suma.acciones_xy * 100);
  }
  if (suma.acciones_destino) {
    out.progresion_media = Math.round(suma._sum_prog / suma.acciones_destino * 10) / 10;
    out.distancia_media = Math.round(suma._sum_dist / suma.acciones_destino * 10) / 10;
    out.pct_progresivo = Math.round((suma.acciones_progresivas||0) / suma.acciones_destino * 100);
  }
  return out;
}

function dibujarScatter(jugadores) {
  const W = 760, H = 460, padL = 56, padR = 70, padT = 18, padB = 50;
  const xLab = METRICAS.find(m=>m[0]===xMetric)?.[1] || xMetric;
  const yLab = METRICAS.find(m=>m[0]===yMetric)?.[1] || yMetric;
  const etiquetas = datosJugadores ? (function() {
    // Reusa la misma lógica que el PDF: apellidos repetidos → "Apellido X."
    const partes = {};
    jugadores.forEach(n => {
      const p = n.trim().split(/\s+/);
      const ap = (p[p.length - 1] || n).toLowerCase();
      partes[ap] = (partes[ap] || 0) + 1;
    });
    const out = {};
    jugadores.forEach(n => {
      const p = n.trim().split(/\s+/);
      const ap = p[p.length - 1] || n;
      if (partes[ap.toLowerCase()] > 1 && p.length > 1) {
        out[n] = `${ap.slice(0,8)} ${p[0][0].toUpperCase()}.`;
      } else {
        out[n] = ap.slice(0, 9);
      }
    });
    return out;
  })() : {};
  const pts = jugadores.map(j => ({
    nombre: j,
    label: etiquetas[j] || j.split(' ').slice(-1)[0].slice(0, 9),
    x: Number(datosJugadores[j]?.[xMetric] || 0),
    y: Number(datosJugadores[j]?.[yMetric] || 0),
  }));
  const xMax = Math.max(1, ...pts.map(p=>p.x));
  const yMax = Math.max(1, ...pts.map(p=>p.y));
  const sx = v => padL + (v/xMax)*(W-padL-padR);
  const sy = v => H-padB - (v/yMax)*(H-padT-padB);
  const xAvg = pts.reduce((a,p)=>a+p.x,0)/pts.length;
  const yAvg = pts.reduce((a,p)=>a+p.y,0)/pts.length;

  const ticks = (max) => {
    const step = Math.ceil(max/5) || 1;
    const out = [];
    for (let v=0; v<=max; v+=step) out.push(v);
    return out;
  };

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="scatter-svg">`;
  // Grid + ticks X
  ticks(xMax).forEach(v => {
    const x = sx(v);
    svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H-padB}" stroke="#2a2a2a"/>`;
    svg += `<text x="${x}" y="${H-padB+14}" fill="#777" font-size="10" text-anchor="middle">${v}</text>`;
  });
  // Grid + ticks Y
  ticks(yMax).forEach(v => {
    const y = sy(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#2a2a2a"/>`;
    svg += `<text x="${padL-8}" y="${y+3}" fill="#777" font-size="10" text-anchor="end">${v}</text>`;
  });
  // Cuadrantes (medias)
  svg += `<line x1="${sx(xAvg)}" y1="${padT}" x2="${sx(xAvg)}" y2="${H-padB}" stroke="#f5a623" stroke-dasharray="4,4" opacity="0.5"/>`;
  svg += `<line x1="${padL}" y1="${sy(yAvg)}" x2="${W-padR}" y2="${sy(yAvg)}" stroke="#f5a623" stroke-dasharray="4,4" opacity="0.5"/>`;
  // Ejes
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#555"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#555"/>`;
  // Labels
  svg += `<text x="${(W+padL-padR)/2}" y="${H-10}" fill="#ccc" font-size="12" text-anchor="middle">${xLab}</text>`;
  svg += `<text x="${padL-45}" y="${(H+padT-padB)/2}" fill="#ccc" font-size="12" text-anchor="middle" transform="rotate(-90 ${padL-45} ${(H+padT-padB)/2})">${yLab}</text>`;
  // Renderizado: dots primero (siempre), labels con anti-colisión multi-posición
  const minX = padL + 2, maxX = W - padR - 2;
  const minY = padT + 6, maxY = H - padB - 4;
  const FONT = 8.5, CHAR_W = 4.4, ROW_H = 9;
  const dotR = pts.length > 18 ? 3.2 : 4;
  // 1) Jitter para dots con coords idénticas (varios jugadores con mismo valor)
  const buckets = {};
  pts.forEach(p => {
    const key = `${Math.round(p.x*10)},${Math.round(p.y*10)}`;
    if (!buckets[key]) buckets[key] = [];
    buckets[key].push(p);
  });
  Object.values(buckets).forEach(group => {
    if (group.length < 2) { group[0]._jx = 0; group[0]._jy = 0; return; }
    const r = dotR + 1.5;
    group.forEach((p, i) => {
      const a = (i / group.length) * 2 * Math.PI;
      p._jx = Math.cos(a) * r;
      p._jy = Math.sin(a) * r;
    });
  });
  // 2) Dibujar todos los dots (con jitter aplicado)
  pts.forEach(p => {
    const cx = sx(p.x) + (p._jx || 0);
    const cy = sy(p.y) + (p._jy || 0);
    p.cx = cx; p.cy = cy;
    svg += `<circle class="scatter-dot" cx="${cx}" cy="${cy}" r="${dotR}" fill="#CC0000" opacity="0.85"><title>${p.nombre}\n${xLab}: ${p.x}\n${yLab}: ${p.y}</title></circle>`;
  });
  // 2) Posicionar labels: 4 posiciones candidatas, eliminar si no entra ni evita colisión
  const placed = []; // bounding boxes de labels ya puestos {x1,y1,x2,y2}
  const overlaps = (b) => placed.some(q => !(b.x2 < q.x1 || b.x1 > q.x2 || b.y2 < q.y1 || b.y1 > q.y2));
  // Orden: priorizo los puntos más extremos (mayor producto x*y) — los outliers se etiquetan primero
  const ordenado = [...pts].sort((a,b) => (b.x + b.y) - (a.x + a.y));
  ordenado.forEach(p => {
    const w = p.label.length * CHAR_W + 2;
    const candidatas = [
      { x: p.cx + dotR + 3,         y: p.cy + 3,            anchor: 'start'  },  // derecha
      { x: p.cx - dotR - 3,         y: p.cy + 3,            anchor: 'end'    },  // izquierda
      { x: p.cx,                    y: p.cy - dotR - 3,     anchor: 'middle' },  // arriba
      { x: p.cx,                    y: p.cy + dotR + 9,     anchor: 'middle' },  // abajo
    ];
    for (const pos of candidatas) {
      const w2 = w / 2;
      const x1 = pos.anchor === 'end' ? pos.x - w : pos.anchor === 'middle' ? pos.x - w2 : pos.x;
      const x2 = x1 + w;
      const y1 = pos.y - ROW_H + 1, y2 = pos.y + 2;
      if (x1 < minX || x2 > maxX || y1 < minY || y2 > maxY) continue;
      if (overlaps({ x1, y1, x2, y2 })) continue;
      placed.push({ x1, y1, x2, y2 });
      svg += `<text x="${pos.x}" y="${pos.y}" fill="#f5f5f5" font-size="${FONT}" text-anchor="${pos.anchor}" style="paint-order:stroke;stroke:#0a0a0a;stroke-width:2.4;stroke-linejoin:round">${p.label}</text>`;
      return;
    }
    // No entra ningún label sin colisionar — se omite (queda accesible vía hover)
  });
  svg += '</svg>';
  return svg;
}

function renderColContent() {
  const cont = document.getElementById('col-content');
  if (!cont) return;
  if (!datosJugadores) { cont.innerHTML = '<p style="color:var(--gris5)">Cargando...</p>'; return; }
  const seleccionados = Array.from(jugadoresSel).filter(j => datosJugadores[j]);
  if (!seleccionados.length) {
    cont.innerHTML = '<p style="color:var(--gris5)">Seleccioná al menos un jugador.</p>';
    coordsActuales = [];
    return;
  }
  const sum = sumarJugadores(seleccionados);
  sum.jugador = `Colectivo · ${seleccionados.length} jugadores`;
  sum.condicion = `${seleccionados.length} jugadores`;
  sum.__promedio = promediarJugadores(seleccionados);
  sum.__esColectivo = true;
  sum.__seleccionados = seleccionados;
  // Con TODO el plantel seleccionado, goles y remates se toman del informe
  // colectivo: hay goles que no quedan taggeados a ningún jugador, así que la
  // suma individual da menos que el marcador real.
  sum.__todos = seleccionados.length === Object.keys(datosJugadores).length;
  // Cargar coords combinadas de TODOS los jugadores seleccionados antes de pintar el HTML
  fetchCoordsMulti(seleccionados).then(coords => {
    coordsActuales = coords || [];
    cont.innerHTML = buildIndHTML(sum) + seccionRedPases();
    renderMapaTerritorial(); // dentro del HTML del colectivo
  });
}

// ─── Red de conexiones de pases (carga diferida) ────────────────────────────
// El receptor se infiere: siguiente acción individual de otro jugador dentro
// de 6s del pase completado (~85% de pases conectados, ~94% plausibles).
let _redPasesCache = null;

function seccionRedPases() {
  return `
  <div class="pitch-section" style="margin-top:1.2rem">
    <div class="pitch-head">
      <div class="perfil-titulo">🔗 Conexiones de pases</div>
      <button class="btn" id="btn-red-pases" onclick="cargarRedPases()" style="padding:4px 12px;font-size:11px">Generar red</button>
    </div>
    <div id="red-pases-cont">
      <p style="font-size:11px;color:var(--gris5)">Tocá "Generar red" para calcular las conexiones (quién juega con quién). El receptor se infiere de la secuencia temporal del tagging — es una aproximación, no event-data exacto.</p>
    </div>
  </div>`;
}

function cargarRedPases() {
  const cont = document.getElementById('red-pases-cont');
  const btn = document.getElementById('btn-red-pases');
  if (!cont) return;
  _redPasesCache = null;  // siempre recalcular (los partidos/minutos pueden haber cambiado)
  if (btn) { btn.disabled = true; btn.textContent = 'Calculando…'; }
  cont.innerHTML = '<p style="font-size:11px;color:var(--gris5)">Calculando conexiones…</p>';
  const fd = new FormData();
  Array.from(partidosSel).sort((a,b)=>a-b).forEach(i => fd.append('archivo', archivosActuales[i]));
  fdTiempo(fd);
  fetch('/api/red-pases', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(d => {
      _redPasesCache = d;
      cont.innerHTML = dibujarRedPases(d);
      if (btn) { btn.disabled = false; btn.textContent = 'Regenerar'; }
    })
    .catch(() => {
      cont.innerHTML = '<p style="font-size:11px;color:var(--rojo)">Error al calcular la red.</p>';
      if (btn) { btn.disabled = false; btn.textContent = 'Reintentar'; }
    });
}

function dibujarRedPases(d) {
  const nodos = d.nodos || [];
  const aristas = (d.aristas || []).filter(e => e.n >= 3); // conexiones con al menos 3 pases
  if (!nodos.length) return '<p style="font-size:11px;color:var(--gris5)">Sin datos suficientes.</p>';
  const pos = {};
  nodos.forEach(n => { pos[n.jugador] = n; });
  const maxN = Math.max(1, ...aristas.map(e => e.n));
  const maxP = Math.max(1, ...nodos.map(n => n.pases));

  let svg = `<svg viewBox="0 0 120 80" style="width:100%;height:auto;background:#141414;border-radius:8px">`;
  svg += pitchLinesSvgApp('#2e2e2e');
  // Aristas (debajo de los nodos): grosor y opacidad ∝ cantidad de pases
  aristas.forEach(e => {
    const a = pos[e.de], b = pos[e.a];
    if (!a || !b) return;
    const w = 0.4 + (e.n / maxN) * 2.2;
    const op = 0.25 + (e.n / maxN) * 0.65;
    svg += `<g data-pitch-tip="${e.de} → ${e.a}: ${e.n} pases" style="cursor:help">` +
      `<line x1="${a.x}" y1="${80-a.y}" x2="${b.x}" y2="${80-b.y}" stroke="transparent" stroke-width="${Math.max(2.5, w)}"/>` +
      `<line x1="${a.x}" y1="${80-a.y}" x2="${b.x}" y2="${80-b.y}" stroke="#CC0000" stroke-width="${w}" opacity="${op}"/>` +
      `</g>`;
  });
  // Nodos: radio ∝ pases completados
  nodos.forEach(n => {
    const r = 2 + (n.pases / maxP) * 2.5;
    const y = 80 - n.y;
    svg += `<g data-pitch-tip="${n.jugador} · ${n.pases} pases" style="cursor:help">` +
      `<circle cx="${n.x}" cy="${y}" r="${r}" fill="#f5f5f5" stroke="#CC0000" stroke-width="0.6"/>` +
      `</g>`;
    const ap = n.jugador.split(/\s+/).pop().slice(0, 10);
    svg += `<text x="${n.x}" y="${y + r + 3}" fill="#ccc" font-size="2.6" text-anchor="middle" font-weight="700">${ap}</text>`;
  });
  svg += `</svg>`;
  svg += `<div style="font-size:9.5px;color:var(--gris5);text-align:center;margin-top:4px">` +
    `Línea más gruesa = más pases entre esos jugadores (mín. 3) · Nodo más grande = más pases completados · posición = ubicación media real</div>`;
  return svg;
}

// Líneas de cancha para la red (copia liviana de dibujarCancha, solo líneas)
function pitchLinesSvgApp(lc) {
  let s = '';
  s += `<rect x="0.5" y="0.5" width="119" height="79" fill="none" stroke="${lc}" stroke-width="0.4"/>`;
  s += `<line x1="60" y1="0" x2="60" y2="80" stroke="${lc}" stroke-width="0.4"/>`;
  s += `<circle cx="60" cy="40" r="9.15" fill="none" stroke="${lc}" stroke-width="0.4"/>`;
  s += `<rect x="0" y="18" width="18" height="44" fill="none" stroke="${lc}" stroke-width="0.4"/>`;
  s += `<rect x="102" y="18" width="18" height="44" fill="none" stroke="${lc}" stroke-width="0.4"/>`;
  return s;
}

function _baremoLinea() {
  if (!BAREMOS) return 'global';
  if (radarIndBase !== 'auto') return radarIndBase;
  // Auto: detectar la línea del jugador por su centro de gravedad
  const pos = _posicionDeJugador(radarIndJugador, datosJugadores);
  return (BAREMOS[pos] && Object.keys(BAREMOS[pos]).length) ? pos : 'global';
}

// Detecta la división de un partido a partir del nombre del archivo.
// Devuelve 'cuarta', 'quinta', 'sexta', 'séptima', 'octava', 'novena', o null si no detecta.
function _detectarDivision(nombreArch) {
  if (!nombreArch) return null;
  const s = nombreArch.toLowerCase();
  if (/(\b|_|^)4ta(\b|_|\s|\.|$)|cuarta/.test(s)) return 'cuarta';
  if (/(\b|_|^)5ta(\b|_|\s|\.|$)|quinta/.test(s)) return 'quinta';
  if (/(\b|_|^)6ta(\b|_|\s|\.|$)|sexta/.test(s))  return 'sexta';
  if (/(\b|_|^)7ma(\b|_|\s|\.|$)|septima|séptima/.test(s)) return 'séptima';
  if (/(\b|_|^)8va(\b|_|\s|\.|$)|octava/.test(s)) return 'octava';
  if (/(\b|_|^)9na(\b|_|\s|\.|$)|novena/.test(s)) return 'novena';
  return null;
}

// Detecta la división de los partidos actualmente seleccionados.
// Si todos son de la misma → devuelve esa. Si hay mezcla o no se detecta → null.
function _divisionDePartidosActuales() {
  const idxs = Array.from(partidosSel).sort();
  const divs = new Set();
  idxs.forEach(i => {
    const d = _detectarDivision(archivosActuales[i]?.name);
    if (d) divs.add(d);
  });
  if (divs.size !== 1) return null;
  return Array.from(divs)[0];
}

// Devuelve los nombres de los jugadores del PARTIDO ACTUAL que pertenecen
// a la misma posición que está usando el radar (def/med/atk).
// Si la escala es "global" (no por posición), devuelve TODOS los jugadores.
function _jugadoresDelGrupoActivo() {
  if (!datosJugadores) return [];
  // Posición efectiva: si está en "auto", usa la del jugador activo; si está forzada, usa la elegida.
  let pos;
  if (radarIndBase === 'auto') {
    pos = _posicionDeJugador(radarIndJugador, datosJugadores);
  } else if (radarIndBase === 'global') {
    // Sin filtro de posición → todos los jugadores
    return Object.keys(datosJugadores);
  } else {
    pos = radarIndBase;
  }
  // Calcular líneas del plantel actual y filtrar por la posición
  const visibles = Object.keys(datosJugadores).filter(j =>
    (datosJugadores[j].minutos||0) >= 20 && (datosJugadores[j].acciones_xy||0) > 0);
  if (visibles.length < 6) {
    // Plantel muy chico → no separar por línea, devolver todos
    return Object.keys(datosJugadores);
  }
  const lineas = _calcularLineasEquipo(visibles, datosJugadores);
  return Object.keys(datosJugadores).filter(j => (lineas.get(j) || 'med') === pos);
}

// Sincroniza los chips de jugadores de arriba con el grupo de comparación del radar.
// Tilda solo los jugadores que matchean el baremo activo (división + posición).
// El usuario después puede destildar/tildar manualmente.
function _sincronizarSeleccionConBaremoRadar() {
  if (chartType !== 'radar_ind' || tabActiva !== 'creador') return;
  const delGrupo = _jugadoresDelGrupoActivo();
  jugadoresSel = new Set(delGrupo);
  // Refrescar visualmente los chips
  document.querySelectorAll('[data-jug]').forEach(b => {
    b.checked = jugadoresSel.has(b.dataset.jug);
  });
}

// Selección de baremo con fallback escalonado:
//   1. División + Posición específica  (más justo, requiere ≥30 jugador-partidos)
//   2. División + global de esa categoría
//   3. Posición global (todas las divisiones mezcladas)
//   4. Global total
// Devuelve {key, baremo, label, n, niveles[]} donde niveles describe los fallbacks usados.
const MIN_N_BAREMO = 30;
function _baremoActivo() {
  if (!BAREMOS) return { key: 'global', baremo: {}, label: 'sin baremos cargados', n: 0, fallback: false };
  const division = _divisionDePartidosActuales();
  const pos = radarIndBase === 'auto'
    ? _posicionDeJugador(radarIndJugador, datosJugadores)
    : (radarIndBase === 'global' ? null : radarIndBase);
  const _n = (b) => {
    const k = Object.keys(b || {})[0];
    return k ? (b[k]?.n || 0) : 0;
  };
  // Nivel 1: división + posición
  if (division && pos && BAREMOS.divisiones?.[division]?.[pos]) {
    const b = BAREMOS.divisiones[division][pos];
    if (_n(b) >= MIN_N_BAREMO) {
      return { key: `${division}_${pos}`, baremo: b,
        label: `${POSICION_LABEL[pos]} de ${division}`, n: _n(b), fallback: false };
    }
  }
  // Nivel 2: división completa (sin separar posición)
  if (division && BAREMOS.divisiones?.[division]?.global) {
    const b = BAREMOS.divisiones[division].global;
    if (_n(b) >= MIN_N_BAREMO) {
      return { key: `${division}_global`, baremo: b,
        label: `todas las posiciones de ${division}`, n: _n(b), fallback: true,
        motivo: 'pocos datos para esa posición en esta división' };
    }
  }
  // Nivel 3: posición todas las divisiones
  if (pos && BAREMOS[pos] && _n(BAREMOS[pos]) >= MIN_N_BAREMO) {
    return { key: pos, baremo: BAREMOS[pos],
      label: `${POSICION_LABEL[pos]} (todas las divisiones)`, n: _n(BAREMOS[pos]), fallback: true,
      motivo: 'la división no se detectó o tiene pocos datos' };
  }
  // Nivel 4: global
  const g = BAREMOS.global || {};
  return { key: 'global', baremo: g,
    label: 'histórico completo (todas las divisiones mezcladas)', n: _n(g), fallback: true,
    motivo: 'no se detectó división ni posición' };
}

// Paleta del radar individual a partir de los colores personalizados del dashboard.
function _radarPaletaInd() {
  const c = radarIndColores;
  const bg = radarIndBgTransparente ? 'transparent' : c.bg;
  return {
    bg,
    grid:   c.grilla,
    label:  c.texto,
    titulo: c.texto,
    sub:    c.texto,
    fill:   c.jugador, fillOp: 0.22,
    stroke: c.jugador,
    num:    c.numeros,
    // El contorno de cada vértice usa el color de fondo para que "respire" sobre el relleno;
    // con fondo transparente caemos a un oscuro neutro.
    vert:   radarIndBgTransparente ? '#0a0a0a' : c.bg,
  };
}

// Presets rápidos que rellenan los colores personalizados.
