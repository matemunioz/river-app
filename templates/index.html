    },
  };
  const conf = cfg[key];
  if (!conf) return '';

  // Filtro válido para esta métrica (reseteamos si cambió de card)
  if (!conf.filtros.find(f => f[0] === resumenFiltro)) resumenFiltro = conf.filtros[0][0];
  const selFiltro = conf.filtros.find(f => f[0] === resumenFiltro);

  // Valores por partido con el filtro aplicado
  const filas = partidosData.map((p, i) => {
    const nom = partidoNombres[i] || p.partido || `Partido ${i+1}`;
    const rival = _rivalDePartido(nom) || nom;
    return { rival, nom, valor: selFiltro[2](p), extra: conf.extra ? conf.extra(p) : '' };
  });
  const maxV = Math.max(1, ...filas.map(f => Math.abs(f.valor)));
  const total = filas.reduce((s,f) => s + (f.valor||0), 0);
  const prom = filas.length ? (total / filas.length).toFixed(1) : '0';

  const chips = conf.filtros.map(f => `
    <button class="chip-toggle ${resumenFiltro===f[0]?'active':''}" onclick="setResumenFiltro('${f[0]}')">${f[1]}</button>
  `).join('');

  const filasHtml = filas.map(f => {
    const pct = (Math.abs(f.valor) / maxV) * 100;
    const color = f.valor < 0 ? '#ff6666' : 'var(--rojo)';
    return `<div class="det-item" style="gap:14px">
      <span style="min-width:140px"><b>vs ${f.rival}</b><span style="color:var(--gris5);font-weight:400;font-size:10.5px">${f.extra}</span></span>
      <div style="flex:1;height:8px;background:var(--gris3);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${pct.toFixed(1)}%;background:${color};border-radius:4px"></div>
      </div>
      <span class="det-tag" style="min-width:42px;text-align:right">${f.valor}</span>
    </div>`;
  }).join('');

  return `<div class="plantel-detalle-card">
    <div class="plantel-detalle-head">
      <div class="plantel-detalle-titulo">${conf.titulo}</div>
      <button class="plantel-detalle-x" onclick="toggleResumenDetalle('${key}')" title="Cerrar">×</button>
    </div>
    <div class="plantel-detalle-expl">${conf.explicacion}</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">${chips}</div>
    ${filasHtml}
    <div style="display:flex;justify-content:space-between;margin-top:14px;padding-top:10px;border-top:1px solid var(--gris3);font-size:11px;color:var(--gris5)">
      <span>Total: <b style="color:var(--blanco)">${total}</b></span>
      <span>Promedio por partido: <b style="color:var(--blanco)">${prom}</b></span>
      <span>Filtro activo: <b style="color:var(--rojo)">${selFiltro[1]}</b></span>
    </div>
  </div>`;
}

function renderPlantelDetalle(key) {
  if (!key) return '';
  const nPart = archivosActuales.length || 1;
  const partidoNombres = (datosActuales?.partidos && datosActuales.partidos.length) ? datosActuales.partidos : nombresPartidos;
  const minutos = datosActuales?.minutos || [];
  const cambios = datosActuales?.cambios || [];

  let titulo = '', explicacion = '', contenido = '';

  if (key === 'partidos') {
    titulo = '📋 Partidos analizados';
    explicacion = `Listado de los ${nPart} partido(s) cargado(s) actualmente. Los rivales se infieren del nombre del Timeline en cada CSV ("River vs X" → "X").`;
    contenido = partidoNombres.map((p, i) => {
      const rival = _rivalDePartido(p);
      return `<div class="det-item"><span class="det-num">${i+1}.</span><span>${p}</span><span class="det-tag">vs ${rival}</span></div>`;
    }).join('');
  }
  else if (key === 'minutos') {
    titulo = '⏱ Minutos jugados de la división';
    explicacion = `Suma de los minutos en cancha de todos los jugadores que entraron al menos una vez. Cada minuto cuenta una vez por jugador en campo (un partido completo con 11 jugadores = 990 min de plantel).`;
    const minTot = Math.round(minutos.reduce((s,p) => s + (p.minutos||0), 0));
    const teorico = 11 * 90 * nPart;
    const utilizacion = teorico ? Math.round(minTot / teorico * 100) : 0;
    contenido =
      `<div class="det-item"><span>Total acumulado</span><span class="det-tag">${minTot} min</span></div>` +
      `<div class="det-item"><span>Teórico (11 × 90 × ${nPart})</span><span class="det-tag">${teorico} min</span></div>` +
      `<div class="det-item"><span>Promedio por partido</span><span class="det-tag">${Math.round(minTot/nPart)} min</span></div>` +
      `<div class="det-item"><span>Utilización del campo</span><span class="det-tag">${utilizacion}%</span></div>`;
  }
  else if (key === 'jugadores') {
    titulo = '👥 Jugadores utilizados';
    explicacion = `Jugadores que tuvieron al menos 1 minuto en alguno de los ${nPart} partido(s). "Titular" = arrancó al menos un partido; "Suplente" = sólo entró desde el banco. Cuenta partidos jugados (p).`;
    const titulares = minutos.filter(p => p.condicion === 'Titular').sort((a,b) => (b.minutos||0)-(a.minutos||0));
    const suplentes = minutos.filter(p => p.condicion === 'Suplente').sort((a,b) => (b.minutos||0)-(a.minutos||0));
    contenido = `<div class="det-sub">Titulares · ${titulares.length}</div>` +
      titulares.map(p => `<div class="det-item"><span>${p.jugador}</span><span class="det-tag">${p.minutos}m · ${p.partidos||1}p</span></div>`).join('') +
      `<div class="det-sub">Suplentes · ${suplentes.length}</div>` +
      (suplentes.length ? suplentes.map(p => `<div class="det-item"><span>${p.jugador}</span><span class="det-tag">${p.minutos}m · ${p.partidos||1}p</span></div>`).join('')
                        : '<div class="det-item" style="color:var(--gris5)"><em>Sin suplentes detectados.</em></div>');
  }
  else if (key === 'nucleo') {
    titulo = '🎯 Núcleo estable del plantel';
    explicacion = `Jugadores que aparecieron al menos 1 minuto en TODOS los ${nPart} partido(s) cargado(s). Indica el grupo más constante (típicamente el "11 fijo" del equipo).`;
    const nuc = minutos.filter(p => (p.partidos || 0) === nPart).sort((a,b) => (b.minutos||0)-(a.minutos||0));
    if (!nuc.length) {
      contenido = `<div class="det-item" style="color:var(--gris5)"><em>Ningún jugador jugó los ${nPart} partidos.</em></div>`;
    } else {
      contenido = nuc.map(p => `<div class="det-item">
        <span><b>${p.jugador}</b></span>
        <span class="det-tag">${p.condicion} · ${p.minutos}m · ${(p.minutos/(p.partidos||1)).toFixed(1)} /p</span>
      </div>`).join('');
    }
  }
  else if (key === 'cambios') {
    titulo = '🔄 Cambios totales';
    explicacion = `Cambios inferidos por el parser. Un cambio se detecta cuando un jugador entra al menos 5 min después del inicio del partido y se matchea con otro que salió antes del final. Los nombres marcados "—" son cambios donde no se pudo identificar al saliente.`;
    const camProm = nPart ? (cambios.length / nPart).toFixed(1) : '0';
    const lista = cambios.slice(0, 16).map(c => {
      const m = (c.minuto || '').replace(/^\[[^\]]+\]\s*/, '');
      return `<div class="det-item">
        <span style="color:var(--rojo);min-width:50px">${m}</span>
        <span style="color:#ff6666">↓ ${(c.sale||'—').slice(0,18)}</span>
        <span style="color:#66ff99">↑ ${(c.entra||'—').slice(0,18)}</span>
      </div>`;
    }).join('');
    contenido =
      `<div class="det-item"><span>Total de cambios</span><span class="det-tag">${cambios.length}</span></div>` +
      `<div class="det-item"><span>Promedio por partido</span><span class="det-tag">${camProm}</span></div>` +
      `<div class="det-sub">Lista (primeros ${Math.min(16, cambios.length)})</div>` +
      (lista || '<div class="det-item" style="color:var(--gris5)"><em>Sin cambios.</em></div>');
  }
  else if (key === 'promedio') {
    titulo = '📊 Distribución de minutos por jugador';
    explicacion = `Promedio total = minutos acumulados ÷ jugadores utilizados. El "tope" del card es el jugador con más minutos en el acumulado.`;
    const sorted = [...minutos].sort((a,b) => (b.minutos||0)-(a.minutos||0));
    const top = sorted.slice(0, 5);
    const bottom = [...sorted].reverse().slice(0, 5);
    contenido = `<div class="det-sub">Más utilizados</div>` +
      top.map((p, i) => `<div class="det-item"><span class="det-num">${i+1}.</span><span>${p.jugador}</span><span class="det-tag">${p.minutos}m</span></div>`).join('') +
      `<div class="det-sub">Menos utilizados (de los que jugaron)</div>` +
      bottom.map((p, i) => `<div class="det-item"><span class="det-num">${i+1}.</span><span>${p.jugador}</span><span class="det-tag">${p.minutos}m</span></div>`).join('');
  }

  return `<div class="plantel-detalle-card">
    <div class="plantel-detalle-head">
      <div class="plantel-detalle-titulo">${titulo}</div>
      <button class="plantel-detalle-x" onclick="togglePlantelDetalle('${key}')" title="Cerrar">×</button>
    </div>
    <div class="plantel-detalle-expl">${explicacion}</div>
    <div class="plantel-detalle-body">${contenido}</div>
  </div>`;
}

function _rivalDePartido(timeline) {
  if (!timeline) return 'rival';
  const m = timeline.match(/vs\.?\s+(.+?)$/i);
  return m ? m[1].trim() : timeline.trim();
}

function _formatMin(s) {
  const m = Math.floor(s/60);
  const sec = Math.round(s % 60);
  return `${m}'${String(sec).padStart(2,'0')}"`;
}

function _tituloAccion(a) {
  const acc = _describirAccion(a.tags);
  const rival = _rivalDePartido(a.partido);
  const min = _formatMin(a.t);
  return `${acc} · vs ${rival} · ${min}`;
}

function dibujarCancha(acciones, modo = 'calor') {
  // 1) Filtrar por categoría de acción (si el usuario destildó alguna)
  acciones = _filtrarPorCat(acciones);
  // 2) Flip de y para mostrar laterales en su lado correcto
  acciones = acciones.map(a => ({
    ...a,
    y:  80 - a.y,
    ye: a.ye != null ? 80 - a.ye : null,
  }));
  const cellW = 10, cellH = 10;
  let svg = `<svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMid meet" class="pitch-svg">`;
  // Fondo
  svg += `<rect width="120" height="80" fill="#141414"/>`;

  if (modo === 'calor' || modo === 'flechas') {
    // Heatmap binning
    const bins = {};
    acciones.forEach(a => {
      if (a.x == null || a.y == null) return;
      const cx = Math.min(11, Math.max(0, Math.floor(a.x / cellW)));
      const cy = Math.min(7,  Math.max(0, Math.floor(a.y / cellH)));
      bins[`${cx},${cy}`] = (bins[`${cx},${cy}`] || 0) + 1;
    });
    const maxV = Math.max(1, ...Object.values(bins));
    Object.entries(bins).forEach(([k, count]) => {
      const [cx, cy] = k.split(',').map(Number);
      const ratio = count / maxV;
      const op = 0.12 + ratio * 0.65;
      svg += `<rect x="${cx*cellW}" y="${cy*cellH}" width="${cellW}" height="${cellH}" fill="#CC0000" opacity="${op}"/>`;
    });
  }

  // Líneas de cancha
  svg += _pitchLines();

  const escAttr = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  if (modo === 'puntos') {
    acciones.forEach(a => {
      const out = _outcomeAccion(a.tags);
      const esGol = /(^|,)\s*Gol\s*(,|$)/.test(a.tags || '');
      if (esGol) {
        const r = 2.8;
        svg += `<g data-pitch-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
               `<image href="/static/pelota.png" x="${a.x - r}" y="${a.y - r}" width="${r*2}" height="${r*2}" preserveAspectRatio="xMidYMid meet"/>` +
               `</g>`;
        return;
      }
      const color = out === 'neg' ? '#CC0000'
                  : a.area        ? '#f5a623'
                  :                 '#3ecf8e';
      svg += `<g data-pitch-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
             `<circle cx="${a.x}" cy="${a.y}" r="3" fill="transparent"/>` +
             `<circle cx="${a.x}" cy="${a.y}" r="1.1" fill="${color}" opacity="0.85"/>` +
             `</g>`;
    });
  } else if (modo === 'flechas') {
    acciones.filter(a => a.prog && a.xe != null && a.ye != null).forEach(a => {
      const out = _outcomeAccion(a.tags);
      const destEnArea = a.xe >= 102 && a.ye >= 18 && a.ye <= 62;
      const color = out === 'neg' ? '#CC0000'
                  : destEnArea    ? '#f5a623'
                  :                 '#3ecf8e';
      svg += `<g data-pitch-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
             `<line x1="${a.x}" y1="${a.y}" x2="${a.xe}" y2="${a.ye}" stroke="${color}" stroke-width="0.6" opacity="0.5"/>` +
             `<line x1="${a.x}" y1="${a.y}" x2="${a.xe}" y2="${a.ye}" stroke="${color}" stroke-width="0.4" opacity="0.9"/>` +
             `<circle cx="${a.xe}" cy="${a.ye}" r="0.9" fill="${color}" opacity="0.98"/>` +
             `<circle cx="${a.x}" cy="${a.y}" r="2.5" fill="transparent"/>` +
             `</g>`;
    });
  }

  // Overlay: centro de gravedad + elipse de dispersión
  if (mostrarCG && acciones.length >= 5) {
    const n = acciones.length;
    const cgX = acciones.reduce((s,a) => s + a.x, 0) / n;
    const cgY = acciones.reduce((s,a) => s + a.y, 0) / n;
    const varX = acciones.reduce((s,a) => s + (a.x - cgX) ** 2, 0) / n;
    const varY = acciones.reduce((s,a) => s + (a.y - cgY) ** 2, 0) / n;
    const dx = Math.max(2, Math.sqrt(varX));
    const dy = Math.max(2, Math.sqrt(varY));
    // Elipse de dispersión (1σ)
    svg += `<ellipse cx="${cgX}" cy="${cgY}" rx="${dx}" ry="${dy}" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.45" stroke-dasharray="2,1.5" opacity="0.85"/>`;
    // Marker del CG
    svg += `<circle cx="${cgX}" cy="${cgY}" r="2.6" fill="#ffffff" opacity="0.35"/>`;
    svg += `<circle cx="${cgX}" cy="${cgY}" r="1.5" fill="#CC0000" stroke="#ffffff" stroke-width="0.5"/>`;
    // Label
    svg += `<text x="${cgX + 3}" y="${cgY - 2.5}" fill="#fff" font-size="2.6" font-weight="bold">CG</text>`;
  }

  svg += '</svg>';
  return svg;
}

function _pitchScopes() {

// ─── Mapa territorial (posiciones medias del equipo, interactivo) ──────────
let mapaTerJugSel = new Set();
let mapaTerInit = false;       // primera vez auto-selecciona titulares
let mapaTerMinMinutos = 20;    // descarta jugadores con < N min para que no ensucie
let mapaTerZonasActivas = new Set(['def','med','atk']); // filtro por zona; vacío = oculta todo, completo = no filtra

function _calcularLineasEquipo(jugadores, datos) {
  // Mismo criterio que pdf_gen._calcular_lineas (cuartiles por x)
  const elig = jugadores
    .filter(j => datos[j] && (datos[j].minutos||0) >= mapaTerMinMinutos && (datos[j].acciones_xy||0) > 0)
    .map(j => ({ j, x: datos[j].centro_grav_x || 0, y: datos[j].centro_grav_y || 0 }));
  if (elig.length < 6) {
    return new Map(elig.map(e => [e.j, 'medio']));
  }
  elig.sort((a, b) => a.x - b.x);
  const n = elig.length;
  const nDef = Math.max(3, Math.floor(n / 3));
  const nAtk = Math.max(2, Math.floor(n / 4));
  let nMid = n - nDef - nAtk;
  if (nMid <= 0) nMid = 1;
  const linea = new Map();
  elig.slice(0, nDef).forEach(e => linea.set(e.j, 'def'));
  elig.slice(nDef, nDef + nMid).forEach(e => linea.set(e.j, 'med'));
  elig.slice(nDef + nMid).forEach(e => linea.set(e.j, 'atk'));
  return linea;
}

function _apellidoCorto(nombre) {
  const partes = (nombre||'').split(/\s+/).filter(Boolean);
  if (!partes.length) return '?';
  // Si el último token parece una inicial ("B.", "M.A."), usar el penúltimo (probable apellido)
  const ult = partes[partes.length - 1];
  if (/^([A-ZÁÉÍÓÚÑ]\.){1,3}$/.test(ult) && partes.length > 1) {
    return partes[partes.length - 2].slice(0, 12);
  }
  return ult.slice(0, 12);
}

function dibujarMapaTerritorial(visibles, datos) {
  const COL = { def: '#3ecf8e', med: '#ffffff', atk: '#CC0000' };
  const lineas = _calcularLineasEquipo(visibles, datos);
  let svg = `<svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMid meet" class="pitch-svg" style="width:100%;height:auto;background:#141414">`;
  svg += `<rect width="120" height="80" fill="#141414"/>`;

  // Bandas verticales: promedio x por línea — solo para zonas activas
  const grupos = { def: [], med: [], atk: [] };
  visibles.forEach(j => {
    const d = datos[j]; if (!d) return;
    const grp = lineas.get(j); if (!grp) return;
    grupos[grp].push(d.centro_grav_x || 0);
  });
  Object.entries(grupos).forEach(([k, xs]) => {
    if (!xs.length || !mapaTerZonasActivas.has(k)) return;
    const avg = xs.reduce((s,x) => s+x, 0) / xs.length;
    svg += `<line x1="${avg}" y1="2" x2="${avg}" y2="78" stroke="${COL[k]}" stroke-width="0.35" stroke-dasharray="2,1.5" opacity="0.55"/>`;
  });

  svg += _pitchLines();

  const escAttr = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

  // Construir set de jugadores efectivamente visibles (después de min minutos + zona)
  const items = [];
  visibles.forEach(j => {
    const d = datos[j]; if (!d) return;
    if ((d.acciones_xy||0) === 0) return;
    if ((d.minutos||0) < mapaTerMinMinutos) return;
    const grp = lineas.get(j) || 'med';
    if (!mapaTerZonasActivas.has(grp)) return;
    const cx = d.centro_grav_x || 0;
    const cy = 80 - (d.centro_grav_y || 0);
    items.push({
      j, cx, cy, color: COL[grp],
      label: _apellidoCorto(j),
      tip: `${j} · CG (${cx.toFixed(0)}, ${(d.centro_grav_y||0).toFixed(0)}) · ${d.minutos||0}m · ${d.acciones_xy||0} acc.`,
    });
  });

  // Anti-colisión de etiquetas: para cada label probamos 8 posiciones y elegimos la primera sin solape.
  const CHARW = 1.45, FH = 3.3, PAD = 0.4;
  const placed = []; // rects ocupados (incluye los puntos para evitar pisar marcadores)
  items.forEach(it => { placed.push({ x: it.cx - 2.6, y: it.cy - 2.6, w: 5.2, h: 5.2 }); });
  function colisiona(r) {
    return placed.some(p =>
      !(r.x + r.w + PAD < p.x || p.x + p.w + PAD < r.x ||
        r.y + r.h + PAD < p.y || p.y + p.h + PAD < r.y));
  }
  // Procesar los más conflictivos primero (más vecinos cercanos)
  items.sort((a, b) => {
    const vec = o => items.filter(x => x !== o && Math.hypot(x.cx - o.cx, x.cy - o.cy) < 9).length;
    return vec(b) - vec(a);
  });
  items.forEach(it => {
    const w = it.label.length * CHARW;
    // [ox_text, oy_baseline] respecto a (cx, cy) — el texto va con anchor="start"
    const cands = [
      [ 3.0,  0.9], [-(w + 3.0),  0.9],                       // der, izq
      [-w/2, -3.2], [-w/2,  5.4],                             // arriba, abajo
      [ 3.0, -3.2], [-(w + 3.0), -3.2],                       // der-arr, izq-arr
      [ 3.0,  5.4], [-(w + 3.0),  5.4],                       // der-aba, izq-aba
      [ 6.0,  0.9], [-(w + 6.0),  0.9],                       // der lejos, izq lejos
    ];
    let pick = null;
    for (const [ox, oy] of cands) {
      const r = { x: it.cx + ox - PAD, y: it.cy + oy - FH + 0.5, w: w + 2*PAD, h: FH };
      if (r.x < 0.2 || r.x + r.w > 119.8) continue;
      if (r.y < 0.2 || r.y + r.h > 79.8) continue;
      if (!colisiona(r)) { pick = { ox, oy, r }; break; }
    }
    if (!pick) {
      const r = { x: it.cx + 3.0 - PAD, y: it.cy + 0.9 - FH + 0.5, w: w + 2*PAD, h: FH };
      pick = { ox: 3.0, oy: 0.9, r };
    }
    it.tx = it.cx + pick.ox;
    it.ty = it.cy + pick.oy;
    it.lw = w;
    placed.push(pick.r);
  });

  // Dibujar todos los marcadores primero (van debajo de labels)
  items.forEach(it => {
    svg += `<g data-pitch-tip="${escAttr(it.tip)}">`;
    svg += `<circle cx="${it.cx}" cy="${it.cy}" r="2.4" fill="#0a0a0a"/>`;
    svg += `<circle cx="${it.cx}" cy="${it.cy}" r="1.9" fill="${it.color}" stroke="#0a0a0a" stroke-width="0.3"/>`;
    svg += `</g>`;
  });
  // Después leader lines + labels con fondo semitransparente
  items.forEach(it => {
    const labCx = it.tx + it.lw / 2;
    const labCy = it.ty - 1;
    const dist = Math.hypot(labCx - it.cx, labCy - it.cy);
    if (dist > 4.5) {
      const ang = Math.atan2(labCy - it.cy, labCx - it.cx);
      const x1 = it.cx + Math.cos(ang) * 2.3;
      const y1 = it.cy + Math.sin(ang) * 2.3;
      const x2 = labCx - Math.cos(ang) * (it.lw / 2 + 0.2);
      const y2 = labCy - Math.sin(ang) * (FH / 2 + 0.2);
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${it.color}" stroke-width="0.25" opacity="0.65"/>`;
    }
    svg += `<rect x="${it.tx - 0.5}" y="${it.ty - 2.5}" width="${it.lw + 1}" height="3.2" fill="#0a0a0a" fill-opacity="0.6" rx="0.5"/>`;
    svg += `<text x="${it.tx}" y="${it.ty}" fill="#fff" font-size="2.4" font-weight="bold">${escAttr(it.label)}</text>`;
  });

  svg += `<text x="118" y="78" fill="#888" font-size="2.4" text-anchor="end">→ ataque</text>`;
  svg += '</svg>';
  return svg;
}

function toggleMapaTerJug(j, on) {
  if (on) mapaTerJugSel.add(j); else mapaTerJugSel.delete(j);
  renderMapaTerritorial();
}

function toggleMapaTerZona(z, on) {
  if (on) mapaTerZonasActivas.add(z); else mapaTerZonasActivas.delete(z);
  renderMapaTerritorial();
}

function presetMapaTer(preset) {
  if (!datosJugadores) return;
  const todos = Object.keys(datosJugadores);
  if (preset === 'todos') {
    mapaTerJugSel = new Set(todos.filter(j => (datosJugadores[j].acciones_xy||0) > 0));
  } else if (preset === 'titulares') {
    mapaTerJugSel = new Set(todos.filter(j => datosJugadores[j].condicion === 'Titular' && (datosJugadores[j].acciones_xy||0) > 0));
  } else if (preset === 'ninguno') {
    mapaTerJugSel = new Set();
  }
  renderMapaTerritorial();
}

// ─── Pizza chart + beeswarm + detección de estilo ────────────────────────
// 8 métricas elegidas para cubrir las 4 dimensiones del juego:
//   construcción · creación · ataque al área · trabajo defensivo
const METRICAS_PIZZA = [
  { k: 'pases_efect',       l: '% Pase',         unidad: '%', grupo: 'construccion' },
  { k: 'pct_progresivo',    l: '% Progresivo',   unidad: '%', grupo: 'construccion' },
  { k: 'pases_clave',       l: 'P. clave',                    grupo: 'creacion' },
  { k: 'pases_filtrado',    l: 'P. filtrado',                 grupo: 'creacion' },
  { k: 'pct_area',          l: '% Área',         unidad: '%', grupo: 'ataque' },
  { k: 'remates_arco',      l: 'Remates',                     grupo: 'ataque' },
  { k: 'recup_posic',       l: 'Recup. posic.',               grupo: 'defensa' },
  { k: 'recup_interv',      l: 'Recup. activas',              grupo: 'defensa' },
  { k: 'intercepciones',    l: 'Intercep.',                   grupo: 'defensa' },
];

// Estilos de juego — cada uno mira un grupo de métricas y le pone nombre al perfil
// `nombre` = jugador individual · `nombreEq` = grupo colectivo
const ESTILOS = [
  { id: 'area',         nombre: 'Atacante de área',      nombreEq: 'Bloque de ataque al área',  icon: '🎯', metricas: ['pct_area', 'remates_arco', 'goles', 'toques_area'] },
  { id: 'creativo',     nombre: 'Generador creativo',    nombreEq: 'Bloque creativo',           icon: '🪄', metricas: ['pases_clave', 'pases_filtrado', 'recep_lineas', 'asistencias'] },
  { id: 'conductor',    nombre: 'Encarador / Conductor', nombreEq: 'Equipo de duelos',          icon: '🏃', metricas: ['dao_plus', 'ruptura', 'regate_c', 'pct_progresivo'] },
  { id: 'distribuidor', nombre: 'Distribuidor',           nombreEq: 'Bloque de tenencia',        icon: '🎼', metricas: ['pases_efect', 'pases_largo_c', 'pases_total'] },
  { id: 'recuperador',  nombre: 'Recuperador alto',       nombreEq: 'Bloque de presión alta',    icon: '🔥', metricas: ['recup_interv', 'recup_tras', 'pct_ultimo_tercio'] },
  { id: 'cierre',       nombre: 'Cierre defensivo',       nombreEq: 'Bloque defensivo',          icon: '🛡', metricas: ['intercepciones', 'bloqueos', 'dad_plus', 'recup_posic'] },
];

function detectarEstilo(ind, todos, esEquipo = false) {
  if (!todos) return null;
  const candidatos = Object.values(todos).filter(j => (j.intervenciones||0) >= 8);
  if (candidatos.length < 4) return null;
  const nom = e => esEquipo ? e.nombreEq : e.nombre;

  const scores = ESTILOS.map(estilo => {
    let suma = 0, n = 0;
    estilo.metricas.forEach(m => {
      const valores = candidatos.map(j => j[m] || 0);
      if (Math.max(...valores) === 0) return;
      const pct = _percentil(ind[m] || 0, valores);
      suma += pct; n++;
    });
    return { ...estilo, pct: n ? Math.round(suma / n) : 0, n };
  }).filter(s => s.n > 0).sort((a, b) => b.pct - a.pct);

  const mixto = esEquipo ? 'Bloque mixto' : 'Perfil mixto';
  if (!scores.length || scores[0].pct < 55) {
    return { nombre: mixto, icon: '🔀', detalle: 'Sin dominancia clara en ningún rol', pct: scores[0]?.pct || 0 };
  }
  const top = scores[0], seg = scores[1];
  let nombre = nom(top), icon = top.icon;
  if (seg && seg.pct >= 60 && top.pct - seg.pct < 8) {
    nombre = `${nom(top)} + ${nom(seg)}`;
    icon = `${top.icon}${seg.icon}`;
  }
  const sufijo = esEquipo ? '(promedio del grupo)' : '';
  const detalle = `Promedio percentil ${top.pct} en ${top.metricas.slice(0,3).join(' · ')} ${sufijo}`.trim();
  return { nombre, icon, detalle, pct: top.pct, ranking: scores };
}

function _rankPos(valor, valores) {
  const ord = [...valores].sort((a,b) => b - a);
  return ord.findIndex(v => v === valor) + 1;
}

function analisisJugador(ind, todos) {
  if (!ind || !todos) return '';
  const candidatos = Object.values(todos).filter(j => (j.intervenciones||0) >= 8);
  if (candidatos.length < 4) return '';
  const N = candidatos.length;
  const lineas = [];

  // 1. Apertura — estilo + volumen
  const est = detectarEstilo(ind, todos, false);
  const cnt = `${ind.intervenciones} intervenciones en ${ind.minutos} min`;
  if (est && est.nombre && !est.nombre.includes('mixto')) {
    lineas.push(`${ind.jugador} desplegó un perfil claro de <b>${est.nombre.toLowerCase()}</b>, sumando ${cnt}.`);
  } else {
    lineas.push(`${ind.jugador} acumuló ${cnt} sin un rol estadísticamente dominante.`);
  }

  // 2. Posición + movilidad
  if (ind.acciones_xy >= 10) {
    const x = ind.centro_grav_x, dx = ind.dispersion_x, dy = ind.dispersion_y;
    let s = 'Operó ';
    if (x >= 78) s += `<b>muy cerca del arco rival</b> (CG x=${x})`;
    else if (x >= 60) s += `<b>en zona alta-media</b> (CG x=${x})`;
    else if (x >= 42) s += `<b>en zona media</b>, balanceando construcción y avance`;
    else s += `<b>en zona baja</b> (CG x=${x}), priorizando salida y cobertura`;
    if (dx >= 25 || dy >= 22) s += ', con <i>alta movilidad</i> por la cancha.';
    else if (dx <= 14 && dy <= 12) s += ', con un <i>posicionamiento muy estático</i>.';
    else s += '.';
    lineas.push(s);
  }

  // 3. Fortalezas — top 2 métricas por percentil
  const fortalezas = [];
  METRICAS_PIZZA.forEach(m => {
    const vals = candidatos.map(j => j[m.k]||0);
    if (Math.max(...vals) === 0) return;
    const pct = _percentil(ind[m.k]||0, vals);
    if (pct >= 75 && (ind[m.k]||0) > 0) {
      fortalezas.push({ ...m, valor: ind[m.k], pct, rank: _rankPos(ind[m.k], vals) });
    }
  });
  fortalezas.sort((a,b) => b.pct - a.pct);
  if (fortalezas.length >= 1) {
    const t = fortalezas[0];
    let s = `Destacó por <b>${t.valor}${t.unidad||''} en ${t.l.toLowerCase()}</b> (${t.rank}º del plantel)`;
    if (fortalezas.length >= 2) {
      const t2 = fortalezas[1];
      s += ` y <b>${t2.valor}${t2.unidad||''} en ${t2.l.toLowerCase()}</b> (${t2.rank}º)`;
    }
    s += '.';
    lineas.push(s);
  }

  // 4. Aporte directo
  const partes = [];
  if (ind.goles)       partes.push(`<b>${ind.goles} gol${ind.goles>1?'es':''}</b>`);
  if (ind.asistencias) partes.push(`<b>${ind.asistencias} asistencia${ind.asistencias>1?'s':''}</b>`);
  if (!ind.asistencias && ind.pases_clave >= 2) partes.push(`<b>${ind.pases_clave} pases clave</b>`);
  const recup = (ind.recup_posic||0) + (ind.recup_interv||0) + (ind.recup_tras||0);
  if (recup >= 6) partes.push(`<b>${recup} recuperaciones</b>`);
  if (partes.length) {
    lineas.push(`Aporte directo en el partido: ${partes.join(' + ')}.`);
  }

  // 5. Debilidad o sello distintivo
  const debilidades = [];
  METRICAS_PIZZA.forEach(m => {
    const vals = candidatos.map(j => j[m.k]||0);
    if (Math.max(...vals) === 0) return;
    const pct = _percentil(ind[m.k]||0, vals);
    if (pct <= 25) debilidades.push({ ...m, valor: ind[m.k]||0, pct });
  });
  if (debilidades.length && ind.pct_progresivo < 30 && ind.pases_efect < 70) {
    const d = debilidades[0];
    lineas.push(`Como aspecto a mejorar, sus números en <b>${d.l.toLowerCase()}</b> (${d.valor}${d.unidad||''}) quedaron por debajo del promedio del plantel.`);
  } else if (ind.pct_area >= 5 && ind.toques_area >= 3) {
    lineas.push(`Frecuentó con peligrosidad el área rival (<b>${ind.toques_area} toques</b>, ${ind.pct_area}% de sus acciones).`);
  } else if (ind.pct_progresivo >= 35) {
    lineas.push(`Su juego es <b>marcadamente vertical</b>: ${ind.pct_progresivo}% de sus acciones con destino avanzaron hacia el arco rival.`);
  } else if (ind.pases_efect >= 85 && ind.pases_total >= 30) {
    lineas.push(`Mostró una efectividad de pase del <b>${ind.pases_efect}%</b> sobre un volumen importante (${ind.pases_total} pases).`);
  }

  return lineas.join(' ');
}

function pizzaPlayer(ind, todos) {
  if (!todos) return '';
  const candidatos = Object.values(todos).filter(j => (j.intervenciones||0) >= 8);
  if (candidatos.length < 4) return '';

  const W = 580, H = 520, cx = W/2, cy = H/2, rMin = 36, rMax = 190;
  const slices = METRICAS_PIZZA.map((m, i) => {
    const v = ind[m.k] || 0;
    const valores = candidatos.map(j => j[m.k] || 0);
    const pct = _percentil(v, valores);
    const r = rMin + (pct/100) * (rMax - rMin);
    return { ...m, v, pct, r, ang: -Math.PI/2 + i * (2*Math.PI/METRICAS_PIZZA.length) };
  });
  const angSlice = 2*Math.PI / METRICAS_PIZZA.length;

  const arc = (r, a0, a1) => {
    const x0 = cx + Math.cos(a0)*r, y0 = cy + Math.sin(a0)*r;
    const x1 = cx + Math.cos(a1)*r, y1 = cy + Math.sin(a1)*r;
    return `M ${cx},${cy} L ${x0},${y0} A ${r},${r} 0 0 1 ${x1},${y1} Z`;
  };
  const colorPct = p => p >= 70 ? '#3ecf8e' : p >= 40 ? '#f5a623' : '#CC0000';

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:500px;display:block;margin:0 auto">`;
  // Anillos guía
  [0.25, 0.5, 0.75, 1].forEach(s => {
    const r = rMin + s * (rMax - rMin);
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2a2a"/>`;
  });
  // Slices
  slices.forEach(s => {
    const a0 = s.ang - angSlice/2;
    const a1 = s.ang + angSlice/2;
    svg += `<path d="${arc(s.r, a0, a1)}" fill="${colorPct(s.pct)}" fill-opacity="0.82" stroke="#0a0a0a" stroke-width="1.5"/>`;
  });
  // Ejes
  slices.forEach(s => {
    const x = cx + Math.cos(s.ang)*rMax;
    const y = cy + Math.sin(s.ang)*rMax;
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1a1a1a" stroke-width="1"/>`;
  });
  // Labels alrededor
  slices.forEach(s => {
    const r = rMax + 32;
    const x = cx + Math.cos(s.ang)*r;
    const y = cy + Math.sin(s.ang)*r;
    svg += `<text x="${x}" y="${y-4}" fill="#ccc" font-size="12" text-anchor="middle" font-weight="600">${s.l}</text>`;
    svg += `<text x="${x}" y="${y+10}" fill="${colorPct(s.pct)}" font-size="11" text-anchor="middle" font-weight="800">${s.v}${s.unidad||''} · p${s.pct}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function beeswarmCompacto(ind, todos, seleccionados = null) {
  if (!todos) return '';
  const candidatos = Object.values(todos).filter(j => (j.intervenciones||0) >= 8);
  if (candidatos.length < 3) return '';
  const setSel = seleccionados ? new Set(seleccionados) : null;

  const W = 200, H = 70;
  return `<div class="beeswarm-grid">${
    METRICAS_PIZZA.map(m => {
      const valores = candidatos.map(j => ({ nombre: j.jugador, v: j[m.k] || 0 }));
      const max = Math.max(1, ...valores.map(p => p.v));
      const sx = v => 16 + (v / max) * (W - 32);
      const yVal = 38;
      let svg = `<svg viewBox="0 0 ${W} ${H}" class="beeswarm-svg">`;
      svg += `<text x="${W/2}" y="14" fill="#ccc" font-size="10" text-anchor="middle" font-weight="600">${m.l}</text>`;
      svg += `<line x1="14" y1="${yVal}" x2="${W-14}" y2="${yVal}" stroke="#3a3a3a"/>`;
      valores.forEach((p, i) => {
        const cx = sx(p.v);
        const cy = yVal - 2 + ((i % 3) - 1) * 3;
        const esEl = setSel ? setSel.has(p.nombre) : (p.nombre === ind.jugador);
        svg += `<circle cx="${cx}" cy="${cy}" r="${esEl?4.5:2.5}" fill="${esEl?'#CC0000':'#555'}" opacity="${esEl?1:0.55}"><title>${p.nombre}: ${p.v}${m.unidad||''}</title></circle>`;
      });
      // Marca de promedio del grupo (línea vertical roja punteada) en modo colectivo
      if (setSel) {
        const xAvg = sx(ind[m.k] || 0);
        svg += `<line x1="${xAvg}" y1="${yVal-12}" x2="${xAvg}" y2="${yVal+12}" stroke="#CC0000" stroke-width="1.5" stroke-dasharray="3,2"/>`;
      }
      svg += `<text x="${W/2}" y="${H-6}" fill="#f5f5f5" font-size="11" text-anchor="middle" font-weight="800">${(ind[m.k]||0)}${m.unidad||''}</text>`;
      svg += '</svg>';
      return svg;
    }).join('')
  }</div>`;
}

function renderFoda(titulo, foda) {
  if (!foda) return '';
  const todoVacio = !foda.fortalezas.length && !foda.debilidades.length && !foda.oportunidades.length && !foda.amenazas.length && !foda.perfil;
  if (todoVacio) return '';
  const box = (clase, icono, titulo, items) => {
    const contenido = items.length
      ? `<ul>${items.map(it => `<li><span>${it.label}</span><span class="v">${it.valor}</span></li>`).join('')}</ul>`
      : '<div class="foda-empty">Sin señales destacadas</div>';
    return `<div class="foda-box ${clase}"><div class="foda-box-title">${icono} ${titulo}</div>${contenido}</div>`;
  };
  return `<div class="lectura">
    <div class="lectura-title">📖 ${titulo}</div>
    ${foda.perfil ? `<div class="foda-summary">${foda.perfil}</div>` : ''}
    <div class="foda-grid">
      ${box('f', '💪', 'Fortalezas',     foda.fortalezas)}
      ${box('o', '📈', 'Oportunidades',  foda.oportunidades)}
      ${box('d', '⚠',  'Debilidades',    foda.debilidades)}
      ${box('a', '🔻', 'Amenazas',       foda.amenazas)}
    </div>
  </div>`;
}

function renderRematesPorSuperficie(ind) {
  const filas = [
    ['Cabeza',      'rem_cab_'],
    ['Pie hábil',   'rem_pieh_'],
    ['Pie inhábil', 'rem_piei_'],
  ];
  const totalCualq = filas.reduce((s, [_, p]) => s + (ind[p+'total']||0), 0) + (ind.rem_sd_total||0);
  if (totalCualq === 0) {
    return `<div style="font-size:10px;color:var(--gris5);padding:6px 0 2px">Sin tags de superficie en estos remates. Etiquetá <i>Cabeza</i> / <i>Pie Habil</i> / <i>Pie Inhabil</i> en Sportcode para ver el desglose.</div>`;
  }
  const colorEf = ef => ef >= 50 ? 'green' : ef >= 30 ? 'amber' : 'red';
  let html = '<div class="ind-block-title sub">Por superficie</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 28px 28px 32px 38px;gap:4px 8px;font-size:10px;color:var(--gris5);padding:4px 0 2px;text-transform:uppercase;letter-spacing:.4px"><span></span><span style="text-align:right">Arco</span><span style="text-align:right">Gol</span><span style="text-align:right">Total</span><span style="text-align:right">Efect.</span></div>';
  filas.forEach(([lbl, pre]) => {
    const tot = ind[pre+'total']||0;
    const ef  = ind[pre+'efect']||0;
    const arco = ind[pre+'arco']||0;
    const gol  = ind[pre+'gol']||0;
    const afu  = ind[pre+'afuera']||0;
    const blo  = ind[pre+'bloq']||0;
    html += `<div style="display:grid;grid-template-columns:1fr 28px 28px 32px 38px;gap:4px 8px;align-items:center;padding:3px 0;border-top:1px dashed var(--gris3)">
      <span style="font-size:12px" title="Afuera ${afu} · Bloq ${blo}">${lbl}</span>
      <span class="ind-row-val red"   style="text-align:right">${arco}</span>
      <span class="ind-row-val amber" style="text-align:right">${gol}</span>
      <span class="ind-row-val"       style="text-align:right">${tot}</span>
      <span class="ind-row-val ${colorEf(ef)}" style="text-align:right">${ef}%</span>
    </div>`;
  });
  if ((ind.rem_sd_total||0) > 0) {
    html += `<div style="font-size:10px;color:var(--gris5);padding:6px 0 0">${ind.rem_sd_total} remate(s) sin tag de superficie.</div>`;
  }
  return html;
}

function buildIndHTML(ind) {
  if (!ind || Object.keys(ind).length === 0) return '<p style="color:var(--gris5)">Sin datos individuales para este jugador.</p>';

  const efect = ind.pases_efect || 0;
  const colorEf = efect >= 75 ? 'var(--verde)' : efect >= 60 ? 'var(--ambar)' : 'var(--rojo)';

  function ir(label, val, color='') {
    return `<div class="ind-row"><span class="ind-row-label">${label}</span><span class="ind-row-val ${color}">${val}</span></div>`;
  }
  function irTip(label, val, tip, color='') {
    return `<div class="ind-row"><span class="ind-row-label">${label}<span class="info-dot" data-tip="${tip.replace(/"/g,'&quot;')}">i</span></span><span class="ind-row-val ${color}">${val}</span></div>`;
  }

  return `
  <div class="ind-header">
    <div>
      <div class="ind-nombre">${ind.jugador}</div>
      <div class="ind-sub">${ind.condicion} · ${ind.minutos}min · ${ind.intervenciones} intervenciones</div>
    </div>
    <div class="ind-kpis">
      <div class="kpi"><div class="kpi-val red">${ind.goles||0}</div><div class="kpi-label">Goles</div></div>
      <div class="kpi"><div class="kpi-val amber">${ind.asistencias||0}</div><div class="kpi-label">Asistencias</div></div>
      <div class="kpi"><div class="kpi-val blue">${ind.pases_clave||0}</div><div class="kpi-label">Pases clave</div></div>
    </div>
  </div>

  ${(datosJugadores && Object.keys(datosJugadores).length >= 4) ? (() => {
    const esColectivo = !!ind.__esColectivo;
    // En colectivo, las visualizaciones comparativas usan el promedio por jugador del grupo
    const indPerfil = esColectivo ? (ind.__promedio || ind) : ind;
    const est = detectarEstilo(indPerfil, datosJugadores, esColectivo);
    const esMixto = !est || est.nombre.includes('mixto');
    const tituloPiz = esColectivo ? '🍕 Percentiles (promedio del grupo vs plantel)' : '🍕 Percentiles en el plantel';
    const tituloBee = esColectivo ? '🐝 Distribución del plantel (con jugadores seleccionados marcados)' : '🐝 Distribución del plantel';
    const piePieBee = esColectivo
      ? `Puntos rojos = los ${ind.__seleccionados?.length||'N'} jugadores del colectivo · puntos grises = no seleccionados`
      : `Punto rojo grande = ${ind.jugador} · puntos grises = resto del plantel · hover para ver nombre y valor`;
    return `
  <div class="perfil-visual">
    <div>
      ${est ? `<div class="estilo-badge ${esMixto?'mixto':''}">
        <div class="ico">${est.icon}</div>
        <div class="nombre">${est.nombre}</div>
        <div class="detalle">${est.detalle}</div>
      </div>` : ''}
      <div class="perfil-titulo">${tituloPiz}</div>
      ${pizzaPlayer(indPerfil, datosJugadores)}
      <div class="perfil-leyenda">
        <span class="lg-top">Top (p ≥ 70)</span>
        <span class="lg-medio">Medio (p 40-69)</span>
        <span class="lg-bajo">Bajo (p &lt; 40)</span>
      </div>
    </div>
    <div>
      <div class="perfil-titulo">${tituloBee}</div>
      ${beeswarmCompacto(indPerfil, datosJugadores, esColectivo ? (ind.__seleccionados||[]) : null)}
      <div style="font-size:10px;color:var(--gris5);margin-top:10px;text-align:center">${piePieBee}</div>
      ${!esColectivo ? (() => {
        const txt = analisisJugador(ind, datosJugadores);
        return txt ? `<div class="analisis-jug">
          <div class="analisis-jug-titulo">
            <span>📝 Análisis del jugador</span>
            <span class="analisis-jug-badge">Generado por <b>River360 IA</b></span>
          </div>
          <p class="analisis-jug-text" data-content="${encodeURIComponent(txt)}"></p>
        </div>` : '';
      })() : ''}
    </div>
  </div>`;
  })() : ''}

  ${(coordsActuales && coordsActuales.length > 0) ? `
  <div class="pitch-section">
    <div class="pitch-head">
      <div class="perfil-titulo">🗺 Mapa en cancha · <span id="pitch-count">${_filtrarPorCat(coordsActuales).length}</span> / ${coordsActuales.length} acciones</div>
      <div class="pitch-modos">
        <button class="${pitchModo==='calor'?'active':''}"   onclick="setPitchModo('calor')">🔥 Calor</button>
        <button class="${pitchModo==='puntos'?'active':''}"  onclick="setPitchModo('puntos')">⦿ Puntos</button>
        <button class="${pitchModo==='flechas'?'active':''}" onclick="setPitchModo('flechas')">➤ Progresivas</button>
      </div>
    </div>
    <div id="pitch-acciones-filter" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center">
      <span style="font-size:10px;color:var(--gris5);text-transform:uppercase;letter-spacing:.5px;margin-right:4px">Acciones:</span>
      ${CATS_ACCION.map(([id,lbl]) => `
        <label class="part-chip" style="padding:3px 9px">
          <input type="checkbox" data-cat="${id}" ${accionFiltros.has(id)?'checked':''} onchange="onAccionFiltroToggle()">
          <span style="font-size:10.5px">${lbl}</span>
        </label>`).join('')}
      <button class="btn" style="padding:3px 9px;font-size:10.5px" onclick="setAccionFiltros(true)">Todos</button>
      <button class="btn" style="padding:3px 9px;font-size:10.5px" onclick="setAccionFiltros(false)">Ninguno</button>
      <label class="part-chip" style="padding:3px 9px;margin-left:auto" title="Mostrar centro de gravedad y elipse de dispersión">
        <input type="checkbox" ${mostrarCG?'checked':''} onchange="toggleCG(this.checked)">
        <span style="font-size:10.5px">🎯 CG + dispersión</span>
      </label>
    </div>
    <div id="pitch-container">${dibujarCancha(coordsActuales, pitchModo)}</div>
    <div class="pitch-leyenda">
      ${pitchModo==='puntos' ? `
        <span><span style="display:inline-block;width:8px;height:8px;background:#3ecf8e;border-radius:50%;margin-right:5px;vertical-align:middle"></span>Completa / positiva</span>
        <span><span style="display:inline-block;width:8px;height:8px;background:#f5a623;border-radius:50%;margin-right:5px;vertical-align:middle"></span>En área rival</span>
        <span><span style="display:inline-block;width:8px;height:8px;background:#CC0000;border-radius:50%;margin-right:5px;vertical-align:middle"></span>Incompleta / pérdida</span>
      ` : pitchModo==='flechas' ? `
        <span><span style="display:inline-block;width:10px;height:3px;background:#3ecf8e;margin-right:5px;vertical-align:middle"></span>Completa / positiva</span>
        <span><span style="display:inline-block;width:10px;height:3px;background:#f5a623;margin-right:5px;vertical-align:middle"></span>Termina en área rival</span>
        <span><span style="display:inline-block;width:10px;height:3px;background:#CC0000;margin-right:5px;vertical-align:middle"></span>Incompleta / pérdida</span>
      ` : `
        <span>Color rojo más intenso = más acciones en esa zona · grilla 12 × 8</span>
      `}
    </div>
  </div>` : ''}

  ${ind.__esColectivo ? `
  <div class="pitch-section" style="margin-top:1.2rem">
    <div id="mapa-ter-container">
      <p style="color:var(--gris5);padding:1rem">Cargando posiciones medias…</p>
    </div>
  </div>` : ''}

  <div class="ind-grid">
    <div class="ind-block">
      <div class="ind-block-title">Pases</div>
      <div class="efect-bar">
        <div class="efect-pct" style="color:${colorEf}">${efect}%</div>
        <div class="efect-track"><div class="efect-fill" style="width:${efect}%;background:${colorEf}"></div></div>
      </div>
      ${ir('Total', ind.pases_total)}
      ${ir('Completos', ind.pases_completos, 'green')}
      ${ir('Incompletos', ind.pases_incompletos, 'red')}
      <div class="ind-block-title sub">Dirección</div>
      ${ir('Adelante', ind.pases_adelante)}
      ${ir('Atrás', ind.pases_atras)}
      ${ir('Lateral', ind.pases_lateral)}
      <div class="ind-block-title sub">Valor agregado</div>
      ${ir('Filtrados', ind.pases_filtrado)}
      ${ir('Largos completos', ind.pases_largo_c)}
      ${(() => {
        const cc = ind.centros_c || 0, ci = ind.centros_i || 0, ct = cc + ci;
        const efc = ct ? Math.round(cc / ct * 100) : 0;
        const col = efc >= 35 ? 'green' : efc >= 20 ? 'amber' : ct ? 'red' : '';
        return `${ir('Centros (compl./tot.)', `${cc}/${ct}`, 'green')}${ir('% Centros completos', efc + '%', col)}`;
      })()}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Duelos y remates</div>
      ${ir('1v1 Of. Ganados', ind.dao_plus, 'green')}
      ${ir('1v1 Of. Perdidos', ind.dao_minus, 'red')}
      ${ir('1v1 Def. Ganados', ind.dad_plus, 'green')}
      ${ir('1v1 Def. Perdidos', ind.dad_minus, 'red')}
      ${ir('Regate completo', ind.regate_c, 'green')}
      ${ir('Regate incompleto', ind.regate_i, 'red')}
      <div class="ind-block-title sub">Remates · efectividad ${ind.remates_efect||0}%</div>
      ${ir('Total', ind.remates_total||0)}
      ${ir('Al arco', ind.remates_arco, 'red')}
      ${ir('Goles', ind.remates_gol, 'amber')}
      ${ir('Afuera', ind.remates_afuera)}
      ${ir('Bloqueado', ind.remates_bloq)}
      ${renderRematesPorSuperficie(ind)}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Mapa posicional</div>
      ${irTip('Centro de gravedad', `(${ind.centro_grav_x||0}, ${ind.centro_grav_y||0})`, 'Promedio de coordenadas (x, y) de todas las acciones del jugador. Indica dónde se posicionó habitualmente. x crece hacia el arco rival (0-120). y es el ancho (0-80).')}
      ${irTip('Dispersión x · y', `${ind.dispersion_x||0} · ${ind.dispersion_y||0}`, 'Desvío estándar de las coordenadas. Alto = jugador móvil que cubre mucho terreno. Bajo = jugador anclado a una zona.')}
      ${irTip('Acciones con coord.', ind.acciones_xy||0, 'Cantidad de acciones del jugador que tienen coordenadas registradas. Es la base de todas las métricas posicionales.')}
      ${irTip('% último tercio', (ind.pct_ultimo_tercio||0)+'%', 'Porcentaje de las acciones del jugador que ocurrieron en x ≥ 80 (último tercio ofensivo).', (ind.pct_ultimo_tercio||0) > 40 ? 'red' : '')}
      ${irTip('% área rival', (ind.pct_area||0)+'%', 'Porcentaje de las acciones dentro del área rival (x > 102, y entre 18 y 62).', (ind.pct_area||0) > 5 ? 'amber' : '')}
      <div class="ind-block-title sub">Progresión</div>
      ${irTip('Progresión media (mts)', ind.progresion_media||0, 'Promedio de metros que avanza hacia el arco rival en cada acción con origen y destino (x_destino − x_origen). Positivo = avanza, negativo = retrocede.')}
      ${irTip('Distancia media (mts)', ind.distancia_media||0, 'Promedio de la distancia euclídea entre origen y destino de cada acción. Mide qué tan largas son sus acciones, sin importar dirección.')}
      ${irTip('% acciones progresivas', (ind.pct_progresivo||0)+'%', 'Porcentaje de las acciones con destino que avanzaron ≥ 10 metros hacia el arco rival. Mide cuánto aporta el jugador al ataque del equipo.', (ind.pct_progresivo||0) > 30 ? 'green' : '')}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Defensa y táctica</div>
      ${ir('Recup. posicional', ind.recup_posic, 'green')}
      ${ir('Recup. x intervención', ind.recup_interv, 'green')}
      ${ir('Tras pérdida', ind.recup_tras, 'green')}
      ${ir('Pérdidas totales', ind.perd_total, 'red')}
      ${ir('Intercepciones', ind.intercepciones)}
      ${ir('Bloqueos', ind.bloqueos)}
      <div class="ind-block-title sub">Movimiento</div>
      ${ir('Toques en área rival', ind.toques_area, 'amber')}
      ${ir('Recep. entre líneas', ind.recep_lineas)}
      ${ir('Recep. al espacio', ind.recep_espacio)}
      ${ir('Ruptura en conducción', ind.ruptura)}
    </div>
  </div>

  ${(() => {
    const esCol = !!ind.__esColectivo;
    const indFoda = esCol ? (ind.__promedio || ind) : ind;
    const titulo = esCol ? 'FODA del colectivo (promedio del grupo)' : 'FODA de ' + ind.jugador;
    return renderFoda(titulo, analisisFoda(indFoda, datosJugadores));
  })()}`;
}
</script>
</body>
</html>
