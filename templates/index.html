<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Plate · Videoanálisis</title>
  <style>
    :root {
      --rojo:    #CC0000;
      --rojo2:   #990000;
      --negro:   #0a0a0a;
      --gris1:   #141414;
      --gris2:   #1e1e1e;
      --gris3:   #2a2a2a;
      --gris4:   #3a3a3a;
      --gris5:   #555;
      --grisc:   #ccc;
      --blanco:  #f5f5f5;
      --verde:   #3ecf8e;
      --ambar:   #f5a623;
      --azul:    #4a90d9;
      --r: var(--border-radius-md, 8px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--negro);
      color: var(--blanco);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--gris1);
      border-bottom: 3px solid var(--rojo);
      padding: 0 1.5rem;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-img { height: 42px; filter: drop-shadow(0 0 6px rgba(204,0,0,0.4)); }
    .brand { display: flex; flex-direction: column; }
    .brand-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
    .brand-sub { font-size: 10px; color: var(--gris5); letter-spacing: 1px; text-transform: uppercase; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    /* MAIN */
    main { max-width: 1180px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
    .section { margin-top: 2.5rem; }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: .5rem;
      border-bottom: 1px solid var(--gris3);
    }
    .section-title {
      font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--blanco);
    }
    .section-title span { color: var(--rojo); }
    .section-hint { font-size: 11px; color: var(--gris5); }

    /* DROP ZONE */
    #drop-zone {
      border: 1.5px dashed var(--gris4);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--rojo);
      background: rgba(204,0,0,0.05);
    }
    #drop-zone input { display: none; }
    .drop-icon { font-size: 32px; margin-bottom: 10px; display: block; }
    .drop-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
    .drop-sub { color: var(--gris5); font-size: 12px; }

    /* BTN */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 6px;
      border: 1px solid var(--gris4);
      background: var(--gris3); color: var(--blanco);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background .15s, border-color .15s; text-decoration: none;
    }
    .btn:hover { background: var(--gris4); border-color: var(--gris5); }
    .btn-red { background: var(--rojo); border-color: var(--rojo); }
    .btn-red:hover { background: var(--rojo2); }
    .btn-outline { background: transparent; border-color: var(--rojo); color: var(--rojo); }
    .btn-outline:hover { background: rgba(204,0,0,0.1); }
    .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

    /* STATUS */
    #status-bar {
      display: none; align-items: center; gap: 10px;
      margin-top: 1.2rem; padding: 10px 14px;
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 6px; font-size: 12px; color: var(--gris5);
    }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--gris4);
      border-top-color: var(--rojo); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULTADOS */
    #results { margin-top: 2rem; }

    .partido-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem;
    }
    .partido-title { font-size: 18px; font-weight: 700; }
    .partido-title span { color: var(--rojo); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* SCORE */
    .score-box {
      background: linear-gradient(135deg, var(--gris1) 0%, var(--gris2) 100%);
      border-radius: 14px;
      border: 1px solid var(--gris3);
      display: flex; align-items: center; justify-content: center;
      gap: 3rem; padding: 2rem 2rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .score-box::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(204,0,0,.08) 0, transparent 50%);
      pointer-events: none;
    }
    .score-team { text-align: center; position: relative; }
    .score-name { font-size: 11px; color: var(--gris5); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
    .score-num { font-size: 78px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
    .score-num.river { color: var(--rojo); text-shadow: 0 0 30px rgba(204,0,0,.3); }
    .score-num.rival { color: var(--grisc); }
    .score-sep { font-size: 40px; color: var(--gris4); font-weight: 200; }

    /* KPI HERO (los 4 destacados) */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 0;
    }
    @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card {
      background: var(--gris2);
      border: 1px solid var(--gris3);
      border-radius: 12px;
      padding: 18px 20px;
      transition: border-color .2s, transform .2s;
    }
    .kpi-card:hover { border-color: var(--gris4); transform: translateY(-1px); }
    .kpi-card-label { font-size: 10px; color: var(--gris5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; }
    .kpi-card-val { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .kpi-card-val.red { color: var(--rojo); }
    .kpi-card-val.amber { color: var(--ambar); }
    .kpi-card-val.green { color: var(--verde); }
    .kpi-card-sub { font-size: 10px; color: var(--gris5); margin-top: 6px; }

    /* TABS */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 2rem; overflow-x: auto;
      padding: 5px; background: var(--gris1); border-radius: 10px;
      border: 1px solid var(--gris3);
    }
    .tab {
      padding: 10px 18px; font-size: 12px; font-weight: 600;
      color: var(--gris5); cursor: pointer;
      border-radius: 7px; white-space: nowrap;
      transition: color .15s, background .15s;
      flex: 1; text-align: center; min-width: max-content;
    }
    .tab:hover { color: var(--blanco); background: var(--gris2); }
    .tab.active { color: white; background: var(--rojo); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* SECTION TITLE (subtítulo dentro de tab) */
    .sec-title {
      font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--gris5);
      margin: 1.5rem 0 .8rem;
    }
    .sec-title.red { color: var(--rojo); }
    .sec-title:first-child { margin-top: 0; }

    /* BAR COMPARE — más aire */
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .bar-track { flex: 1; height: 10px; background: var(--gris3); border-radius: 5px; overflow: hidden; position: relative; }
    .bar-fill-river { height: 100%; background: linear-gradient(90deg, var(--rojo2), var(--rojo)); border-radius: 5px; transition: width .5s; }
    .bar-fill-rival { height: 100%; background: var(--gris5); border-radius: 5px; transition: width .5s; }
    .bar-val { font-size: 13px; font-weight: 700; min-width: 28px; }
    .bar-val.river { color: var(--rojo); text-align: right; }

    .compare-panel {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 1.5rem 1.8rem;
    }
    .compare-legend { display: flex; gap: 24px; margin-bottom: 1.2rem; font-size: 11px; font-weight: 600; }
    .compare-legend .lg-river { color: var(--rojo); }
    .compare-legend .lg-rival { color: var(--gris5); }
    .compare-legend .lg-river::before, .compare-legend .lg-rival::before {
      content: ''; display: inline-block; width: 10px; height: 10px;
      border-radius: 2px; margin-right: 6px; vertical-align: middle;
    }
    .compare-legend .lg-river::before { background: var(--rojo); }
    .compare-legend .lg-rival::before { background: var(--gris5); }

    /* MINI GRID — cards más generosas */
    .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
    .mini-card {
      background: var(--gris2); border: 1px solid var(--gris3);
      border-radius: 10px; padding: 14px 12px; text-align: center;
      transition: border-color .15s;
    }
    .mini-card:hover { border-color: var(--gris4); }
    .mini-label { font-size: 10px; color: var(--gris5); text-transform: uppercase; margin-bottom: 6px; letter-spacing: .5px; }
    .mini-val { font-size: 22px; font-weight: 800; line-height: 1; }
    .mini-val.red { color: var(--rojo); }
    .mini-val.green { color: var(--verde); }
    .mini-val.amber { color: var(--ambar); }

    /* PANEL — contenedor genérico para tabs */
    .panel-card {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 1.5rem 1.8rem;
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }

    /* GOLES */
    .gol-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; background: var(--gris2);
      border: 1px solid var(--gris3); border-radius: 10px; margin-bottom: 8px;
      transition: border-color .15s;
    }
    .gol-item:hover { border-color: var(--gris4); }
    .gol-min { font-size: 14px; font-weight: 800; color: var(--rojo); min-width: 56px; }
    .gol-eq { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: .5px; }
    .gol-eq.river { background: rgba(204,0,0,.2); color: var(--rojo); }
    .gol-eq.rival { background: var(--gris3); color: var(--grisc); }
    .gol-info { flex: 1; }
    .gol-tipo { font-size: 10px; color: var(--gris5); margin-bottom: 2px; letter-spacing: .3px; }
    .gol-carril { font-weight: 700; font-size: 13px; }

    /* CAMBIOS */
    .cambio-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; background: var(--gris2);
      border: 1px solid var(--gris3); border-radius: 10px; margin-bottom: 8px;
    }
    .cambio-item:hover { border-color: var(--gris4); }
    .cambio-min { font-size: 14px; font-weight: 800; color: var(--rojo); min-width: 56px; }
    .cambio-sale { color: #ff6666; font-weight: 600; font-size: 12px; }
    .cambio-entra { color: #66ff99; font-weight: 600; font-size: 12px; }
    .cambio-eq { font-size: 9px; color: var(--gris5); margin-left: auto; letter-spacing: .5px; }

    /* MINUTOS */
    .min-jugador {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px;
    }
    .min-nombre { font-size: 12px; min-width: 160px; font-weight: 600; }
    .min-track { flex: 1; height: 12px; background: var(--gris3); border-radius: 6px; overflow: hidden; }
    .min-fill { height: 100%; border-radius: 6px; transition: width .4s; }
    .min-fill.titular { background: linear-gradient(90deg, var(--rojo2), var(--rojo)); }
    .min-fill.suplente { background: var(--gris5); }
    .min-tiempo { font-size: 12px; color: var(--blanco); font-weight: 700; min-width: 50px; text-align: right; }
    .min-cond { font-size: 9px; padding: 3px 8px; border-radius: 10px; font-weight: 600; letter-spacing: .5px; }
    .min-cond.titular { background: rgba(204,0,0,.2); color: var(--rojo); }
    .min-cond.suplente { background: var(--gris3); color: var(--gris5); }

    /* INDIVIDUAL */
    .ind-selector {
      display: flex; gap: 8px; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .ind-selector label { font-size: 12px; color: var(--gris5); }
    .ind-selector select {
      padding: 6px 10px; background: var(--gris2); border: 1px solid var(--gris4);
      color: var(--blanco); border-radius: 6px; font-size: 12px;
    }

    /* COMBOBOX custom (búsqueda de jugador) */
    .combo { position: relative; }
    .combo input {
      background: var(--gris2); border: 1px solid var(--gris4);
      color: var(--blanco); padding: 8px 32px 8px 12px;
      border-radius: 8px; font-size: 12px; min-width: 280px;
      transition: border-color .15s;
    }
    .combo input:focus { outline: none; border-color: var(--rojo); }
    .combo::after {
      content: '▾'; position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%); color: var(--gris5); pointer-events: none; font-size: 10px;
    }
    .combo-list {
      position: absolute; top: calc(100% + 4px); left: 0;
      width: 100%; max-height: 260px; overflow-y: auto;
      background: var(--gris1); border: 1px solid var(--gris4);
      border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
      z-index: 100; padding: 4px;
      display: none;
    }
    .combo-list.open { display: block; }
    .combo-item {
      padding: 7px 10px; font-size: 12px; cursor: pointer;
      border-radius: 5px; color: var(--blanco);
    }
    .combo-item:hover, .combo-item.active { background: var(--rojo); }
    .combo-empty { padding: 10px; color: var(--gris5); font-size: 11px; text-align: center; }

    /* IND stats */
    .ind-header {
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 10px; padding: 1rem 1.2rem;
      display: flex; gap: 16px; align-items: center; margin-bottom: 1rem;
    }
    .ind-nombre { font-size: 20px; font-weight: 800; }
    .ind-sub { font-size: 11px; color: var(--gris5); margin-top: 3px; }
    .ind-kpis { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
    .kpi { text-align: center; }
    .kpi-val { font-size: 22px; font-weight: 800; }
    .kpi-val.red { color: var(--rojo); }
    .kpi-val.amber { color: var(--ambar); }
    .kpi-val.blue { color: var(--azul); }
    .kpi-label { font-size: 9px; color: var(--gris5); text-transform: uppercase; }

    .ind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .ind-grid { grid-template-columns: 1fr; } }
    .ind-block {
      background: var(--gris2); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 16px 18px;
      transition: border-color .15s;
    }
    .ind-block:hover { border-color: var(--gris4); }
    .ind-block-title {
      font-size: 10px; font-weight: 700; letter-spacing: 1.3px;
      text-transform: uppercase; color: var(--rojo);
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--gris3);
    }
    .ind-block-title.sub { color: var(--gris5); margin-top: 16px; border-bottom: none; padding-bottom: 4px; }
    .ind-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--gris3); }
    .ind-row:last-child { border-bottom: none; }
    .ind-row-label { font-size: 11px; color: var(--grisc); }
    .ind-row-val { font-size: 14px; font-weight: 700; }
    .ind-row-val.red { color: var(--rojo); }
    .ind-row-val.green { color: var(--verde); }
    .ind-row-val.amber { color: var(--ambar); }

    .efect-bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .efect-pct { font-size: 26px; font-weight: 800; }
    .efect-track { flex: 1; height: 8px; background: var(--gris3); border-radius: 4px; overflow: hidden; }
    .efect-fill { height: 100%; border-radius: 4px; }

    .part-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 14px;
      background: var(--gris2); border: 1px solid var(--gris4);
      font-size: 11px; cursor: pointer; user-select: none;
    }
    .part-chip input { accent-color: var(--rojo); cursor: pointer; }
    .part-chip:has(input:not(:checked)) { opacity: 0.45; }
    .part-chip:hover { border-color: var(--rojo); }

    /* SUB-TABS DENTRO DE INDIVIDUAL */
    .ind-subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--gris4); margin-bottom: 1rem; }
    .ind-subtab {
      padding: 7px 14px; font-size: 11px; font-weight: 600; cursor: pointer;
      color: var(--gris5); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .ind-subtab:hover { color: var(--blanco); }
    .ind-subtab.active { color: var(--rojo); border-bottom-color: var(--rojo); }

    .col-modos { display: inline-flex; gap: 4px; background: var(--gris2); border: 1px solid var(--gris4); border-radius: 6px; padding: 3px; margin-bottom: 1rem; }
    .col-modos button { padding: 4px 12px; font-size: 11px; border: none; background: transparent; color: var(--gris5); cursor: pointer; border-radius: 4px; }
    .col-modos button.active { background: var(--rojo); color: white; }

    /* CREADOR DE GRÁFICOS */
    .chart-builder { background: var(--gris2); border: 1px solid var(--gris4); border-radius: 10px; padding: 14px; margin-bottom: 1rem; }
    .chart-builder-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .chart-builder-row:last-child { margin-bottom: 0; }
    .chart-builder-label {
      font-size: 10px; color: var(--gris5); text-transform: uppercase;
      letter-spacing: .5px; min-width: 90px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--rojo); color: white;
      font-size: 10px; font-weight: 800;
    }
    .chip-toggle {
      padding: 6px 12px; background: var(--gris3); border: 1px solid var(--gris4);
      border-radius: 16px; font-size: 11px; cursor: pointer; color: var(--blanco);
      transition: all .15s; font-weight: 500;
    }
    .chip-toggle:hover { border-color: var(--rojo); }
    .chip-toggle.active { background: var(--rojo); border-color: var(--rojo); color: white; }
    .metric-check {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px; background: var(--gris3); border: 1px solid var(--gris4);
      border-radius: 12px; font-size: 10px; cursor: pointer; user-select: none;
    }
    .metric-check input { accent-color: var(--rojo); cursor: pointer; }
    .metric-check:has(input:not(:checked)) { opacity: 0.45; }
    .metric-check:hover { border-color: var(--rojo); }
    .bar-chart { background: var(--gris1); border: 1px solid var(--gris4); border-radius: 8px; padding: 1rem; }
    .bar-chart-title { font-size: 11px; color: var(--gris5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .bar-row-c { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .bar-row-c .nombre { min-width: 150px; font-size: 11px; }
    .bar-row-c .track { flex: 1; height: 18px; background: var(--gris3); border-radius: 4px; overflow: hidden; }
    .bar-row-c .fill { height: 100%; background: linear-gradient(90deg, var(--rojo), var(--rojo2)); border-radius: 4px; }
    .bar-row-c .val { min-width: 42px; font-size: 12px; font-weight: 700; text-align: right; }

    .scatter-ctrls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; padding: 10px; background: var(--gris2); border: 1px solid var(--gris4); border-radius: 8px; }
    .scatter-ctrls label { font-size: 10px; color: var(--gris5); text-transform: uppercase; letter-spacing: .5px; }
    .scatter-ctrls select {
      background: var(--gris3); color: var(--blanco); border: 1px solid var(--gris4);
      padding: 5px 8px; border-radius: 4px; font-size: 12px; min-width: 180px;
    }
    .scatter-svg { width: 100%; height: auto; background: var(--gris1); border: 1px solid var(--gris4); border-radius: 8px; }
    .scatter-dot { cursor: pointer; transition: r .15s; }
    .scatter-dot:hover { r: 8; }

    .error-box { background: rgba(204,0,0,.1); border: 1px solid var(--rojo); border-radius: 6px; padding: 10px 14px; color: var(--rojo); font-size: 12px; margin-top: 1rem; }
  </style>
</head>
<body>

<header>
  <img src="/static/logo.png" class="logo-img" alt="River Plate">
  <div class="brand">
    <div class="brand-title">Área de Videoanálisis</div>
    <div class="brand-sub">Fútbol Formativo · CARP</div>
  </div>
</header>

<main>
  <div id="drop-zone"
       onclick="document.getElementById('fi').click()"

  </div>

  <div id="status-bar">
    <div class="spinner"></div>
    <span id="status-msg">Procesando...</span>
  </div>
  <div id="cache-bar" style="display:none;margin-top:.6rem;font-size:11px;color:var(--gris5);align-items:center;gap:8px">
    <span>💾 <span id="cache-info"></span></span>
    <button class="btn" style="padding:3px 8px;font-size:10px" onclick="borrarCache()">Borrar guardados</button>

</main>

let tabActiva = 'comparativa';

let vistaInd = 'jugador';

let xMetric = 'pases_total';

let radarMetrics = ['pases_efect', 'remates_arco', 'recup_posic', 'toques_area', 'dao_plus'];

const METRICAS = [
  ['minutos', 'Minutos'],

  ['dao_minus', '1v1 Of. Perdidos'],

  ['despeje_or', 'Despejes orientados'],
  ['faltas_rec', 'Faltas recibidas'],
  ['faltas_hec', 'Faltas hechas'],
];

const STORAGE_KEY = 'river_csvs_v1';

function fileToB64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

function b64ToFile(dataUrl, name) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/data:(.*?);base64/) || [, 'text/csv'])[1];
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new File([buf], name, { type: mime });
}

async function guardarEnCache(files) {
  try {
    const arr = await Promise.all(Array.from(files).map(async f => ({
      name: f.name,
      data: await fileToB64(f),
    })));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    actualizarBarraCache();
  } catch (e) {
    console.warn('No se pudo guardar en cache:', e);
  }
}

function cargarDeCache() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return arr.map(o => b64ToFile(o.data, o.name));
  } catch { return []; }
}

function actualizarBarraCache() {
  const bar = document.getElementById('cache-bar');
  const info = document.getElementById('cache-info');
  if (archivosActuales.length) {
    bar.style.display = 'flex';
    info.textContent = `${archivosActuales.length} archivo(s) guardado(s) en este navegador`;
  } else {
    bar.style.display = 'none';
  }
}

function borrarCache() {
  localStorage.removeItem(STORAGE_KEY);
  archivosActuales = [];
  partidosSel = new Set();
  datosActuales = null;
  jugadorActivo = '';
  nombresPartidos = [];
  tabActiva = 'comparativa';
  document.getElementById('results').innerHTML = '';
  document.getElementById('drop-icon').textContent = '📂';
  actualizarBarraCache();
}

window.addEventListener('DOMContentLoaded', () => {
  const stored = cargarDeCache();
  if (stored.length) procesar(stored, { fromCache: true });
});

function ev(e, tipo) {
  e.preventDefault();
  const dz = document.getElementById('drop-zone');
  if (tipo === 'over') dz.classList.add('drag-over');
  else if (tipo === 'leave') dz.classList.remove('drag-over');
  else { dz.classList.remove('drag-over'); if (e.dataTransfer.files.length) procesar(e.dataTransfer.files); }
}

async function procesar(files, opts = {}) {
  const lista = Array.from(files || []);
  if (!lista.length) return;
  archivosActuales = lista;
  partidosSel = new Set(lista.map((_, i) => i));
  nombresPartidos = lista.map(f => f.name.replace(/\.(csv|xlsx|xls)$/i, ''));
  tabActiva = 'comparativa';
  jugadorActivo = '';
  if (!opts.fromCache) guardarEnCache(lista);
  actualizarBarraCache();
  await analizarConFiltro({ mostrarStatus: true });
}

async function analizarConFiltro({ mostrarStatus = false } = {}) {
  datosJugadores = null;
  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (mostrarStatus) {
    document.getElementById('status-bar').style.display = 'flex';
    document.getElementById('status-msg').textContent =
      archivosActuales.length === 1 ? `Analizando ${archivosActuales[0].name}...`
                                    : `Analizando ${archivosActuales.length} partidos...`;
    document.getElementById('results').innerHTML = '';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('drop-icon').textContent = '⏳';
  }

  if (!idxs.length) {
    datosActuales = null;
    document.getElementById('status-bar').style.display = 'none';
    document.getElementById('results').innerHTML =
      '<p style="color:var(--gris5);text-align:center;padding:2rem">Seleccioná al menos un partido.</p>';
    renderFiltroPartidos();
    return;
  }

  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));

  try {
    const r = await fetch('/api/analizar', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok || data.error) { showError(data.error || 'Error'); document.getElementById('drop-icon').textContent = '❌'; return; }
    datosActuales = data;
    if (data.partidos && data.partidos.length === idxs.length) {
      idxs.forEach((origIdx, k) => { nombresPartidos[origIdx] = data.partidos[k]; });
    }
    document.getElementById('status-bar').style.display = 'none';
    document.getElementById('drop-icon').textContent = '✅';
    renderResultados(data);
  } catch(e) {
    showError('No se pudo conectar con el servidor. ¿Está corriendo app.py?');
    document.getElementById('drop-icon').textContent = '❌';
  }
}

function renderFiltroPartidos() {
  // Sólo re-pinta los checkboxes (sin recalcular). Útil cuando no hay datos.
  const cont = document.getElementById('part-filter');
  if (!cont) return;
  cont.querySelectorAll('input[type=checkbox]').forEach(b => {
    b.checked = partidosSel.has(parseInt(b.dataset.idx, 10));
  });
}

function showError(msg) {
  document.getElementById('status-bar').style.display = 'none';
  const el = document.getElementById('error-box');
  el.textContent = '⚠ ' + msg; el.style.display = 'block';
}

async function exportarPDF(tipo) {
  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (!idxs.length) { alert('Seleccioná al menos un partido'); return; }
  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  if (tipo === 'individual') {
    const sel = document.getElementById('jug-select');
    if (!sel || !sel.value) { alert('Seleccioná un jugador primero'); return; }
    fd.append('jugador', sel.value);
  }
  const url = tipo === 'colectivo' ? '/api/pdf/colectivo' : '/api/pdf/individual';
  const r = await fetch(url, { method: 'POST', body: fd });
  if (!r.ok) { alert('Error al generar PDF'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${tipo}_${(datosActuales?.partido||'partido').replace(/\s+/g,'_')}.pdf`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function switchTab(id, el) {
  tabActiva = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

      <div class="col-modos">
        <button class="${modoColectivo==='suma'?'active':''}" onclick="setModoColectivo('suma')">📋 Suma</button>
        <button class="${modoColectivo==='scatter'?'active':''}" onclick="setModoColectivo('scatter')">🎨 Creador de gráficos</button>
      </div>
      <div id="col-content"><p style="color:var(--gris5)">Cargando...</p></div>
    </div>
  </div>
  </div>
  `;

  document.getElementById('results').innerHTML = html;

  // Restaurar tab activa
  if (tabActiva && tabActiva !== 'comparativa') {
    const tabEl = Array.from(document.querySelectorAll('.tab'))
      .find(t => t.getAttribute('onclick')?.includes(`'${tabActiva}'`));
    if (tabEl) switchTab(tabActiva, tabEl);
  }

  // Restaurar vista colectiva (refetch porque cambiaron los partidos)
  if (tabActiva === 'individual' && vistaInd === 'colectivo') {
    setVistaInd('colectivo');
  }

  // Restaurar jugador activo
  if (jugadorActivo) {
    const inp = document.getElementById('jug-select');
    const existe = (datosActuales?.jugadores || []).includes(jugadorActivo);
    if (inp && existe) {
      inp.value = jugadorActivo;
      renderIndividual(jugadorActivo);
    } else {
      jugadorActivo = '';
    }
  }
}

function togglePartidos(on) {
  partidosSel = on ? new Set(archivosActuales.map((_, i) => i)) : new Set();
  analizarConFiltro();
}

function onPartidoToggle() {
  partidosSel = new Set();
  document.querySelectorAll('#part-filter input[type=checkbox]').forEach(b => {
    if (b.checked) partidosSel.add(parseInt(b.dataset.idx, 10));
  });
  analizarConFiltro();
}

let comboHover = -1;

function comboAbrir() {
  comboFiltrar(document.getElementById('jug-select').value);
}

function comboCerrar() {
  document.getElementById('jug-combo-list')?.classList.remove('open');
  comboHover = -1;
}

function comboFiltrar(q) {
  const lista = document.getElementById('jug-combo-list');
  if (!lista || !datosActuales) return;
  const txt = (q || '').toLowerCase().trim();
  const todos = datosActuales.jugadores || [];
  const filtrados = txt ? todos.filter(j => j.toLowerCase().includes(txt)) : todos;
  comboHover = -1;
  if (!filtrados.length) {
    lista.innerHTML = '<div class="combo-empty">Sin coincidencias</div>';
  } else {
    lista.innerHTML = filtrados.map((j, i) =>
      `<div class="combo-item" data-jug="${j}" onmousedown="comboElegir('${j.replace(/'/g, "\\'")}')">${j}</div>`
    ).join('');
  }
  lista.classList.add('open');
}

function comboElegir(jugador) {
  document.getElementById('jug-select').value = jugador;
  comboCerrar();
  renderIndividual(jugador);
}

function comboTecla(e) {
  const lista = document.getElementById('jug-combo-list');
  const items = lista?.querySelectorAll('.combo-item') || [];
  if (e.key === 'ArrowDown') { e.preventDefault(); comboHover = Math.min(items.length - 1, comboHover + 1); pintarHover(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); comboHover = Math.max(0, comboHover - 1); pintarHover(items); }
  else if (e.key === 'Enter') { e.preventDefault(); if (comboHover >= 0 && items[comboHover]) comboElegir(items[comboHover].dataset.jug); }
  else if (e.key === 'Escape') comboCerrar();
}

function pintarHover(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === comboHover));
  if (comboHover >= 0) items[comboHover]?.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#jug-combo')) comboCerrar();
});

function renderIndividual(jugador) {
  if (!jugador || !datosActuales) return;
  jugadorActivo = jugador;

  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (!idxs.length) {
    document.getElementById('ind-content').innerHTML =
      '<p style="color:var(--gris5)">Seleccioná al menos un partido.</p>';
    return;
  }

  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fd.append('jugador', jugador);

  // Obtener stats individuales del servidor
  fetch('/api/individual', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(ind => {
      document.getElementById('ind-content').innerHTML = buildIndHTML(ind);
    })
    .catch(() => {
      // fallback: mostrar solo datos básicos
      document.getElementById('ind-content').innerHTML = `<p style="color:var(--gris5)">Sin datos individuales disponibles para ${jugador}.</p>`;
    });
}

async function setVistaInd(v) {
  vistaInd = v;
  document.getElementById('ind-jugador-view').style.display = (v==='jugador')?'block':'none';
  document.getElementById('ind-colectivo-view').style.display = (v==='colectivo')?'block':'none';
  document.querySelectorAll('.ind-subtab').forEach((el, i) => {
    el.classList.toggle('active', (i===0 && v==='jugador') || (i===1 && v==='colectivo'));
  });
  if (v === 'colectivo') {
    if (!datosJugadores) datosJugadores = await fetchJugadoresStats();
    if (datosJugadores && !jugadoresSel.size) {
      jugadoresSel = new Set(Object.keys(datosJugadores));
      document.querySelectorAll('#jug-filter input[type=checkbox]').forEach(b => b.checked = true);
    }
    renderColContent();
  }
}

async function fetchJugadoresStats() {
  const idxs = Array.from(partidosSel).sort((a,b)=>a-b);
  if (!idxs.length) return null;
  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  try {
    const r = await fetch('/api/jugadores-stats', { method:'POST', body:fd });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

function setModoColectivo(m) {
  modoColectivo = m;
  document.querySelectorAll('.col-modos button').forEach((b, i) => {
    b.classList.toggle('active', (i===0 && m==='suma') || (i===1 && m==='scatter'));
  });
  renderColContent();
}

function onJugadorToggle() {
  jugadoresSel = new Set();
  document.querySelectorAll('#jug-filter input[type=checkbox]').forEach(b => {
    if (b.checked) jugadoresSel.add(b.dataset.jug);
  });
  renderColContent();
}

function toggleJugadores(on) {
  document.querySelectorAll('#jug-filter input[type=checkbox]').forEach(b => b.checked = on);
  onJugadorToggle();
}

function sumarJugadores(lista) {
  const out = {};
  lista.forEach(j => {
    const st = datosJugadores[j];
    if (!st) return;
    Object.entries(st).forEach(([k,v]) => {
      if (typeof v === 'number') out[k] = (out[k]||0) + v;
    });
  });
  const pt = out.pases_total || 0;
  out.pases_efect = pt ? Math.round((out.pases_completos||0)/pt*100) : 0;
  return out;
}

function dibujarScatter(jugadores) {
  const W = 700, H = 460, padL = 60, padR = 30, padT = 20, padB = 50;
  const xLab = METRICAS.find(m=>m[0]===xMetric)?.[1] || xMetric;
  const yLab = METRICAS.find(m=>m[0]===yMetric)?.[1] || yMetric;
  const pts = jugadores.map(j => ({
    nombre: j,
    x: Number(datosJugadores[j]?.[xMetric] || 0),
    y: Number(datosJugadores[j]?.[yMetric] || 0),
  }));
  const xMax = Math.max(1, ...pts.map(p=>p.x));
  const yMax = Math.max(1, ...pts.map(p=>p.y));
  const sx = v => padL + (v/xMax)*(W-padL-padR);
  const sy = v => H-padB - (v/yMax)*(H-padT-padB);
  const xAvg = pts.reduce((a,p)=>a+p.x,0)/pts.length;
  const yAvg = pts.reduce((a,p)=>a+p.y,0)/pts.length;

  const ticks = (max) => {
    const step = Math.ceil(max/5) || 1;
    const out = [];
    for (let v=0; v<=max; v+=step) out.push(v);
    return out;
  };

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="scatter-svg">`;
  // Grid + ticks X
  ticks(xMax).forEach(v => {
    const x = sx(v);
    svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H-padB}" stroke="#2a2a2a"/>`;
    svg += `<text x="${x}" y="${H-padB+14}" fill="#777" font-size="10" text-anchor="middle">${v}</text>`;
  });
  // Grid + ticks Y
  ticks(yMax).forEach(v => {
    const y = sy(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#2a2a2a"/>`;
    svg += `<text x="${padL-8}" y="${y+3}" fill="#777" font-size="10" text-anchor="end">${v}</text>`;
  });
  // Cuadrantes (medias)
  svg += `<line x1="${sx(xAvg)}" y1="${padT}" x2="${sx(xAvg)}" y2="${H-padB}" stroke="#f5a623" stroke-dasharray="4,4" opacity="0.5"/>`;
  svg += `<line x1="${padL}" y1="${sy(yAvg)}" x2="${W-padR}" y2="${sy(yAvg)}" stroke="#f5a623" stroke-dasharray="4,4" opacity="0.5"/>`;
  // Ejes
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#555"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#555"/>`;
  // Labels
  svg += `<text x="${(W+padL-padR)/2}" y="${H-10}" fill="#ccc" font-size="12" text-anchor="middle">${xLab}</text>`;
  svg += `<text x="${padL-45}" y="${(H+padT-padB)/2}" fill="#ccc" font-size="12" text-anchor="middle" transform="rotate(-90 ${padL-45} ${(H+padT-padB)/2})">${yLab}</text>`;
  // Puntos
  pts.forEach(p => {
    const cx = sx(p.x), cy = sy(p.y);
    svg += `<circle class="scatter-dot" cx="${cx}" cy="${cy}" r="5" fill="#CC0000" opacity="0.85"><title>${p.nombre}\n${xLab}: ${p.x}\n${yLab}: ${p.y}</title></circle>`;
    svg += `<text x="${cx+8}" y="${cy+3}" fill="#f5f5f5" font-size="10">${p.nombre}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function renderColContent() {
  const cont = document.getElementById('col-content');
  if (!cont) return;
  if (!datosJugadores) { cont.innerHTML = '<p style="color:var(--gris5)">Cargando...</p>'; return; }
  const seleccionados = Array.from(jugadoresSel).filter(j => datosJugadores[j]);
  if (!seleccionados.length) {
    cont.innerHTML = '<p style="color:var(--gris5)">Seleccioná al menos un jugador.</p>';
    return;
  }
  if (modoColectivo === 'suma') {
    if (!seleccionados.length) {
      cont.innerHTML = '<p style="color:var(--gris5)">Seleccioná al menos un jugador.</p>';
      return;
    }
    const sum = sumarJugadores(seleccionados);
    sum.jugador = `Colectivo · ${seleccionados.length} jugadores`;
    sum.condicion = `${seleccionados.length} jugadores`;
    cont.innerHTML = buildIndHTML(sum);
  } else {
    cont.innerHTML = renderCreadorGraficos(seleccionados);
  }
}

function renderCreadorGraficos(seleccionados) {
  const metOpts = (sel) => METRICAS.map(([k,l]) => `<option value="${k}" ${k===sel?'selected':''}>${l}</option>`).join('');

  const selStyle = 'background:var(--gris3);color:var(--blanco);border:1px solid var(--gris4);padding:6px 10px;border-radius:6px;font-size:12px;min-width:200px';
  let metricsCtrl = '';
  if (chartType === 'bar') {
    metricsCtrl = `<select onchange="xMetric=this.value;renderColContent()" style="${selStyle}">${metOpts(xMetric)}</select>
      <span style="font-size:10px;color:var(--gris5);margin-left:auto">Ordenado de mayor a menor</span>`;
  } else if (chartType === 'scatter') {
    metricsCtrl = `<span style="font-size:10px;color:var(--gris5)">X</span>
      <select onchange="xMetric=this.value;renderColContent()" style="${selStyle}">${metOpts(xMetric)}</select>
      <span style="font-size:10px;color:var(--gris5)">Y</span>
      <select onchange="yMetric=this.value;renderColContent()" style="${selStyle}">${metOpts(yMetric)}</select>`;
  } else if (chartType === 'radar') {
    metricsCtrl = METRICAS.map(([k,l]) => `<label class="metric-check"><input type="checkbox" ${radarMetrics.includes(k)?'checked':''} onchange="toggleRadarMetric('${k}', this.checked)"><span>${l}</span></label>`).join('');
  }

  let chartHtml = '';
  if (!seleccionados.length) {
    chartHtml = '<p style="color:var(--gris5);padding:2rem;text-align:center">Elegí jugadores arriba para ver el gráfico.</p>';
  } else if (chartType === 'bar') {
    chartHtml = dibujarBarras(seleccionados, xMetric);
  } else if (chartType === 'scatter') {
    if (seleccionados.length < 2) chartHtml = '<p style="color:var(--gris5);padding:2rem;text-align:center">Necesitás al menos 2 jugadores para dispersión.</p>';
    else chartHtml = dibujarScatter(seleccionados);
  } else if (chartType === 'radar') {
    if (radarMetrics.length < 3) chartHtml = '<p style="color:var(--gris5);padding:2rem;text-align:center">Elegí al menos 3 métricas para el radar.</p>';
    else if (seleccionados.length > 5) chartHtml = '<p style="color:var(--gris5);padding:2rem;text-align:center">Máx. 5 jugadores en el radar — destildá algunos o usá "Duo".</p>';
    else chartHtml = dibujarRadar(seleccionados);
  }

  return `
    <div class="chart-builder">
      <div class="chart-builder-row">
        <div class="chart-builder-label"><span class="step-num">1</span> Tipo</div>
        <button class="chip-toggle ${chartType==='bar'?'active':''}" onclick="setChartType('bar')">📊 Barras</button>
        <button class="chip-toggle ${chartType==='scatter'?'active':''}" onclick="setChartType('scatter')">🔵 Dispersión</button>
        <button class="chip-toggle ${chartType==='radar'?'active':''}" onclick="setChartType('radar')">🕸 Radar</button>
      </div>
      <div class="chart-builder-row">
        <div class="chart-builder-label"><span class="step-num">2</span> Quién</div>
        <button class="chip-toggle" onclick="presetJugadores('todos')">👥 Todos</button>
        <button class="chip-toggle" onclick="presetJugadores('titulares')">⭐ Titulares</button>
        <button class="chip-toggle" onclick="presetJugadores('top5')">🏆 Top 5</button>
        <button class="chip-toggle" onclick="presetJugadores('duo')">⚔ Duo</button>
        <button class="chip-toggle" onclick="presetJugadores('ninguno')">✕ Limpiar</button>
        <span style="font-size:10px;color:var(--gris5);margin-left:8px">${seleccionados.length} seleccionado(s)</span>
      </div>
      <div class="chart-builder-row" style="${metricsCtrl?'':'display:none'};align-items:${chartType==='radar'?'flex-start':'center'}">
        <div class="chart-builder-label" style="${chartType==='radar'?'padding-top:6px':''}"><span class="step-num">3</span> ${chartType==='radar'?'Métricas':'Métrica'}</div>
        <div style="flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center">${metricsCtrl}</div>
      </div>
    </div>
    ${chartHtml}
  `;
}

function setChartType(t) {
  chartType = t;
  renderColContent();
}

function toggleRadarMetric(k, on) {
  if (on && !radarMetrics.includes(k)) radarMetrics.push(k);
  else if (!on) radarMetrics = radarMetrics.filter(x => x !== k);
  renderColContent();
}

function presetJugadores(preset) {
  if (!datosJugadores) return;
  const todos = Object.keys(datosJugadores);
  if (preset === 'todos') {
    jugadoresSel = new Set(todos);
  } else if (preset === 'ninguno' || preset === 'duo') {
    jugadoresSel = new Set();
  } else if (preset === 'titulares') {
    jugadoresSel = new Set(todos.filter(j => datosJugadores[j].condicion === 'Titular'));
  } else if (preset === 'top5') {
    const ordenados = todos.slice().sort((a,b) => (datosJugadores[b].minutos||0) - (datosJugadores[a].minutos||0)).slice(0,5);
    jugadoresSel = new Set(ordenados);
  }
  document.querySelectorAll('#jug-filter input[type=checkbox]').forEach(b => {
    b.checked = jugadoresSel.has(b.dataset.jug);
  });
  renderColContent();
  if (preset === 'duo') {
    const cont = document.getElementById('col-content');
    const hint = document.createElement('div');
    hint.style.cssText = 'background:rgba(245,166,35,.1);border:1px solid var(--ambar);color:var(--ambar);padding:8px 12px;border-radius:6px;font-size:11px;margin-bottom:1rem';
    hint.textContent = '⚔ Modo Duo — tildá 2 jugadores arriba para compararlos';
    cont.insertBefore(hint, cont.firstChild);
  }
}

function dibujarBarras(jugadores, metric) {
  const lab = METRICAS.find(m=>m[0]===metric)?.[1] || metric;
  const data = jugadores.map(j => ({nombre:j, val: Number(datosJugadores[j]?.[metric]||0)}))
                       .sort((a,b) => b.val - a.val);
  const maxV = Math.max(1, ...data.map(d => d.val));
  return `
    <div class="bar-chart">
      <div class="bar-chart-title">${lab} · ${jugadores.length} jugadores</div>
      ${data.map(d => `
        <div class="bar-row-c">
          <div class="nombre">${d.nombre}</div>
          <div class="track"><div class="fill" style="width:${(d.val/maxV*100).toFixed(1)}%"></div></div>
          <div class="val">${d.val}</div>
        </div>`).join('')}
    </div>`;
}

function dibujarRadar(jugadores) {
  const W = 560, H = 540, cx = W/2, cy = H/2, R = 180;
  const metrics = radarMetrics;
  const n = metrics.length;
  const maxes = metrics.map(m => Math.max(1, ...jugadores.map(j => Number(datosJugadores[j]?.[m]||0))));
  const pt = (i, scale) => {
    const a = -Math.PI/2 + i*(2*Math.PI/n);
    return [cx + Math.cos(a)*R*scale, cy + Math.sin(a)*R*scale];
  };
  const colors = ['#CC0000', '#3ecf8e', '#f5a623', '#4a90d9', '#cc66ff'];
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="scatter-svg" style="max-width:560px;margin:0 auto;display:block">`;
  // Grid concéntrico
  [0.25, 0.5, 0.75, 1].forEach(s => {
    const pts = metrics.map((_,i) => pt(i, s).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="#2a2a2a"/>`;
  });
  // Ejes + labels
  metrics.forEach((m, i) => {
    const [x, y] = pt(i, 1);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3a3a3a"/>`;
    const lab = METRICAS.find(x=>x[0]===m)?.[1] || m;
    const [lx, ly] = pt(i, 1.18);
    svg += `<text x="${lx}" y="${ly+3}" fill="#ccc" font-size="10" text-anchor="middle">${lab}</text>`;
  });
  // Polígonos por jugador
  jugadores.forEach((j, idx) => {
    const c = colors[idx % colors.length];
    const pts = metrics.map((m, i) => pt(i, Number(datosJugadores[j]?.[m]||0) / maxes[i]).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="${c}" fill-opacity="0.18" stroke="${c}" stroke-width="2"/>`;
    metrics.forEach((m, i) => {
      const [px, py] = pt(i, Number(datosJugadores[j]?.[m]||0) / maxes[i]);
      svg += `<circle cx="${px}" cy="${py}" r="3" fill="${c}"/>`;
    });
  });
  // Leyenda
  jugadores.forEach((j, idx) => {
    const c = colors[idx % colors.length];
    svg += `<rect x="14" y="${14+idx*20}" width="12" height="12" fill="${c}" rx="2"/>`;
    svg += `<text x="32" y="${24+idx*20}" fill="#f5f5f5" font-size="11">${j}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function buildIndHTML(ind) {
  if (!ind || Object.keys(ind).length === 0) return '<p style="color:var(--gris5)">Sin datos individuales para este jugador.</p>';

  const efect = ind.pases_efect || 0;
  const colorEf = efect >= 75 ? 'var(--verde)' : efect >= 60 ? 'var(--ambar)' : 'var(--rojo)';

  function ir(label, val, color='') {
    return `<div class="ind-row"><span class="ind-row-label">${label}</span><span class="ind-row-val ${color}">${val}</span></div>`;
  }

  return `
  <div class="ind-header">
    <div>
      <div class="ind-nombre">${ind.jugador}</div>
      <div class="ind-sub">${ind.condicion} · ${ind.minutos}min · ${ind.intervenciones} intervenciones</div>
    </div>
    <div class="ind-kpis">
      <div class="kpi"><div class="kpi-val red">${ind.goles||0}</div><div class="kpi-label">Goles</div></div>
      <div class="kpi"><div class="kpi-val amber">${ind.asistencias||0}</div><div class="kpi-label">Asistencias</div></div>
      <div class="kpi"><div class="kpi-val blue">${ind.pases_clave||0}</div><div class="kpi-label">Pases clave</div></div>
    </div>
  </div>

  <div class="ind-grid">
    <div class="ind-block">
      <div class="ind-block-title">Pases</div>
      <div class="efect-bar">
        <div class="efect-pct" style="color:${colorEf}">${efect}%</div>
        <div class="efect-track"><div class="efect-fill" style="width:${efect}%;background:${colorEf}"></div></div>
      </div>
      ${ir('Total', ind.pases_total)}
      ${ir('Completos', ind.pases_completos, 'green')}
      ${ir('Incompletos', ind.pases_incompletos, 'red')}
      <div class="ind-block-title sub">Dirección</div>
      ${ir('Adelante', ind.pases_adelante)}
      ${ir('Atrás', ind.pases_atras)}
      ${ir('Lateral', ind.pases_lateral)}
      <div class="ind-block-title sub">Valor agregado</div>
      ${ir('Filtrados', ind.pases_filtrado)}
      ${ir('Largos completos', ind.pases_largo_c)}
      ${ir('Centros completos', ind.centros_c, 'green')}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Duelos y remates</div>
      ${ir('1v1 Of. Ganados', ind.dao_plus, 'green')}
      ${ir('1v1 Of. Perdidos', ind.dao_minus, 'red')}
      ${ir('1v1 Def. Ganados', ind.dad_plus, 'green')}
      ${ir('1v1 Def. Perdidos', ind.dad_minus, 'red')}
      ${ir('Regate completo', ind.regate_c, 'green')}
      ${ir('Regate incompleto', ind.regate_i, 'red')}
      <div class="ind-block-title sub">Remates</div>
