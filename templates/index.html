function dibujarRadarIndividual() {
  if (!radarIndJugador || !datosJugadores || !datosJugadores[radarIndJugador]) {
    return '<p style="color:var(--gris5);padding:2rem;text-align:center">Elegí un jugador.</p>';
  }
  if (radarIndMetrics.length < 3) {
    return '<p style="color:var(--gris5);padding:2rem;text-align:center">Elegí al menos 3 métricas.</p>';
  }
  const ind = datosJugadores[radarIndJugador];
  // Selección escalonada del baremo: división + posición → división → posición → global
  const baremoInfo = _baremoActivo();
  const baremo = baremoInfo.baremo;
  const baseKey = baremoInfo.key;
  const baseLabel = baremoInfo.label;
  const divisionDetectada = _divisionDePartidosActuales();

  // viewBox amplio (820x820) para que labels largas no se recorten al exportar a PNG.
  // El radar en sí ocupa R=200, las etiquetas van a R+36 ≈ 236, sobra margen.
  const W = 820, H = 820, cx = W/2, cy = H/2, R = 200, rMin = 0;
  const metrics = radarIndMetrics;
  const n = metrics.length;
  const P = _radarPaletaInd();
  const fill = P.fill, stroke = P.stroke;

  const pt = (i, scale) => {
    const a = -Math.PI/2 + i*(2*Math.PI/n);
    return [cx + Math.cos(a)*(rMin + scale*(R-rMin)), cy + Math.sin(a)*(rMin + scale*(R-rMin))];
  };
  const labelOf = k => (METRICAS.find(m => m[0]===k)?.[1]) || k;

  // Escala de cada eje: p10 (centro) → p90 (borde). Clamp [0, 1.08]
  const datos = metrics.map((k, i) => {
    const v = Number(ind[k] || 0);
    const b = baremo[k];
    let scale;
    if (b && b.p90 > b.p10) scale = (v - b.p10) / (b.p90 - b.p10);
    else if (b && b.p90 > 0) scale = v / b.p90;
    else scale = v > 0 ? 1 : 0;
    scale = Math.max(0, Math.min(1.08, scale));
    return { k, v, scale, b, i };
  });

  let svg = `<svg id="radar-ind-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:560px;display:block;margin:0 auto;overflow:visible">`;
  // Fondo (se incluye en el PNG exportado salvo que el tema sea transparente)
  if (P.bg !== 'transparent') svg += `<rect x="0" y="0" width="${W}" height="${H}" fill="${P.bg}"/>`;
  // Grid concéntrico
  [0.25, 0.5, 0.75, 1].forEach(s => {
    const pts = metrics.map((_,i) => pt(i, s).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="${P.grid}" stroke-width="1"/>`;
  });
  // Ejes radiales
  metrics.forEach((_, i) => {
    const [x,y] = pt(i, 1);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${P.grid}" stroke-width="1"/>`;
  });
  // Polígono del jugador
  const polyPts = datos.map(d => pt(d.i, d.scale).join(',')).join(' ');
  svg += `<polygon points="${polyPts}" fill="${fill}" fill-opacity="${P.fillOp}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/>`;
  // Vértices con valor
  datos.forEach(d => {
    const [x,y] = pt(d.i, d.scale);
    svg += `<circle cx="${x}" cy="${y}" r="4.5" fill="${stroke}" stroke="${P.vert}" stroke-width="1"/>`;
  });
  // Etiquetas alrededor: nombre métrica + valor real
  datos.forEach(d => {
    const a = -Math.PI/2 + d.i*(2*Math.PI/n);
    const ex = cx + Math.cos(a)*(R + 36);
    const ey = cy + Math.sin(a)*(R + 36);
    const anchor = Math.abs(Math.cos(a)) < 0.3 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
    svg += `<text x="${ex}" y="${ey-3}" fill="${P.label}" font-size="14" font-weight="700" text-anchor="${anchor}">${labelOf(d.k)}</text>`;
    svg += `<text x="${ex}" y="${ey+15}" fill="${P.num}" font-size="14" font-weight="800" text-anchor="${anchor}">${d.v}</text>`;
  });
  // Título central
  svg += `<text x="${cx}" y="${cy-4}" fill="${P.titulo}" font-size="17" font-weight="800" text-anchor="middle">${_apellidoCorto(radarIndJugador)}</text>`;
  svg += `<text x="${cx}" y="${cy+15}" fill="${P.sub}" font-size="10" text-anchor="middle">${ind.minutos||0}min · ${ind.intervenciones||0} interv.</text>`;
  svg += '</svg>';

  // === LEYENDA EXPLICATIVA DETALLADA ===
  // Pensada para que el coordinador (o cualquier persona no familiarizada con percentiles)
  // entienda exactamente cómo leer el gráfico, contra qué se compara y qué significa cada cosa.
  const escalaCfg = radarIndBase === 'auto'
    ? `auto-detectado por la posición media del jugador en cancha → <b>${baseLabel}</b>`
    : `forzado manualmente → <b>${baseLabel}</b>`;
  const divisionInfo = divisionDetectada
    ? `División detectada del nombre del/los archivo(s): <b>${divisionDetectada}</b>.`
    : `No se detectó división del nombre del archivo (esperaba ej. "7ma vs Aldosivi" o similar).`;
  const cantPartidos = baremoInfo.n;
  const fallbackNota = baremoInfo.fallback
    ? `<div style="margin-top:6px;padding:6px 10px;background:rgba(245,166,35,.1);border-left:3px solid var(--ambar);border-radius:4px;color:#fcd34d;font-size:11px">
        ⚠ <b>Fallback aplicado:</b> ${baremoInfo.motivo}. Se está usando <b>${baseLabel}</b>.
       </div>`
    : '';

  return `
    ${svg}
    <div style="margin-top:14px;padding:14px 16px;border:1px solid var(--gris3);border-radius:8px;background:var(--gris1);font-size:12px;line-height:1.55;color:var(--blanco)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--gris3)">
        <span style="font-size:14px">📊</span>
        <b style="font-size:13px;color:var(--blanco)">Cómo se lee este gráfico</b>
        <span style="margin-left:auto;font-size:10.5px;color:var(--gris5)">${cantPartidos || '—'} actuaciones de referencia · ${baseLabel}</span>
      </div>

      ${fallbackNota}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 18px">
        <div>
          <div style="color:var(--rojo);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">📐 Qué significa la posición de cada punto</div>
          <div style="color:var(--gris5)">
            Cada <b style="color:var(--blanco)">punto rojo</b> sobre los ejes representa una estadística.
            Cuanto <b style="color:var(--blanco)">más lejos del centro está el punto</b>, mejor está el jugador en esa estadística.
            Si el punto queda cerca del centro, el jugador está flojo en eso.
            Si llega al borde, está entre los mejores de su categoría y posición.
          </div>
        </div>

        <div>
          <div style="color:var(--rojo);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">📏 Cómo está calibrada la escala</div>
          <div style="color:var(--gris5)">
            El <b style="color:var(--blanco)">centro</b> = nivel del <b style="color:var(--blanco)">10% más bajo</b> del histórico (de su categoría) en esa estadística.<br>
            El <b style="color:var(--blanco)">borde</b> = nivel del <b style="color:var(--blanco)">10% más alto</b> del histórico (de su categoría).<br>
            <span style="color:var(--ambar)">Ejemplo:</span> si el punto de "Remates al arco" llega al 80% del borde,
            el jugador remató casi tanto como los mejores rematadores en su categoría y posición.
          </div>
        </div>

        <div style="grid-column:1/-1">
          <div style="color:var(--rojo);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">⚖ Contra quién se compara (lo importante)</div>
          <div style="color:var(--gris5)">
            ${divisionInfo}<br>
            Se está comparando contra <b style="color:var(--blanco)">${baseLabel}</b> — <b>${cantPartidos}</b> actuaciones de referencia.<br>
            <span style="color:var(--ambar)">Arriba en la lista de jugadores</span> quedaron tildados solo los compañeros que el sistema clasifica en este mismo grupo,
            para que puedas chequear visualmente si la categorización está bien. Si ves a alguien mal clasificado, cambiá la "Escala" arriba o destildá manualmente.
          </div>
        </div>

        <div style="grid-column:1/-1">
          <div style="color:var(--rojo);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">🔢 Qué muestran los números</div>
          <div style="color:var(--gris5)">
            El número en rojo <b>al lado</b> de cada punto es el <b style="color:var(--blanco)">valor real</b> del jugador en este/estos partido(s)
            — ej: <code style="background:var(--gris2);padding:1px 5px;border-radius:3px;color:#ccc">15</code> = el jugador hizo 15 acciones de ese tipo,
            <code style="background:var(--gris2);padding:1px 5px;border-radius:3px;color:#ccc">67%</code> = tuvo esa efectividad.
            En el centro están el apellido del jugador, los minutos jugados y el total de acciones registradas.
          </div>
        </div>
      </div>
    </div>`;
}

function exportarRadarPNG() {
  const svgEl = document.getElementById('radar-ind-svg');
  if (!svgEl) { alert('No hay radar para exportar'); return; }
  const W = 1640, H = 1640; // 2x del viewBox (820x820) para alta resolución
  const xml = new XMLSerializer().serializeToString(svgEl);
  const svg64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    const P = _radarPaletaInd();
    if (P.bg !== 'transparent') { ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H); } // fondo sólido para que se vea al pegarlo
    ctx.drawImage(img, 0, 0, W, H);
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `radar_${(radarIndJugador||'jugador').replace(/\s+/g,'_')}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  };
  img.onerror = () => alert('No se pudo exportar el PNG');
  img.src = svg64;
}

function dibujarRadar(jugadores) {
  const W = 560, H = 540, cx = W/2, cy = H/2, R = 180;
  const metrics = radarMetrics;
  const n = metrics.length;
  const maxes = metrics.map(m => Math.max(1, ...jugadores.map(j => Number(datosJugadores[j]?.[m]||0))));
  const pt = (i, scale) => {
    const a = -Math.PI/2 + i*(2*Math.PI/n);
    return [cx + Math.cos(a)*R*scale, cy + Math.sin(a)*R*scale];
  };
  const colors = ['#CC0000', '#3ecf8e', '#f5a623', '#4a90d9', '#cc66ff'];
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="scatter-svg" style="max-width:560px;margin:0 auto;display:block">`;
  // Grid concéntrico
  [0.25, 0.5, 0.75, 1].forEach(s => {
    const pts = metrics.map((_,i) => pt(i, s).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="#2a2a2a"/>`;
  });
  // Ejes + labels
  metrics.forEach((m, i) => {
    const [x, y] = pt(i, 1);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3a3a3a"/>`;
    const lab = METRICAS.find(x=>x[0]===m)?.[1] || m;
    const [lx, ly] = pt(i, 1.18);
    svg += `<text x="${lx}" y="${ly+3}" fill="#ccc" font-size="10" text-anchor="middle">${lab}</text>`;
  });
  // Polígonos por jugador
  jugadores.forEach((j, idx) => {
    const c = colors[idx % colors.length];
    const pts = metrics.map((m, i) => pt(i, Number(datosJugadores[j]?.[m]||0) / maxes[i]).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="${c}" fill-opacity="0.18" stroke="${c}" stroke-width="2"/>`;
    metrics.forEach((m, i) => {
      const [px, py] = pt(i, Number(datosJugadores[j]?.[m]||0) / maxes[i]);
      svg += `<circle cx="${px}" cy="${py}" r="3" fill="${c}"/>`;
    });
  });
  // Leyenda
  jugadores.forEach((j, idx) => {
    const c = colors[idx % colors.length];
    svg += `<rect x="14" y="${14+idx*20}" width="12" height="12" fill="${c}" rx="2"/>`;
    svg += `<text x="32" y="${24+idx*20}" fill="#f5f5f5" font-size="11">${j}</text>`;
  });
  svg += '</svg>';
  return svg;
}

// ─── Efecto máquina de escribir (para "Análisis del jugador") ───────────
function _tokensHtml(html) {
  // Parsea en tokens {t:'tag'|'text', s}
  const out = [];
  let i = 0;
  while (i < html.length) {
    if (html[i] === '<') {
      const j = html.indexOf('>', i);
      if (j === -1) { out.push({ t: 'text', s: html.slice(i) }); break; }
      out.push({ t: 'tag', s: html.slice(i, j + 1) });
      i = j + 1;
    } else {
      const j = html.indexOf('<', i);
      const end = j === -1 ? html.length : j;
      out.push({ t: 'text', s: html.slice(i, end) });
      i = end;
    }
  }
  return out;
}

function escribirMaquina(el, html, opts = {}) {
  const charsPerStep = opts.chars || 1;
  const delay = opts.delay || 32;
  if (!el || el.dataset.tipeado === '1') return;
  el.dataset.tipeado = '1';
  const tokens = _tokensHtml(html);
  let tokenIdx = 0, charIdx = 0, acc = '';

  function tick() {
    if (tokenIdx >= tokens.length) {
      el.innerHTML = acc;
      return;
    }
    const tk = tokens[tokenIdx];
    if (tk.t === 'tag') {
      acc += tk.s;
      tokenIdx++; charIdx = 0;
    } else {
      const advance = Math.min(charsPerStep, tk.s.length - charIdx);
      acc += tk.s.slice(charIdx, charIdx + advance);
      charIdx += advance;
      if (charIdx >= tk.s.length) { tokenIdx++; charIdx = 0; }
    }
    el.innerHTML = acc + '<span class="cursor-tipeo"></span>';
    setTimeout(tick, delay);
  }
  tick();
}

function iniciarMaquinaEscribir() {
  document.querySelectorAll('.analisis-jug-text[data-content]').forEach(el => {
    if (el.dataset.tipeado === '1') return;
    try {
      const txt = decodeURIComponent(el.dataset.content);
      escribirMaquina(el, txt);
    } catch (e) { /* ignorar */ }
  });
}

// ─── Motor de lectura textual ────────────────────────────────────────────
function lecturaEquipo(d) {
  const out = [];
  const c = d.colectivas;
  const lp = c.llegadas_prop, lr = c.llegadas_riv;
  const gp = c.goles_propios, gr = c.goles_rivales;
  const sp = c.salidas_prop, cp = c.centros_prop;

  // 1. Dominancia territorial
  if (lp.total && lr.total) {
    const ratio = lp.total / lr.total;
    if (ratio >= 1.5)
      out.push(`River <b>dominó territorialmente</b>: ${lp.total} llegadas contra ${lr.total} del rival.`);
    else if (ratio <= 0.7)
      out.push(`El rival fue <i>superior en generación</i> — ${lr.total} llegadas contra ${lp.total} de River.`);
    else
      out.push(`Partido <i>parejo en llegadas</i> (${lp.total} River — ${lr.total} rival).`);
  }

  // 2. Carril predominante
  const carriles = [['izquierda', lp.izq], ['eje', lp.eje], ['derecha', lp.der]];
  const totalCar = carriles.reduce((a,c) => a+c[1], 0);
  if (totalCar) {
    const ganador = carriles.sort((a,b) => b[1]-a[1])[0];
    const pct = Math.round(ganador[1]/totalCar*100);
    if (pct >= 45) out.push(`El equipo concentró el <b>${pct}%</b> de las llegadas por el carril <b>${ganador[0]}</b> (${ganador[1]} de ${totalCar}).`);
    else out.push(`Llegadas <i>distribuidas</i> entre los tres carriles (izq ${lp.izq}, eje ${lp.eje}, der ${lp.der}).`);
  }

  // 3. Tipo de juego
  const totalTipo = lp.asociado + lp.directo + lp.detenidas;
  if (totalTipo) {
    const aso = Math.round(lp.asociado/totalTipo*100);
    if (aso >= 60) out.push(`Predominó el <b>juego asociado</b> en las llegadas (${aso}%).`);
    else if (aso <= 30) out.push(`El equipo apostó al <b>juego directo</b> (sólo ${aso}% asociado).`);
  }

  // 4. Eficacia ofensiva
  if (c.sit_gol_prop) {
    if (gp.total) {
      const conv = Math.round(gp.total/c.sit_gol_prop*100);
      out.push(`Conversión de <b>${conv}%</b> — ${gp.total} goles en ${c.sit_gol_prop} situaciones de gol.`);
    } else {
      out.push(`Generó ${c.sit_gol_prop} situaciones de gol pero <i>no las concretó</i>.`);
    }
  }
  if (lp.total >= 5 && c.sit_gol_prop) {
    const gen = (c.sit_gol_prop / lp.total).toFixed(2);
    out.push(`Generación: <b>${gen}</b> situaciones de gol por cada llegada.`);
  }

  // 5. Balance defensivo
  if (c.recuperadas || c.perdidas) {
    const bal = c.recuperadas - c.perdidas;
    if (Math.abs(bal) >= 5) {
      const s = bal > 0 ? 'positivo' : 'negativo';
      out.push(`Balance <b>${s}</b> de balones: ${c.recuperadas} recuperadas vs ${c.perdidas} pérdidas (${bal > 0 ? '+' : ''}${bal}).`);
    }
  }

  // 6. Pelota parada
  if (cp.total) {
    const efc = cp.total ? Math.round(cp.completos/cp.total*100) : 0;
    if (efc >= 50) out.push(`Centros <b>eficientes</b>: ${cp.completos}/${cp.total} completados (${efc}%).`);
    else if (cp.total >= 5) out.push(`<i>Baja eficacia</i> de centros (${cp.completos}/${cp.total}, ${efc}%).`);
  }

  return out.slice(0, 7);
}

// Métricas a evaluar en el FODA. invert=true significa "menos es mejor".
const METRICAS_FODA = [
  { k: 'pases_efect',        l: 'Efectividad de pase',        minVal: 20, unidad: '%' },
  { k: 'pases_clave',        l: 'Pases clave',                minVal: 1 },
  { k: 'pases_filtrado',     l: 'Pases filtrados',            minVal: 1 },
  { k: 'pases_largo_c',      l: 'Pases largos completados',   minVal: 1 },
  { k: 'centros_c',          l: 'Centros completados',        minVal: 1 },
  { k: 'pct_progresivo',     l: '% acciones progresivas',     minVal: 8, unidad: '%' },
  { k: 'progresion_media',   l: 'Progresión media',           minVal: 2, unidad: 'm' },
  { k: 'pct_ultimo_tercio',  l: '% último tercio',            unidad: '%' },
  { k: 'pct_area',           l: '% área rival',               unidad: '%' },
  { k: 'toques_area',        l: 'Toques en área rival',       minVal: 1 },
  { k: 'remates_arco',       l: 'Remates al arco',            minVal: 1 },
  { k: 'goles',              l: 'Goles',                      minVal: 1 },
  { k: 'asistencias',        l: 'Asistencias',                minVal: 1 },
  { k: 'dao_plus',           l: '1v1 ofensivos ganados',      minVal: 1 },
  { k: 'dad_plus',           l: '1v1 defensivos ganados',     minVal: 1 },
  { k: 'recup_total',        l: 'Recuperaciones totales',     minVal: 3 },
  { k: 'recup_posic',        l: 'Recup. posicionales',        minVal: 2 },
  { k: 'recup_interv',       l: 'Recup. por intervención',    minVal: 1 },
  { k: 'intercepciones',     l: 'Intercepciones',             minVal: 1 },
  { k: 'bloqueos',           l: 'Bloqueos',                   minVal: 1 },
  { k: 'ruptura',            l: 'Rupturas en conducción',     minVal: 1 },
  { k: 'recep_lineas',       l: 'Recepciones entre líneas',   minVal: 1 },
  { k: 'recep_espacio',      l: 'Recepciones al espacio',     minVal: 1 },
  // perd_total queda fuera — usamos su tasa por intervención (ver lógica abajo)
];

// Ratios derivados — se computan sobre la marcha en analisisFoda
// `derive(j)` devuelve el valor a comparar; queda normalizado por intervenciones
const METRICAS_FODA_RATIO = [
  { k: 'perd_ratio',
    l: 'Pérdidas por intervención',
    derive: (j) => (j.intervenciones||0) ? (j.perd_total||0) / (j.intervenciones||1) : 0,
    fmt: (v) => (v * 100).toFixed(1) + '%',
    invert: true,
    minN: 30 },           // sólo evalúa jugadores con ≥30 intervenciones
  { k: 'pases_efect',
    l: 'Efectividad de pase',
    derive: (j) => j.pases_efect || 0,
    fmt: (v) => v + '%',
    minVal: 30 },
];

function _percentil(valor, valores) {
  // Devuelve percentil 0-100 (100 = mejor del plantel)
  const orden = [...valores].sort((a,b) => a-b);
  let pos = 0;
  for (let i = 0; i < orden.length; i++) { if (orden[i] <= valor) pos = i + 1; }
  return Math.round(pos / orden.length * 100);
}

function analisisFoda(ind, todos) {
  const fortalezas = [], debilidades = [];
  const oportunidades = [], amenazas = [];
  if (!todos) return { fortalezas, oportunidades, debilidades, amenazas, perfil: '' };

  // Filtrar plantel a los que tuvieron volumen (evita suplentes con 1 acción)
  const candidatos = Object.values(todos).filter(j => (j.intervenciones || 0) >= 8);
  if (candidatos.length < 4) return { fortalezas, oportunidades, debilidades, amenazas, perfil: '' };

  METRICAS_FODA.forEach(m => {
    const v = ind[m.k] || 0;
    const valores = candidatos.map(j => j[m.k] || 0);
    if (!valores.length || Math.max(...valores) === 0) return;
    let pct = _percentil(v, valores);
    if (m.invert) pct = 100 - pct;
    if (m.minVal != null && v < m.minVal) {
      if (!m.invert) return;
    }
    const display = v + (m.unidad || '');
    if (pct >= 80) fortalezas.push({ label: m.l, valor: display, pct });
    else if (pct <= 25) debilidades.push({ label: m.l, valor: display, pct });
  });

  // Métricas derivadas: ratios normalizados (ej: pérdidas / intervención)
  METRICAS_FODA_RATIO.forEach(m => {
    if (m.minN && (ind.intervenciones || 0) < m.minN) return;
    const v = m.derive(ind);
    const valores = candidatos
      .filter(j => !m.minN || (j.intervenciones || 0) >= m.minN)
      .map(j => m.derive(j));
    if (!valores.length || Math.max(...valores) === 0) return;
    let pct = _percentil(v, valores);
    if (m.invert) pct = 100 - pct;
    const display = m.fmt(v);
    if (pct >= 80) fortalezas.push({ label: m.l, valor: display, pct });
    else if (pct <= 25) debilidades.push({ label: m.l, valor: display, pct });
  });

  fortalezas.sort((a,b) => b.pct - a.pct);
  debilidades.sort((a,b) => a.pct - b.pct);

  // ── OPORTUNIDADES: patrones de "casi" o "podría aprovechar" ────────────
  // Llega al último tercio pero remata poco
  if (ind.pct_ultimo_tercio >= 30 && ind.acciones_xy >= 15 && (ind.remates_arco || 0) <= 1) {
    oportunidades.push({ label: 'Llega al último tercio pero remata poco', valor: `${ind.remates_arco||0} rem.` });
  }
  // Aporta pases clave pero sin asistencias
  if ((ind.pases_clave || 0) >= 2 && (ind.asistencias || 0) === 0) {
    oportunidades.push({ label: 'Genera juego pero no concreta asistencia', valor: `${ind.pases_clave} clave` });
  }
  // Buena progresión pero centros bajos
  if ((ind.pct_progresivo || 0) >= 30 && (ind.centros_c || 0) === 0 && (ind.centros_i || 0) >= 2) {
    oportunidades.push({ label: 'Progresa bien pero falla todos los centros', valor: `${ind.centros_i} fallados` });
  }
  // Está en área rival pero no remata
  if ((ind.toques_area || 0) >= 3 && (ind.remates_arco || 0) === 0) {
    oportunidades.push({ label: 'Llega al área pero no define', valor: `${ind.toques_area} toques` });
  }
  // 1v1 ofensivos sin intentar
  if ((ind.pct_ultimo_tercio || 0) >= 25 && ((ind.dao_plus||0) + (ind.dao_minus||0)) === 0 && ind.acciones_xy >= 15) {
    oportunidades.push({ label: 'Juega arriba pero no encara al rival', valor: '0 duelos 1v1' });
  }

  // ── AMENAZAS: patrones de riesgo ────────────────────────────────────
  // Pérdidas — normalizadas por intervenciones para no penalizar al jugador
  // con más volumen de juego. Solo se considera amenaza si su tasa supera p70
  // del plantel (ajustada al volumen) Y la zona es baja.
  if ((ind.intervenciones || 0) >= 30) {
    const ratio = (ind.perd_total || 0) / ind.intervenciones;
    const ratios = candidatos
      .filter(j => (j.intervenciones || 0) >= 30)
      .map(j => (j.perd_total || 0) / (j.intervenciones || 1));
    const pctRatio = _percentil(ratio, ratios);
    if (pctRatio >= 70) {
      const pctStr = (ratio * 100).toFixed(1) + '%';
      if ((ind.centro_grav_x || 50) < 50) {
        amenazas.push({ label: 'Pérdidas concentradas en zona propia', valor: `${pctStr} de sus acciones` });
      } else {
        amenazas.push({ label: 'Alta tasa de pérdida por intervención', valor: `${pctStr} (${ind.perd_total||0}/${ind.intervenciones})` });
      }
    }
  }
  // Pierde duelos defensivos
  const dad = (ind.dad_plus||0) + (ind.dad_minus||0);
  if (dad >= 3 && (ind.dad_minus||0) > (ind.dad_plus||0)) {
    const pctP = Math.round((ind.dad_minus||0)/dad*100);
    amenazas.push({ label: 'Pierde duelos defensivos', valor: `${ind.dad_minus}/${dad} (${pctP}%)` });
  }
  // Pierde duelos ofensivos
  const dao = (ind.dao_plus||0) + (ind.dao_minus||0);
  if (dao >= 3 && (ind.dao_minus||0) > (ind.dao_plus||0) * 1.5) {
    amenazas.push({ label: 'Mal rendimiento en 1v1 ofensivos', valor: `${ind.dao_plus}/${dao}` });
  }
  // Baja efectividad de pase con volumen
  if ((ind.pases_total||0) >= 30 && (ind.pases_efect||0) < 60) {
    amenazas.push({ label: 'Baja efectividad con alto volumen de pase', valor: `${ind.pases_efect}%` });
  }
  // Muchos pases laterales/atrás vs adelante (juego conservador)
  const lateral_atras = (ind.pases_lateral||0) + (ind.pases_atras||0);
  if ((ind.pases_adelante||0) >= 1 && lateral_atras > (ind.pases_adelante||0) * 2.5 && (ind.pases_total||0) >= 20) {
    amenazas.push({ label: 'Juego conservador (pocos pases hacia adelante)', valor: `${ind.pases_adelante} adelante vs ${lateral_atras} atrás/lateral` });
  }

  // ── PERFIL CORTO ────────────────────────────────────────────────────
  let perfil = '';
  if (ind.acciones_xy >= 10) {
    const x = ind.centro_grav_x, y = ind.centro_grav_y;
    const dx = ind.dispersion_x, dy = ind.dispersion_y;
    let z = x >= 80 ? 'muy adelantado' : x >= 60 ? 'en zona alta-media' : x >= 40 ? 'en zona media' : 'en zona baja';
    let m = (dx >= 25 || dy >= 22) ? ', con alta movilidad' : (dx <= 15 && dy <= 12) ? ', con posicionamiento estático' : '';
    perfil = `Operó ${z} (CG ${x}, ${y})${m}. ${ind.intervenciones} intervenciones en ${ind.minutos} min.`;
  }

  return {
    fortalezas: fortalezas.slice(0, 4),
    debilidades: debilidades.slice(0, 4),
    oportunidades: oportunidades.slice(0, 3),
    amenazas: amenazas.slice(0, 3),
    perfil,
  };
}

function renderEficiencia(col) {
  const lp = col.llegadas_prop, gp = col.goles_propios, cp = col.centros_prop;
  const tot = lp.total || 0;
  const sg = col.sit_gol_prop || 0;

  const efRem = tot ? Math.round(lp.tiros_arco / tot * 100) : 0;
  const efCen = cp.total ? Math.round(cp.completos / cp.total * 100) : 0;
  const cards = [
    { l: 'Conversión',          v: conv + '%',  sub: `${goles} gol${goles!==1?'es':''} / ${sg} sit. gol`,    color: conv >= 25 ? 'green' : conv >= 12 ? 'amber' : 'red' },
    { l: 'Generación',          v: gen  + '%',  sub: `${sg} sit. gol / ${tot} llegadas`,                    color: gen  >= 30 ? 'green' : gen  >= 15 ? 'amber' : 'red' },
    { l: 'Remate al arco',      v: efRem+ '%',  sub: `${lp.tiros_arco} al arco / ${tot} llegadas`,          color: efRem>= 40 ? 'green' : efRem>= 25 ? 'amber' : 'red' },
    { l: 'Centros completos',   v: efCen+ '%',  sub: `${cp.completos||0} completos / ${cp.total||0} totales`, color: efCen>= 35 ? 'green' : efCen>= 20 ? 'amber' : 'red' },

}

function renderMatriz(titulo, mat, ordenFilas, ordenCols) {
  if (!mat || !Object.keys(mat).length) return '';
  // Conservar orden definido y filtrar las filas/cols presentes
  const filas = ordenFilas.filter(f => mat[f]);
  const cols = ordenCols.filter(c => filas.some(f => mat[f][c]));
  if (!filas.length || !cols.length) return '';
  // Total para porcentajes y coloreado
  let total = 0;
  filas.forEach(f => cols.forEach(c => { total += (mat[f][c] || 0); }));
  let max = 0;
  filas.forEach(f => cols.forEach(c => { max = Math.max(max, mat[f][c] || 0); }));

  let html = `<div class="matriz-wrap">
    <div class="sec-title red" style="margin-top:0">${titulo}</div>
    <table class="matriz">
      <tr><th></th>${cols.map(c => `<th>${c}</th>`).join('')}<th style="opacity:.6">Total</th></tr>`;
  filas.forEach(f => {
    const filaTotal = cols.reduce((a,c) => a + (mat[f][c]||0), 0);
    html += `<tr><th class="row-head">${f}</th>`;
    cols.forEach(c => {
      const v = mat[f][c] || 0;
      const pct = total ? Math.round(v/total*100) : 0;
      const intensity = max ? v/max : 0;
      const bg = v ? `rgba(204,0,0,${0.12 + intensity*0.55})` : 'var(--gris2)';
      html += `<td style="background:${bg}"><span class="v">${v}</span><span class="p">${pct ? pct+'%' : ''}</span></td>`;
    });
    html += `<td style="opacity:.7"><span class="v">${filaTotal}</span></td></tr>`;
  });
  html += `</table></div>`;
  return html;
}

// ─── Cancha 2D + heatmap ─────────────────────────────────────────────────
let pitchModo = 'calor'; // 'calor' | 'puntos' | 'flechas'
let coordsActuales = [];
let mostrarCG = true;    // overlay de centro de gravedad + dispersión
let plantelDetalleAbierto = null;
let resumenDetalleAbierto = null;  // 'llegadas' | 'sit_gol' | 'remates' | 'recuperadas'
let resumenFiltro = 'total';        // filtro dentro del detalle
// Filtro de tipo de acción en la cancha (default: todos activos)
const CATS_ACCION = [
  ['pases',      'Pases',          ['PCompletos','PIncompletos','PASES']],
  ['centros',    'Centros',        ['CCompletos','CIncompletos','CENTROS','CAsistencia']],
  ['recup',      'Recuperaciones', ['RECUPERACION xPosicional','RECUPERACION xIntervencion','Tras Perdida']],
  ['perd',       'Pérdidas',       ['PERDIDAS: xPase','PERDIDAS: xControl','PERDIDAS: xGambeta']],
  ['remates',    'Remates',        ['Tiros','Arco','Afuera','Bloqueado','Gol']],
  // Nota: NO incluir 'Duelos 1V1' ni 'Duelos Aereos' acá — son tags agrupadores que
  // Sportcode aplica a TODOS los duelos (of y def). Solo los específicos discriminan.
  ['duelos_of',  'Duelos OF',      ['1v1O+','1v1O-','DAO+','DAO-','DAOfensivo','Regates','R+','R-']],
  ['duelos_def', 'Duelos DEF',     ['1v1D+','1v1D-','DAD+','DAD-','DADefensivo']],
  ['defensa',    'Defensa',        ['Intervencion Defensiva','Despeje','Bloqueos','Entradas','Intercepciones','E+','E-','I+','I-','B+','B-','A+','A-']],
  ['recep',      'Recepciones',    ['Recepcion entre Lineas','Recepcion al espacio','Recepcion a espaldas del volante','Toques en Area Rival','Ruptura en conduccion']],
];
let accionFiltros = new Set(CATS_ACCION.map(c => c[0]));

function _catsDeAccion(tagsStr) {
  if (!tagsStr) return new Set();
  const t = new Set(tagsStr.split(',').map(s => s.trim()));
  const cats = new Set();
  CATS_ACCION.forEach(([id, _, tagSet]) => {
    if (tagSet.some(tag => t.has(tag))) cats.add(id);
  });
  return cats;
}

function _filtrarPorCat(acciones) {
  if (accionFiltros.size === CATS_ACCION.length) return acciones; // todos activos
  return acciones.filter(a => {
    const cats = _catsDeAccion(a.tags || '');
    if (cats.size === 0) return false;
    for (const c of cats) if (accionFiltros.has(c)) return true;
    return false;
  });
}

function _filtrarPorZonaTerritorial(acciones) {
  // Aplica el filtro Defensa/Mediocampo/Ataque del Mapa Territorial sobre las acciones del Mapa en cancha.
  // Solo aplica cuando hay clasificación computada (colectivo) y al menos una zona está desactivada.
  if (!mapaTerJugsPorZona || mapaTerZonasActivas.size === 3) return acciones;
  if (!acciones.length || acciones[0].jugador === undefined) return acciones;
  const ocultos = new Set();
  ['def','med','atk'].forEach(z => {
    if (!mapaTerZonasActivas.has(z)) mapaTerJugsPorZona[z].forEach(j => ocultos.add(j));
  });
  return acciones.filter(a => !ocultos.has(a.jugador));
}

function _describirAccion(tagsStr) {
  if (!tagsStr) return 'Acción';
  const t = tagsStr.split(',').map(x => x.trim());
  const has = (...xs) => xs.every(x => t.includes(x));
  const any = (...xs) => xs.some(x => t.includes(x));
  if (t.includes('Gol')) return '⚽ Gol';
  if (any('Arco') && any('Tiros'))    return 'Remate al arco';
  if (t.includes('Afuera'))            return 'Remate afuera';
  if (t.includes('Bloqueado'))         return 'Remate bloqueado';
  if (t.includes('PCompletos')) {
    const x = [];
    if (t.includes('Adelante')) x.push('adelante');
    if (t.includes('Atras'))    x.push('atrás');
    if (t.includes('Lateral'))  x.push('lateral');
    if (t.includes('Largo Completo')) x.push('largo');
    if (t.includes('Filtrado')) x.push('filtrado');
    if (t.includes('Clave'))    x.push('clave');
    return 'Pase completo' + (x.length ? ` (${x.join(', ')})` : '');
  }
  if (t.includes('PIncompletos')) return 'Pase incompleto' + (t.includes('Largo Incompleto') ? ' (largo)' : '');
  if (t.includes('CCompletos'))   return 'Centro completo' + (t.includes('CAsistencia') ? ' (asistencia)' : '');
  if (t.includes('CIncompletos')) return 'Centro fallado';
  if (t.includes('1v1O+')) return '1v1 ofensivo ganado';
  if (t.includes('1v1O-')) return '1v1 ofensivo perdido';
  if (t.includes('1v1D+')) return '1v1 defensivo ganado';
  if (t.includes('1v1D-')) return '1v1 defensivo perdido';
  if (t.includes('DAO+')) return 'Duelo aéreo of. ganado';
  if (t.includes('DAO-')) return 'Duelo aéreo of. perdido';
  if (t.includes('DAD+')) return 'Duelo aéreo def. ganado';
  if (t.includes('DAD-')) return 'Duelo aéreo def. perdido';
  if (t.includes('R+')) return 'Regate completado';
  if (t.includes('R-')) return 'Regate fallado';
  if (t.some(x => x.startsWith('RECUPERACION'))) {
    if (t.includes('RECUPERACION xIntervencion')) return 'Recuperación por intervención';
    if (t.includes('RECUPERACION xPosicional'))    return 'Recuperación posicional';
    if (t.includes('Tras Perdida')) return 'Recuperación tras pérdida';
    return 'Recuperación';
  }
  if (t.some(x => x.startsWith('PERDIDAS'))) {
    if (t.includes('PERDIDAS: xPase')) return 'Pérdida por pase';
    if (t.includes('PERDIDAS: xControl')) return 'Pérdida por control';
    if (t.includes('PERDIDAS: xGambeta')) return 'Pérdida por gambeta';
    return 'Pérdida';
  }
  if (t.includes('Intervencion Defensiva')) {
    if (t.includes('E+')) return 'Entrada exitosa';
    if (t.includes('E-')) return 'Entrada fallada';
    if (t.includes('A+')) return 'Anticipo logrado';
    if (any('I+','I-')) return 'Intercepción';
    if (any('B+','B-')) return 'Bloqueo';
    return 'Intervención defensiva';
  }
  if (t.includes('Despeje')) return 'Despeje' + (t.includes('D+') ? ' orientado' : '');
  if (t.includes('Toques en Area Rival')) return 'Toque en área rival';
  if (t.includes('Recepcion entre Lineas')) return 'Recepción entre líneas';
  if (t.includes('Recepcion al espacio')) return 'Recepción al espacio';
  if (t.includes('Recepcion a espaldas del volante')) return 'Recepción a espaldas del vol.';
  if (t.includes('Ruptura en conduccion')) return 'Ruptura en conducción';
  if (t.includes('Faltas Hechas')) return 'Falta hecha';
  if (t.includes('Faltas Recibidas')) return 'Falta recibida';
  const ignorar = new Set(['POSITIVO','NEGATIVO','Asociado','Directo','Adelante','Atras','Lateral','Apoyo']);
  return t.find(x => x && !ignorar.has(x)) || 'Acción';
}

function _outcomeAccion(tagsStr) {
  // 'neg' = pase/centro fallado, remate afuera/bloqueado, pérdida, duelo perdido
  // 'pos' = completos, ganados, recuperaciones, recepciones, toques (acciones registradas exitosas)
  if (!tagsStr) return 'pos';
  const t = tagsStr.split(',').map(x => x.trim());
  const neg = ['PIncompletos','CIncompletos','1v1O-','1v1D-','DAO-','DAD-','R-',
               'E-','A-','NEGATIVO','Afuera','Bloqueado','Incompleto','Largo Incompleto'];
  if (neg.some(n => t.includes(n))) return 'neg';
  if (t.some(x => x.startsWith('PERDIDAS'))) return 'neg';
  return 'pos';
}

function renderResumenDetalle(key) {
  if (!key || !datosActuales) return '';
  const partidosData = datosActuales.partidos_data || [];
  const partidoNombres = (datosActuales.partidos && datosActuales.partidos.length) ? datosActuales.partidos : nombresPartidos;

  // Config por métrica: lista de filtros + cómo extrae el valor de cada partido
  const cfg = {
    llegadas: {
      titulo: '🏹 Llegadas Propias',
      explicacion: 'Total de llegadas al área rival registradas en cada partido. Los filtros desglosan por carril de finalización, tipo de jugada o cantidad de carriles utilizados.',
      filtros: [
        ['total',     'Total',     p => p.llegadas_prop?.total      || 0],
        ['izq',       'Izquierda', p => p.llegadas_prop?.izq        || 0],
        ['eje',       'Eje',       p => p.llegadas_prop?.eje        || 0],
        ['der',       'Derecha',   p => p.llegadas_prop?.der        || 0],
        ['asoc',      'Asociado',  p => p.llegadas_prop?.asociado   || 0],
        ['directo',   'Directo',   p => p.llegadas_prop?.directo    || 0],
        ['detenidas', 'Detenidas', p => p.llegadas_prop?.detenidas  || 0],
        ['1c',        '1 Carril',  p => p.llegadas_prop?.['1carril']   || 0],
        ['2c',        '2 Carriles',p => p.llegadas_prop?.['2carriles'] || 0],
        ['3c',        '3 Carriles',p => p.llegadas_prop?.['3carriles'] || 0],
      ],
    },
    sit_gol: {
      titulo: '🎯 Situaciones de Gol Propias',
      explicacion: 'Cantidad de situaciones de gol generadas en cada partido. Una situación de gol es una llegada con peligro real (no toda llegada lo es).',
      filtros: [
        ['total',     'Total',     p => p.sit_gol_prop || 0],
      ],
      extra: (p) => p.goles_propios?.total > 0 ? ` · ⚽ ${p.goles_propios.total} gol${p.goles_propios.total>1?'es':''}` : '',
    },
    remates: {
      titulo: '🥅 Remates al arco',
      explicacion: 'Remates que terminaron en el arco rival (incluye los que fueron gol y los atajados). Los filtros desglosan el tipo de remate generado.',
      filtros: [
        ['total',     'Al arco',   p => p.llegadas_prop?.tiros_arco || 0],
        ['gol',       'Goles',     p => p.goles_propios?.total      || 0],
        ['afuera',    'Afuera',    p => p.llegadas_prop?.afuera     || 0],
        ['bloqueado', 'Bloqueado', p => p.llegadas_prop?.bloqueado  || 0],
      ],
    },
    recuperadas: {
      titulo: '🛡 Recuperadas',
      explicacion: 'Cantidad de balones recuperados por el equipo en cada partido (filas Row="Recuperadas" del CSV).',
      filtros: [
        ['total',     'Recuperadas', p => p.recuperadas || 0],
        ['perd',      'Pérdidas',    p => p.perdidas    || 0],
        ['balance',   'Balance',     p => (p.recuperadas||0) - (p.perdidas||0)],
      ],
    },
  };
  const conf = cfg[key];
  if (!conf) return '';

  // Filtro válido para esta métrica (reseteamos si cambió de card)
  if (!conf.filtros.find(f => f[0] === resumenFiltro)) resumenFiltro = conf.filtros[0][0];
  const selFiltro = conf.filtros.find(f => f[0] === resumenFiltro);

  // Valores por partido con el filtro aplicado
  const filas = partidosData.map((p, i) => {
    const nom = partidoNombres[i] || p.partido || `Partido ${i+1}`;
    const rival = _rivalDePartido(nom) || nom;
    return { rival, nom, valor: selFiltro[2](p), extra: conf.extra ? conf.extra(p) : '' };
  });
  const maxV = Math.max(1, ...filas.map(f => Math.abs(f.valor)));
  const total = filas.reduce((s,f) => s + (f.valor||0), 0);
  const prom = filas.length ? (total / filas.length).toFixed(1) : '0';

  const chips = conf.filtros.map(f => `
    <button class="chip-toggle ${resumenFiltro===f[0]?'active':''}" onclick="setResumenFiltro('${f[0]}')">${f[1]}</button>
  `).join('');

  const filasHtml = filas.map(f => {
    const pct = (Math.abs(f.valor) / maxV) * 100;
    const color = f.valor < 0 ? '#ff6666' : 'var(--rojo)';
    return `<div class="det-item" style="gap:14px">
      <span style="min-width:140px"><b>vs ${f.rival}</b><span style="color:var(--gris5);font-weight:400;font-size:10.5px">${f.extra}</span></span>
      <div style="flex:1;height:8px;background:var(--gris3);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${pct.toFixed(1)}%;background:${color};border-radius:4px"></div>
      </div>
      <span class="det-tag" style="min-width:42px;text-align:right">${f.valor}</span>
    </div>`;
  }).join('');

  return `<div class="plantel-detalle-card">
    <div class="plantel-detalle-head">
      <div class="plantel-detalle-titulo">${conf.titulo}</div>
      <button class="plantel-detalle-x" onclick="toggleResumenDetalle('${key}')" title="Cerrar">×</button>
    </div>
    <div class="plantel-detalle-expl">${conf.explicacion}</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">${chips}</div>
    ${filasHtml}
    <div style="display:flex;justify-content:space-between;margin-top:14px;padding-top:10px;border-top:1px solid var(--gris3);font-size:11px;color:var(--gris5)">
      <span>Total: <b style="color:var(--blanco)">${total}</b></span>
      <span>Promedio por partido: <b style="color:var(--blanco)">${prom}</b></span>
      <span>Filtro activo: <b style="color:var(--rojo)">${selFiltro[1]}</b></span>
    </div>
  </div>`;
}

function renderPlantelDetalle(key) {
  if (!key) return '';
  const nPart = archivosActuales.length || 1;
  const partidoNombres = (datosActuales?.partidos && datosActuales.partidos.length) ? datosActuales.partidos : nombresPartidos;
  const minutos = datosActuales?.minutos || [];
  const cambios = datosActuales?.cambios || [];

  let titulo = '', explicacion = '', contenido = '';

  if (key === 'partidos') {
    titulo = '📋 Partidos analizados';
    explicacion = `Listado de los ${nPart} partido(s) cargado(s) actualmente. Los rivales se infieren del nombre del Timeline en cada CSV ("River vs X" → "X").`;
    contenido = partidoNombres.map((p, i) => {
      const rival = _rivalDePartido(p);
      return `<div class="det-item"><span class="det-num">${i+1}.</span><span>${p}</span><span class="det-tag">vs ${rival}</span></div>`;
    }).join('');
  }
  else if (key === 'minutos') {
    titulo = '⏱ Minutos jugados de la división';
    explicacion = `Suma de los minutos en cancha de todos los jugadores que entraron al menos una vez. Cada minuto cuenta una vez por jugador en campo (un partido completo con 11 jugadores = 990 min de plantel).`;
    const minTot = Math.round(minutos.reduce((s,p) => s + (p.minutos||0), 0));
    const teorico = 11 * 90 * nPart;
    const utilizacion = teorico ? Math.round(minTot / teorico * 100) : 0;
    contenido =
      `<div class="det-item"><span>Total acumulado</span><span class="det-tag">${minTot} min</span></div>` +
      `<div class="det-item"><span>Teórico (11 × 90 × ${nPart})</span><span class="det-tag">${teorico} min</span></div>` +
      `<div class="det-item"><span>Promedio por partido</span><span class="det-tag">${Math.round(minTot/nPart)} min</span></div>` +
      `<div class="det-item"><span>Utilización del campo</span><span class="det-tag">${utilizacion}%</span></div>`;
  }
  else if (key === 'jugadores') {
    titulo = '👥 Jugadores utilizados';
    explicacion = `Jugadores que tuvieron al menos 1 minuto en alguno de los ${nPart} partido(s). "Titular" = arrancó al menos un partido; "Suplente" = sólo entró desde el banco. Cuenta partidos jugados (p).`;
    const titulares = minutos.filter(p => p.condicion === 'Titular').sort((a,b) => (b.minutos||0)-(a.minutos||0));
    const suplentes = minutos.filter(p => p.condicion === 'Suplente').sort((a,b) => (b.minutos||0)-(a.minutos||0));
    contenido = `<div class="det-sub">Titulares · ${titulares.length}</div>` +
      titulares.map(p => `<div class="det-item"><span>${p.jugador}</span><span class="det-tag">${p.minutos}m · ${p.partidos||1}p</span></div>`).join('') +
      `<div class="det-sub">Suplentes · ${suplentes.length}</div>` +
      (suplentes.length ? suplentes.map(p => `<div class="det-item"><span>${p.jugador}</span><span class="det-tag">${p.minutos}m · ${p.partidos||1}p</span></div>`).join('')
                        : '<div class="det-item" style="color:var(--gris5)"><em>Sin suplentes detectados.</em></div>');
  }
  else if (key === 'nucleo') {
    titulo = '🎯 Núcleo estable del plantel';
    explicacion = `Jugadores que aparecieron al menos 1 minuto en TODOS los ${nPart} partido(s) cargado(s). Indica el grupo más constante (típicamente el "11 fijo" del equipo).`;
    const nuc = minutos.filter(p => (p.partidos || 0) === nPart).sort((a,b) => (b.minutos||0)-(a.minutos||0));
    if (!nuc.length) {
      contenido = `<div class="det-item" style="color:var(--gris5)"><em>Ningún jugador jugó los ${nPart} partidos.</em></div>`;
    } else {
      contenido = nuc.map(p => `<div class="det-item">
        <span><b>${p.jugador}</b></span>
        <span class="det-tag">${p.condicion} · ${p.minutos}m · ${(p.minutos/(p.partidos||1)).toFixed(1)} /p</span>
      </div>`).join('');
    }
  }
  else if (key === 'cambios') {
    titulo = '🔄 Cambios totales';
    explicacion = `Cambios inferidos por el parser. Un cambio se detecta cuando un jugador entra al menos 5 min después del inicio del partido y se matchea con otro que salió antes del final. Los nombres marcados "—" son cambios donde no se pudo identificar al saliente.`;
    const camProm = nPart ? (cambios.length / nPart).toFixed(1) : '0';
    const lista = cambios.slice(0, 16).map(c => {
      const m = (c.minuto || '').replace(/^\[[^\]]+\]\s*/, '');
      return `<div class="det-item">
        <span style="color:var(--rojo);min-width:50px">${m}</span>
        <span style="color:#ff6666">↓ ${(c.sale||'—').slice(0,18)}</span>
        <span style="color:#66ff99">↑ ${(c.entra||'—').slice(0,18)}</span>
      </div>`;
    }).join('');
    contenido =
      `<div class="det-item"><span>Total de cambios</span><span class="det-tag">${cambios.length}</span></div>` +
      `<div class="det-item"><span>Promedio por partido</span><span class="det-tag">${camProm}</span></div>` +
      `<div class="det-sub">Lista (primeros ${Math.min(16, cambios.length)})</div>` +
      (lista || '<div class="det-item" style="color:var(--gris5)"><em>Sin cambios.</em></div>');
  }
  else if (key === 'promedio') {
    titulo = '📊 Distribución de minutos por jugador';
    explicacion = `Promedio total = minutos acumulados ÷ jugadores utilizados. El "tope" del card es el jugador con más minutos en el acumulado.`;
    const sorted = [...minutos].sort((a,b) => (b.minutos||0)-(a.minutos||0));
    const top = sorted.slice(0, 5);
    const bottom = [...sorted].reverse().slice(0, 5);
    contenido = `<div class="det-sub">Más utilizados</div>` +
      top.map((p, i) => `<div class="det-item"><span class="det-num">${i+1}.</span><span>${p.jugador}</span><span class="det-tag">${p.minutos}m</span></div>`).join('') +
      `<div class="det-sub">Menos utilizados (de los que jugaron)</div>` +
      bottom.map((p, i) => `<div class="det-item"><span class="det-num">${i+1}.</span><span>${p.jugador}</span><span class="det-tag">${p.minutos}m</span></div>`).join('');
  }

  return `<div class="plantel-detalle-card">
    <div class="plantel-detalle-head">
      <div class="plantel-detalle-titulo">${titulo}</div>
      <button class="plantel-detalle-x" onclick="togglePlantelDetalle('${key}')" title="Cerrar">×</button>
    </div>
    <div class="plantel-detalle-expl">${explicacion}</div>
    <div class="plantel-detalle-body">${contenido}</div>
  </div>`;
}

function togglePlantelDetalle(k) {
  plantelDetalleAbierto = plantelDetalleAbierto === k ? null : k;
  const cont = document.getElementById('plantel-detalle');
  if (cont) cont.innerHTML = renderPlantelDetalle(plantelDetalleAbierto);
  document.querySelectorAll('#panel-plantel .kpi-card.clickable').forEach(c => {
    c.classList.toggle('active', c.dataset.key === plantelDetalleAbierto);
  });
}

function _rivalDePartido(timeline) {
  if (!timeline) return 'rival';
  const m = timeline.match(/vs\.?\s+(.+?)$/i);
  return m ? m[1].trim() : timeline.trim();
}

function _formatMin(s) {
  const m = Math.floor(s/60);
  const sec = Math.round(s % 60);
  return `${m}'${String(sec).padStart(2,'0')}"`;
}

function _tituloAccion(a) {
  const acc = _describirAccion(a.tags);
  const rival = _rivalDePartido(a.partido);
  const min = _formatMin(a.t);
  return `${acc} · vs ${rival} · ${min}`;
}

function dibujarCancha(acciones, modo = 'calor') {
  // 1) Filtrar por categoría de acción (si el usuario destildó alguna)
  //    y por zona territorial (solo aplica en colectivo)
  acciones = _filtrarPorZonaTerritorial(_filtrarPorCat(acciones));
  // 2) Flip de y para mostrar laterales en su lado correcto
  acciones = acciones.map(a => ({
    ...a,
    y:  80 - a.y,
    ye: a.ye != null ? 80 - a.ye : null,
  }));
  const cellW = 10, cellH = 10;
  let svg = `<svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMid meet" class="pitch-svg">`;
  // Fondo
  svg += `<rect width="120" height="80" fill="#141414"/>`;

  if (modo === 'calor' || modo === 'flechas') {
    // Heatmap binning
    const bins = {};
    acciones.forEach(a => {
      if (a.x == null || a.y == null) return;
      const cx = Math.min(11, Math.max(0, Math.floor(a.x / cellW)));
      const cy = Math.min(7,  Math.max(0, Math.floor(a.y / cellH)));
      bins[`${cx},${cy}`] = (bins[`${cx},${cy}`] || 0) + 1;
    });
    const maxV = Math.max(1, ...Object.values(bins));
    Object.entries(bins).forEach(([k, count]) => {
      const [cx, cy] = k.split(',').map(Number);
      const ratio = count / maxV;
      const op = 0.12 + ratio * 0.65;
      svg += `<rect x="${cx*cellW}" y="${cy*cellH}" width="${cellW}" height="${cellH}" fill="#CC0000" opacity="${op}"/>`;
    });
  }

  // Líneas de cancha
  svg += _pitchLines();

  const escAttr = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  if (modo === 'puntos') {
    acciones.forEach(a => {
      const out = _outcomeAccion(a.tags);
      const esGol = /(^|,)\s*Gol\s*(,|$)/.test(a.tags || '');
      if (esGol) {
        const r = 1.7;
        svg += `<g data-pitch-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
               `<image href="/static/pelota.png" x="${a.x - r}" y="${a.y - r}" width="${r*2}" height="${r*2}" preserveAspectRatio="xMidYMid meet"/>` +
               `</g>`;
        return;
      }
      const color = out === 'neg' ? '#CC0000'
                  : a.area        ? '#f5a623'
                  :                 '#3ecf8e';
      svg += `<g data-pitch-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
             `<circle cx="${a.x}" cy="${a.y}" r="3" fill="transparent"/>` +
             `<circle cx="${a.x}" cy="${a.y}" r="1.1" fill="${color}" opacity="0.85"/>` +
             `</g>`;
    });
  } else if (modo === 'flechas') {
    acciones.forEach(a => {
      const tags = a.tags || '';
      // Pases/centros incompletos y pérdidas: solo punto rojo en el origen, SIN flecha.
      // Los 4 ejes (si existen) vienen de una acción adyacente (típicamente 1v1O+), no
      // representan el destino del pase fallido — taggear así sería engañoso.
      const esFallido = /(^|,)\s*(PIncompletos|CIncompletos|PERDIDAS:)/i.test(tags);
      if (esFallido) {
        svg += `<g data-pitch-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
               `<circle cx="${a.x}" cy="${a.y}" r="3" fill="transparent"/>` +
               `<circle cx="${a.x}" cy="${a.y}" r="1.1" fill="#CC0000" opacity="0.85"/>` +
               `</g>`;
        return;
      }
      // Acciones con destino real (PCompletos, CCompletos, 1v1O+): flecha origen → destino,
      // sólo si son progresivas (avanzaron ≥10m).
      if (!(a.prog && a.xe != null && a.ye != null)) return;
      const destEnArea = a.xe >= 102 && a.ye >= 18 && a.ye <= 62;
      const color = destEnArea ? '#f5a623' : '#3ecf8e';
      svg += `<g data-pitch-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
             `<line x1="${a.x}" y1="${a.y}" x2="${a.xe}" y2="${a.ye}" stroke="${color}" stroke-width="0.6" opacity="0.5"/>` +
             `<line x1="${a.x}" y1="${a.y}" x2="${a.xe}" y2="${a.ye}" stroke="${color}" stroke-width="0.4" opacity="0.9"/>` +
             `<circle cx="${a.xe}" cy="${a.ye}" r="0.9" fill="${color}" opacity="0.98"/>` +
             `<circle cx="${a.x}" cy="${a.y}" r="2.5" fill="transparent"/>` +
             `</g>`;
    });
  }

  // Overlay: centro de gravedad + elipse de dispersión
  if (mostrarCG && acciones.length >= 5) {
    const n = acciones.length;
    const cgX = acciones.reduce((s,a) => s + a.x, 0) / n;
    const cgY = acciones.reduce((s,a) => s + a.y, 0) / n;
    const varX = acciones.reduce((s,a) => s + (a.x - cgX) ** 2, 0) / n;
    const varY = acciones.reduce((s,a) => s + (a.y - cgY) ** 2, 0) / n;
    const dx = Math.max(2, Math.sqrt(varX));
    const dy = Math.max(2, Math.sqrt(varY));
    // Elipse de dispersión (1σ)
    svg += `<ellipse cx="${cgX}" cy="${cgY}" rx="${dx}" ry="${dy}" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.45" stroke-dasharray="2,1.5" opacity="0.85"/>`;
    // Marker del CG
    svg += `<circle cx="${cgX}" cy="${cgY}" r="2.6" fill="#ffffff" opacity="0.35"/>`;
    svg += `<circle cx="${cgX}" cy="${cgY}" r="1.5" fill="#CC0000" stroke="#ffffff" stroke-width="0.5"/>`;
    // Label
    svg += `<text x="${cgX + 3}" y="${cgY - 2.5}" fill="#fff" font-size="2.6" font-weight="bold">CG</text>`;
  }

  svg += '</svg>';
  return svg;
}

function _pitchScopes() {
  // Devuelve sólo los pitch-section dentro del/los panel(es) visibles
  // (individual y colectivo renderizan ambos un pitch — necesitamos actualizar el visible).
  return Array.from(document.querySelectorAll('.tab-panel.active .pitch-section'));

// ─── Mapa territorial (posiciones medias del equipo, interactivo) ──────────
let mapaTerMinMinutos = 20;    // descarta jugadores con < N min para que no ensucie
let mapaTerZonasActivas = new Set(['def','med','atk']); // filtro por zona; vacío = oculta todo, completo = no filtra
let mapaTerJugsPorZona = null; // { def: Set, med: Set, atk: Set } — se recalcula en renderMapaTerritorial

function _calcularLineasEquipo(jugadores, datos) {
  // Clasificación por línea según el centro de gravedad en X.
  // Usa umbrales relativos al rango del equipo (tercios), no cuartiles fijos —
  // así si hay 4 defs + 3 meds + 3 atks, los detecta bien (en cuartiles fijos
  // siempre 3 defs + 2 atks, lo demás "medio").
  const elig = jugadores
    .filter(j => datos[j] && (datos[j].minutos||0) >= mapaTerMinMinutos && (datos[j].acciones_xy||0) > 0)
    .map(j => ({ j, x: datos[j].centro_grav_x || 0, y: datos[j].centro_grav_y || 0 }));
  if (elig.length < 6) {
    return new Map(elig.map(e => [e.j, 'medio']));
  }
  const xs = elig.map(e => e.x);
  const xMin = Math.min(...xs);
  const xMax = Math.max(...xs);
  const rango = Math.max(30, xMax - xMin); // mín 30 unidades para evitar bloque comprimido
  const umbralDef = xMin + rango * 0.33;
  const umbralAtk = xMax - rango * 0.33;
  const linea = new Map();
  elig.forEach(e => {
    if (e.x < umbralDef)      linea.set(e.j, 'def');
    else if (e.x > umbralAtk) linea.set(e.j, 'atk');
    else                       linea.set(e.j, 'med');
  });
  return linea;
}

function _apellidoCorto(nombre) {
  const partes = (nombre||'').split(/\s+/).filter(Boolean);
  if (!partes.length) return '?';
  // Si el último token parece una inicial ("B", "B.", "M.A."), usar el penúltimo (probable apellido)
  const ult = partes[partes.length - 1];
  if (/^[A-ZÁÉÍÓÚÑ]\.?(?:[A-ZÁÉÍÓÚÑ]\.?){0,2}$/.test(ult) && partes.length > 1) {
    return partes[partes.length - 2].slice(0, 12);
  }
  return ult.slice(0, 12);
}

function dibujarMapaTerritorial(visibles, datos) {
  const COL = { def: '#3ecf8e', med: '#ffffff', atk: '#CC0000' };
  const lineas = _calcularLineasEquipo(visibles, datos);
  let svg = `<svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMid meet" class="pitch-svg" style="width:100%;height:auto;background:#141414">`;
  svg += `<rect width="120" height="80" fill="#141414"/>`;

  // Bandas verticales: promedio x por línea — solo para zonas activas
  const grupos = { def: [], med: [], atk: [] };
  visibles.forEach(j => {
    const d = datos[j]; if (!d) return;
    const grp = lineas.get(j); if (!grp) return;
    grupos[grp].push(d.centro_grav_x || 0);
  });
  Object.entries(grupos).forEach(([k, xs]) => {
    if (!xs.length || !mapaTerZonasActivas.has(k)) return;
    const avg = xs.reduce((s,x) => s+x, 0) / xs.length;
    svg += `<line x1="${avg}" y1="2" x2="${avg}" y2="78" stroke="${COL[k]}" stroke-width="0.35" stroke-dasharray="2,1.5" opacity="0.55"/>`;
  });

  svg += _pitchLines();

  const escAttr = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

  // Construir set de jugadores efectivamente visibles (después de min minutos + zona)
  const items = [];
  visibles.forEach(j => {
    const d = datos[j]; if (!d) return;
    if ((d.acciones_xy||0) === 0) return;
    if ((d.minutos||0) < mapaTerMinMinutos) return;
    const grp = lineas.get(j) || 'med';
    if (!mapaTerZonasActivas.has(grp)) return;
    const cx = d.centro_grav_x || 0;
    const cy = 80 - (d.centro_grav_y || 0);
    items.push({
      j, cx, cy, color: COL[grp],
      label: _apellidoCorto(j),
      tip: `${j} · CG (${cx.toFixed(0)}, ${(d.centro_grav_y||0).toFixed(0)}) · ${d.minutos||0}m · ${d.acciones_xy||0} acc.`,
    });
  });

  // Anti-colisión de etiquetas: posiciones cardinales con fallbacks verticales. Sin leader lines.
  // Labels pegadas al círculo; sólo se alejan si chocan con otro círculo o label.
  const CHARW = 1.45, FH = 3.3, PAD = 0.35;
  const CIRC_BUFFER = 2.55;  // apenas mayor que el radio del círculo (2.4)
  const placed = [];
  items.forEach(it => { placed.push({ x: it.cx - CIRC_BUFFER, y: it.cy - CIRC_BUFFER, w: CIRC_BUFFER*2, h: CIRC_BUFFER*2 }); });
  function overlapArea(r, p) {
    const ox = Math.max(0, Math.min(r.x + r.w, p.x + p.w) - Math.max(r.x, p.x));
    const oy = Math.max(0, Math.min(r.y + r.h, p.y + p.h) - Math.max(r.y, p.y));
    return ox * oy;
  }
  // Procesar los más conflictivos primero (más vecinos cercanos)
  items.sort((a, b) => {
    const vec = o => items.filter(x => x !== o && Math.hypot(x.cx - o.cx, x.cy - o.cy) < 9).length;
    return vec(b) - vec(a);
  });
  items.forEach(it => {
    const w = it.label.length * CHARW;
    // Cardinales pegadas al círculo, luego variants un toque más lejos si hay colisión
    // [ox_text, oy_baseline] respecto a (cx, cy) — texto con anchor="start"
    const cands = [
      [ 2.8,  0.9],            // R
      [-w/2,  4.4],            // B
      [-(w + 2.8),  0.9],      // L
      [-w/2, -2.4],            // T
      [-w/2,  7.2],            // B+ (sólo si las cardinales colisionan)
      [-w/2, -5.2],            // T+
    ];
    const evaluadas = [];
    for (const [ox, oy] of cands) {
      const r = { x: it.cx + ox - PAD, y: it.cy + oy - FH + 0.5, w: w + 2*PAD, h: FH };
      if (r.x < 0.2 || r.x + r.w > 119.8) continue;
      if (r.y < 0.2 || r.y + r.h > 79.8) continue;
      const ov = placed.reduce((s, p) => s + overlapArea(r, p), 0);
      evaluadas.push({ r, ov });
      if (ov === 0) break; // libre → no seguimos
    }
    let pick;
    if (evaluadas.length) {
      const min = Math.min(...evaluadas.map(e => e.ov));
      pick = evaluadas.find(e => e.ov === min);
    } else {
      pick = { r: { x: it.cx + 2.8 - PAD, y: it.cy + 0.9 - FH + 0.5, w: w + 2*PAD, h: FH } };
    }
    it.tx = pick.r.x + PAD;
    it.ty = pick.r.y + FH - 0.5;
    it.lw = w;
    placed.push(pick.r);
  });

  // Dibujar todos los marcadores primero (van debajo de labels)
  items.forEach(it => {
    svg += `<g data-pitch-tip="${escAttr(it.tip)}">`;
    svg += `<circle cx="${it.cx}" cy="${it.cy}" r="2.4" fill="#0a0a0a"/>`;
    svg += `<circle cx="${it.cx}" cy="${it.cy}" r="1.9" fill="${it.color}" stroke="#0a0a0a" stroke-width="0.3"/>`;
    svg += `</g>`;
  });
  // Labels con fondo semitransparente — sin leader lines (no se "estiran")
  items.forEach(it => {
    svg += `<rect x="${it.tx - 0.5}" y="${it.ty - 2.5}" width="${it.lw + 1}" height="3.2" fill="#0a0a0a" fill-opacity="0.7" rx="0.5"/>`;
    svg += `<text x="${it.tx}" y="${it.ty}" fill="#fff" font-size="2.4" font-weight="bold">${escAttr(it.label)}</text>`;
  });

  svg += '</svg>';
  return svg;
}

        <span><span style="display:inline-block;width:9px;height:9px;background:#CC0000;border-radius:50%;margin-right:5px;vertical-align:middle"></span>Ataque (${cuenta.atk})</span>
      </span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:.6rem">

      ${[['def','🛡 Defensa'],['med','⚙ Mediocampo'],['atk','⚔ Ataque']].map(([k,lbl]) => `
        <label class="part-chip" style="padding:3px 9px">

    </div>
  `;
}

function toggleMapaTerZona(z, on) {
  if (on) mapaTerZonasActivas.add(z); else mapaTerZonasActivas.delete(z);
  renderMapaTerritorial();
  _redibujarCancha(); // el filtro de zona también afecta al Mapa en cancha
}

function onAccionFiltroToggle() {
  // Leer el estado del panel activo (donde el usuario tildó) y propagar al otro panel
  const scope = _pitchScopes()[0];

  accionFiltros = new Set();
  scope.querySelectorAll('[id="pitch-acciones-filter"] input[type=checkbox][data-cat]').forEach(b => {
    if (b.checked) accionFiltros.add(b.dataset.cat);

  document.querySelectorAll('[id="pitch-acciones-filter"] input[type=checkbox][data-cat]').forEach(b => {
    b.checked = accionFiltros.has(b.dataset.cat);

}

  accionFiltros = new Set(allOn ? CATS_ACCION.map(c => c[0]) : []);

async function fetchCoordsJugador(jugador) {
  const idxs = Array.from(partidosSel).sort((a,b)=>a-b);
  if (!idxs.length) return [];
  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fd.append('jugador', jugador);
  fdTiempo(fd);
  try {
    const r = await fetch('/api/coords-jugador', { method: 'POST', body: fd });
    return r.ok ? await r.json() : [];
  } catch { return []; }
}

  try {
    const r = await fetch('/api/coords-multi', { method: 'POST', body: fd });
    return r.ok ? await r.json() : [];
