function detectarEstilo(ind, todos, esEquipo = false) {
  if (!todos) return null;
  const candidatos = Object.values(todos).filter(j => (j.intervenciones||0) >= 8);
  if (candidatos.length < 4) return null;
  const nom = e => esEquipo ? e.nombreEq : e.nombre;

  const scores = ESTILOS.map(estilo => {
    let suma = 0, n = 0;
    estilo.metricas.forEach(m => {
      const valores = candidatos.map(j => j[m] || 0);
      if (Math.max(...valores) === 0) return;
      const pct = _percentil(ind[m] || 0, valores);
      suma += pct; n++;
    });
    return { ...estilo, pct: n ? Math.round(suma / n) : 0, n };
  }).filter(s => s.n > 0).sort((a, b) => b.pct - a.pct);

  const mixto = esEquipo ? 'Bloque mixto' : 'Perfil mixto';
  if (!scores.length || scores[0].pct < 55) {
    return { nombre: mixto, icon: '🔀', detalle: 'Sin dominancia clara en ningún rol', pct: scores[0]?.pct || 0 };
  }
  const top = scores[0], seg = scores[1];
  let nombre = nom(top), icon = top.icon;
  if (seg && seg.pct >= 60 && top.pct - seg.pct < 8) {
    nombre = `${nom(top)} + ${nom(seg)}`;
    icon = `${top.icon}${seg.icon}`;
  }
  const sufijo = esEquipo ? '(promedio del grupo)' : '';
  const detalle = `Promedio percentil ${top.pct} en ${top.metricas.slice(0,3).join(' · ')} ${sufijo}`.trim();
  return { nombre, icon, detalle, pct: top.pct, ranking: scores };
}

function _rankPos(valor, valores) {
  const ord = [...valores].sort((a,b) => b - a);
  return ord.findIndex(v => v === valor) + 1;
}

function analisisJugador(ind, todos) {
  if (!ind || !todos) return '';
  const candidatos = Object.values(todos).filter(j => (j.intervenciones||0) >= 8);
  if (candidatos.length < 4) return '';
  const N = candidatos.length;
  const lineas = [];

  // 1. Apertura — estilo + volumen
  const est = detectarEstilo(ind, todos, false);
  const cnt = `${ind.intervenciones} intervenciones en ${ind.minutos} min`;
  if (est && est.nombre && !est.nombre.includes('mixto')) {
    lineas.push(`${ind.jugador} desplegó un perfil claro de <b>${est.nombre.toLowerCase()}</b>, sumando ${cnt}.`);
  } else {
    lineas.push(`${ind.jugador} acumuló ${cnt} sin un rol estadísticamente dominante.`);
  }

  // 2. Posición + movilidad
  if (ind.acciones_xy >= 10) {
    const x = ind.centro_grav_x, dx = ind.dispersion_x, dy = ind.dispersion_y;
    let s = 'Operó ';
    if (x >= 78) s += `<b>muy cerca del arco rival</b> (CG x=${x})`;
    else if (x >= 60) s += `<b>en zona alta-media</b> (CG x=${x})`;
    else if (x >= 42) s += `<b>en zona media</b>, balanceando construcción y avance`;
    else s += `<b>en zona baja</b> (CG x=${x}), priorizando salida y cobertura`;
    if (dx >= 25 || dy >= 22) s += ', con <i>alta movilidad</i> por la cancha.';
    else if (dx <= 14 && dy <= 12) s += ', con un <i>posicionamiento muy estático</i>.';
    else s += '.';
    lineas.push(s);
  }

  // 3. Fortalezas — top 2 métricas por percentil
  const fortalezas = [];
  METRICAS_PIZZA.forEach(m => {
    const vals = candidatos.map(j => j[m.k]||0);
    if (Math.max(...vals) === 0) return;
    const pct = _percentil(ind[m.k]||0, vals);
    if (pct >= 75 && (ind[m.k]||0) > 0) {
      fortalezas.push({ ...m, valor: ind[m.k], pct, rank: _rankPos(ind[m.k], vals) });
    }
  });
  fortalezas.sort((a,b) => b.pct - a.pct);
  if (fortalezas.length >= 1) {
    const t = fortalezas[0];
    let s = `Destacó por <b>${t.valor}${t.unidad||''} en ${t.l.toLowerCase()}</b> (${t.rank}º del plantel)`;
    if (fortalezas.length >= 2) {
      const t2 = fortalezas[1];
      s += ` y <b>${t2.valor}${t2.unidad||''} en ${t2.l.toLowerCase()}</b> (${t2.rank}º)`;
    }
    s += '.';
    lineas.push(s);
  }

  // 4. Aporte directo
  const partes = [];
  if (ind.goles)       partes.push(`<b>${ind.goles} gol${ind.goles>1?'es':''}</b>`);
  if (ind.asistencias) partes.push(`<b>${ind.asistencias} asistencia${ind.asistencias>1?'s':''}</b>`);
  if (!ind.asistencias && ind.pases_clave >= 2) partes.push(`<b>${ind.pases_clave} pases clave</b>`);
  const recup = (ind.recup_posic||0) + (ind.recup_interv||0) + (ind.recup_tras||0);
  if (recup >= 6) partes.push(`<b>${recup} recuperaciones</b>`);
  if (partes.length) {
    lineas.push(`Aporte directo en el partido: ${partes.join(' + ')}.`);
  }

  // 5. Debilidad o sello distintivo
  const debilidades = [];
  METRICAS_PIZZA.forEach(m => {
    const vals = candidatos.map(j => j[m.k]||0);
    if (Math.max(...vals) === 0) return;
    const pct = _percentil(ind[m.k]||0, vals);
    if (pct <= 25) debilidades.push({ ...m, valor: ind[m.k]||0, pct });
  });
  if (debilidades.length && ind.pct_progresivo < 30 && ind.pases_efect < 70) {
    const d = debilidades[0];
    lineas.push(`Como aspecto a mejorar, sus números en <b>${d.l.toLowerCase()}</b> (${d.valor}${d.unidad||''}) quedaron por debajo del promedio del plantel.`);
  } else if (ind.pct_area >= 5 && ind.toques_area >= 3) {
    lineas.push(`Frecuentó con peligrosidad el área rival (<b>${ind.toques_area} toques</b>, ${ind.pct_area}% de sus acciones).`);
  } else if (ind.pct_progresivo >= 35) {
    lineas.push(`Su juego es <b>marcadamente vertical</b>: ${ind.pct_progresivo}% de sus acciones con destino avanzaron hacia el arco rival.`);
  } else if (ind.pases_efect >= 85 && ind.pases_total >= 30) {
    lineas.push(`Mostró una efectividad de pase del <b>${ind.pases_efect}%</b> sobre un volumen importante (${ind.pases_total} pases).`);
  }

  return lineas.join(' ');
}

function pizzaPlayer(ind, todos) {
  if (!todos) return '';
  const candidatos = Object.values(todos).filter(j => (j.intervenciones||0) >= 8);
  if (candidatos.length < 4) return '';

  const W = 580, H = 520, cx = W/2, cy = H/2, rMin = 36, rMax = 190;
  const slices = METRICAS_PIZZA.map((m, i) => {
    const v = ind[m.k] || 0;
    const valores = candidatos.map(j => j[m.k] || 0);
    const pct = _percentil(v, valores);
    const r = rMin + (pct/100) * (rMax - rMin);
    return { ...m, v, pct, r, ang: -Math.PI/2 + i * (2*Math.PI/METRICAS_PIZZA.length) };
  });
  const angSlice = 2*Math.PI / METRICAS_PIZZA.length;

  const arc = (r, a0, a1) => {
    const x0 = cx + Math.cos(a0)*r, y0 = cy + Math.sin(a0)*r;
    const x1 = cx + Math.cos(a1)*r, y1 = cy + Math.sin(a1)*r;
    return `M ${cx},${cy} L ${x0},${y0} A ${r},${r} 0 0 1 ${x1},${y1} Z`;
  };
  const colorPct = p => p >= 70 ? '#3ecf8e' : p >= 40 ? '#f5a623' : '#CC0000';

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:500px;display:block;margin:0 auto">`;
  // Anillos guía
  [0.25, 0.5, 0.75, 1].forEach(s => {
    const r = rMin + s * (rMax - rMin);
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2a2a"/>`;
  });
  // Slices
  slices.forEach(s => {
    const a0 = s.ang - angSlice/2;
    const a1 = s.ang + angSlice/2;
    svg += `<path d="${arc(s.r, a0, a1)}" fill="${colorPct(s.pct)}" fill-opacity="0.82" stroke="#0a0a0a" stroke-width="1.5"/>`;
  });
  // Ejes
  slices.forEach(s => {
    const x = cx + Math.cos(s.ang)*rMax;
    const y = cy + Math.sin(s.ang)*rMax;
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1a1a1a" stroke-width="1"/>`;
  });
  // Labels alrededor
  slices.forEach(s => {
    const r = rMax + 32;
    const x = cx + Math.cos(s.ang)*r;
    const y = cy + Math.sin(s.ang)*r;
    svg += `<text x="${x}" y="${y-4}" fill="#ccc" font-size="12" text-anchor="middle" font-weight="600">${s.l}</text>`;
    svg += `<text x="${x}" y="${y+10}" fill="${colorPct(s.pct)}" font-size="11" text-anchor="middle" font-weight="800">${s.v}${s.unidad||''} · p${s.pct}</text>`;
  });
  svg += '</svg>';
  return svg;
}

// ─── Percentiles por posición (polar bar moderno, estilo FIFA Career Mode) ──
function _posicionDeJugador(nombre, datos) {
  if (perfilPosicionForzada) return perfilPosicionForzada;
  if (!datos || !datos[nombre]) return 'med';
  const visibles = Object.keys(datos).filter(j =>
    (datos[j].minutos||0) >= 20 && (datos[j].acciones_xy||0) > 0);
  if (visibles.length < 6) return 'med';
  const lineas = _calcularLineasEquipo(visibles, datos);
  return lineas.get(nombre) || 'med';
}

function _comparablesDefault(nombre, datos, posicion) {
  // Por default: jugadores de la MISMA línea con intervenciones suficientes
  if (!datos) return new Set();
  const visibles = Object.keys(datos).filter(j =>
    (datos[j].minutos||0) >= 20 && (datos[j].acciones_xy||0) > 0);
  if (visibles.length < 6) {
    // Equipo chico: comparar con todos
    return new Set(Object.values(datos).filter(j => (j.intervenciones||0) >= 8).map(j => j.jugador));
  }
  const lineas = _calcularLineasEquipo(visibles, datos);
  return new Set(visibles.filter(j => (lineas.get(j) || 'med') === posicion));
}

function pizzaPosicional(ind, todos) {
  if (!todos || !ind || !ind.jugador) return '';
  // Detectar posición y armar set de comparables si no existe (o si cambió jugador)
  const posicion = _posicionDeJugador(ind.jugador, todos);
  if (!perfilCompararSet) {
    perfilCompararSet = _comparablesDefault(ind.jugador, todos, posicion);
  }
  const comparables = Array.from(perfilCompararSet)
    .filter(n => todos[n] && n !== ind.jugador)
    .map(n => todos[n]);
  if (comparables.length < 2) {
    return `<div style="padding:1rem;color:var(--gris5);text-align:center">
      Necesitás al menos 2 compañeros para comparar — agregalos en el desplegable de abajo.
    </div>`;
  }
  const metricas = METRICAS_POR_POSICION[posicion] || METRICAS_POR_POSICION.med;

  // viewBox más ancho para que las etiquetas radiales (especialmente las laterales) no se corten
  const W = 760, H = 680, cx = W/2, cy = H/2, rMin = 70, rMax = 210;
  const N = metricas.length;
  const angSlice = 2*Math.PI / N;
  const GAP = 0.015;

  // Calcular percentiles + valores
  const slices = metricas.map((m, i) => {
    const v = ind[m.k] || 0;
    const arr = comparables.map(j => ({ jugador: j.jugador, v: j[m.k] || 0 }));
    const max = Math.max(1, v, ...arr.map(a => a.v));
    const pct = _percentil(v, [...arr.map(a => a.v), v]);
    const ang = -Math.PI/2 + i * angSlice;
    const r = rMin + (pct/100) * (rMax - rMin);
    return { ...m, v, pct, r, ang, max, comp: arr };
  });

  // Paleta River — rojo
  const fill = '#5a0a10';   // rojo oscuro relleno
  const stroke = '#ff5a5a'; // rojo brillante borde + punto + texto
  const labelBg = '#1a0a0c';

  const arc = (r, a0, a1) => {
    const x0 = cx + Math.cos(a0)*r, y0 = cy + Math.sin(a0)*r;
    const x1 = cx + Math.cos(a1)*r, y1 = cy + Math.sin(a1)*r;
    return `M ${cx},${cy} L ${x0},${y0} A ${r},${r} 0 0 1 ${x1},${y1} Z`;
  };
  const escAttr = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:680px;display:block;margin:0 auto;overflow:visible">`;
  // Anillos guía
  [0.25, 0.5, 0.75, 1].forEach(s => {
    const r = rMin + s * (rMax - rMin);
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a1518" stroke-width="0.8"/>`;
  });
  // Líneas radiales tenues (separadores entre cuñas)
  slices.forEach(s => {
    const a = s.ang - angSlice/2;
    const x = cx + Math.cos(a)*(rMax + 4);
    const y = cy + Math.sin(a)*(rMax + 4);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#0a0a0a" stroke-width="1"/>`;
  });
  // Cuñas (relleno) PRIMERO para que los puntos grises queden por encima
  slices.forEach(s => {
    const a0 = s.ang - angSlice/2 + GAP;
    const a1 = s.ang + angSlice/2 - GAP;
    svg += `<path d="${arc(s.r, a0, a1)}" fill="${fill}" fill-opacity="0.78" stroke="${stroke}" stroke-width="0.6" stroke-opacity="0.5"/>`;
  });
  // Puntos grises de los comparables, TODOS sobre el eje radial central de cada cuña
  // Tooltip instantáneo con el sistema pitch-tip (no usar <title> SVG nativo: tiene delay)
  slices.forEach(s => {
    s.comp.forEach(c => {
      const pc = s.max ? c.v / s.max : 0;
      const r = rMin + pc * (rMax - rMin);
      const x = cx + Math.cos(s.ang)*r;
      const y = cy + Math.sin(s.ang)*r;
      const tip = `${c.jugador} — ${s.l}: ${c.v}${s.unidad||''}`;
      svg += `<g data-pitch-tip="${escAttr(tip)}" style="cursor:pointer">` +
             `<circle cx="${x}" cy="${y}" r="9" fill="transparent"/>` +     // hit area más grande
             `<circle cx="${x}" cy="${y}" r="5" fill="#e0e0e0" stroke="#0a0a0a" stroke-width="0.6" stroke-opacity="0.4" opacity="0.5"/>` +
             `</g>`;
    });
  });
  // Punto brillante al extremo de cada cuña (valor del jugador activo)
  slices.forEach(s => {
    const x = cx + Math.cos(s.ang)*s.r;
    const y = cy + Math.sin(s.ang)*s.r;
    const tip = `${ind.jugador} — ${s.l}: ${s.v}${s.unidad||''} (percentil ${s.pct})`;
    svg += `<g data-pitch-tip="${escAttr(tip)}" style="cursor:pointer">` +
           `<circle cx="${x}" cy="${y}" r="10" fill="transparent"/>` +
           `<circle cx="${x}" cy="${y}" r="7" fill="${stroke}" stroke="#0a0a0a" stroke-width="0.8"/>` +
           `</g>`;
  });
  // Valor numérico (percentil) al lado del punto extremo
  slices.forEach(s => {
    const r = s.r + 18;
    const x = cx + Math.cos(s.ang)*r;
    const y = cy + Math.sin(s.ang)*r;
    svg += `<text x="${x}" y="${y+4}" fill="${stroke}" font-size="14" text-anchor="middle" font-weight="800" stroke="#0a0a0a" stroke-width="0.6" paint-order="stroke">${s.pct}</text>`;
  });
  // Labels de métrica alrededor (en cajas oscuras estilo FIFA), con anchor adaptado por cuadrante
  slices.forEach(s => {
    const r = rMax + 50;
    const x = cx + Math.cos(s.ang)*r;
    const y = cy + Math.sin(s.ang)*r;
    const lbl = s.l;
    const w = Math.max(76, lbl.length * 7.2 + 18);
    // Anclar derecha si está a la izquierda del centro, izquierda si está a la derecha, centrado arriba/abajo
    let rectX;
    const dx = Math.cos(s.ang);
    if (Math.abs(dx) < 0.3) rectX = x - w/2;       // centrado (top/bottom)
    else if (dx > 0)        rectX = x - 8;          // izquierda alineada (cuña en derecha)
    else                    rectX = x - w + 8;      // derecha alineada (cuña en izquierda)
    svg += `<rect x="${rectX}" y="${y - 12}" width="${w}" height="24" rx="12" fill="${labelBg}" stroke="${stroke}" stroke-width="0.9"/>`;
    let textX, anchor;
    if (Math.abs(dx) < 0.3) { textX = x; anchor = 'middle'; }
    else if (dx > 0)        { textX = rectX + 9; anchor = 'start'; }
    else                    { textX = rectX + w - 9; anchor = 'end'; }
    svg += `<text x="${textX}" y="${y+4}" fill="${stroke}" font-size="11.5" text-anchor="${anchor}" font-weight="700" letter-spacing="0.3">${escAttr(lbl)}</text>`;
  });
  // Halo central
  svg += `<circle cx="${cx}" cy="${cy}" r="${rMin - 8}" fill="${labelBg}" stroke="${stroke}" stroke-width="1.5"/>`;
  svg += `<text x="${cx}" y="${cy - 6}" fill="${stroke}" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="1">${POSICION_ICON[posicion]} ${POSICION_LABEL[posicion].toUpperCase()}</text>`;
  svg += `<text x="${cx}" y="${cy + 12}" fill="#fff" font-size="14" text-anchor="middle" font-weight="800">${escAttr(_apellidoCorto(ind.jugador))}</text>`;
  svg += `<text x="${cx}" y="${cy + 28}" fill="#888" font-size="9" text-anchor="middle">vs ${comparables.length} comp.</text>`;
  svg += '</svg>';
  return svg;
}

function renderSelectorComparables(ind, todos) {
  if (!todos || !ind || !ind.jugador) return '';
  const posicion = _posicionDeJugador(ind.jugador, todos);
  if (!perfilCompararSet) perfilCompararSet = _comparablesDefault(ind.jugador, todos, posicion);

  const jugs = Object.keys(todos).filter(n => n !== ind.jugador && (todos[n].intervenciones||0) >= 8).sort();
  const elegidos = perfilCompararSet.size;
  return `
    <details style="margin-top:.6rem">
      <summary style="cursor:pointer;font-size:11px;color:var(--gris5);user-select:none">
        ⚙ Comparando vs <b style="color:var(--blanco)">${elegidos}</b> compañero${elegidos!==1?'s':''} ·
        línea detectada: <b style="color:var(--rojo)">${POSICION_ICON[posicion]} ${POSICION_LABEL[posicion]}</b> ·
        click para editar
      </summary>
      <div style="background:var(--gris2);border:1px solid var(--gris3);border-radius:6px;padding:8px;margin-top:6px">
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
          <span style="font-size:9.5px;color:var(--gris5);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-right:4px">Posición:</span>
          ${['def','med','atk'].map(p => `
            <button class="chip-toggle ${posicion===p?'active':''}" style="padding:3px 9px;font-size:10.5px"
              onclick="setPerfilPosicion('${p}', '${ind.jugador.replace(/'/g,"\\'")}')">
              ${POSICION_ICON[p]} ${POSICION_LABEL[p]}
            </button>`).join('')}
          <span style="margin-left:auto;display:flex;gap:5px">
            <button class="btn" style="padding:3px 9px;font-size:10.5px" onclick="presetComparables('linea', '${ind.jugador.replace(/'/g,"\\'")}')">⭐ Solo su línea</button>
            <button class="btn" style="padding:3px 9px;font-size:10.5px" onclick="presetComparables('todos', '${ind.jugador.replace(/'/g,"\\'")}')">👥 Todos</button>
            <button class="btn" style="padding:3px 9px;font-size:10.5px" onclick="presetComparables('ninguno', '${ind.jugador.replace(/'/g,"\\'")}')">✕</button>
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <input type="search" placeholder="🔍 Buscar compañero..." oninput="filtrarChipsJug(this.value, 'perfil-comparables-list')"
                 style="flex:1;max-width:280px;background:var(--gris3);border:1px solid var(--gris4);color:var(--blanco);padding:4px 9px;border-radius:5px;font-size:11.5px">
        </div>
        <div id="perfil-comparables-list" style="display:flex;flex-wrap:wrap;gap:5px;max-height:160px;overflow-y:auto">
          ${jugs.map(j => `
            <label class="part-chip" data-nombre="${j.toLowerCase()}" style="padding:3px 9px;font-size:10.5px">
              <input type="checkbox" ${perfilCompararSet.has(j)?'checked':''} onchange="togglePerfilCompare('${j.replace(/'/g,"\\'")}', this.checked)">
              <span>${j}</span>
            </label>`).join('')}
        </div>
      </div>
    </details>`;
}

function togglePerfilCompare(jug, on) {
  if (!perfilCompararSet) perfilCompararSet = new Set();
  if (on) perfilCompararSet.add(jug); else perfilCompararSet.delete(jug);
  if (jugadorActivo) renderIndividual(jugadorActivo);
}

function setPerfilPosicion(pos, jug) {
  perfilPosicionForzada = pos;
  perfilCompararSet = _comparablesDefault(jug, datosJugadores, pos);
  if (jugadorActivo) renderIndividual(jugadorActivo);
}

function presetComparables(preset, jug) {
  if (!datosJugadores) return;
  if (preset === 'todos') {
    perfilCompararSet = new Set(Object.keys(datosJugadores).filter(n => n !== jug && (datosJugadores[n].intervenciones||0) >= 8));
  } else if (preset === 'ninguno') {
    perfilCompararSet = new Set();
  } else /* linea */ {
    const pos = _posicionDeJugador(jug, datosJugadores);
    perfilCompararSet = _comparablesDefault(jug, datosJugadores, pos);
  }
  if (jugadorActivo) renderIndividual(jugadorActivo);
}

function beeswarmCompacto(ind, todos, seleccionados = null) {
  if (!todos) return '';
  const candidatos = Object.values(todos).filter(j => (j.intervenciones||0) >= 8);
  if (candidatos.length < 3) return '';
  const setSel = seleccionados ? new Set(seleccionados) : null;

  const W = 200, H = 70;
  return `<div class="beeswarm-grid">${
    METRICAS_PIZZA.map(m => {
      // Los jugadores con valor 0 se excluyen del riel (se apilaban en el borde
      // izquierdo y parecían decoración — pedido A. Urricelqui "revisar puntos grises").
      // Se informa cuántos quedaron en 0 con un contador al pie.
      const todosVals = candidatos.map(j => ({ nombre: j.jugador, v: j[m.k] || 0 }));
      const valores = todosVals.filter(p => p.v > 0 || (setSel ? setSel.has(p.nombre) : p.nombre === ind.jugador));
      const enCero = todosVals.length - valores.length;
      const max = Math.max(1, ...valores.map(p => p.v));
      const sx = v => 16 + (v / max) * (W - 32);
      const yVal = 38;
      let svg = `<svg viewBox="0 0 ${W} ${H}" class="beeswarm-svg">`;
      svg += `<text x="${W/2}" y="14" fill="#ccc" font-size="10" text-anchor="middle" font-weight="600">${m.l}</text>`;
      svg += `<line x1="14" y1="${yVal}" x2="${W-14}" y2="${yVal}" stroke="#3a3a3a"/>`;
      valores.forEach((p, i) => {
        const cx = sx(p.v);
        const cy = yVal - 2 + ((i % 3) - 1) * 3;
        const esEl = setSel ? setSel.has(p.nombre) : (p.nombre === ind.jugador);
        svg += `<circle cx="${cx}" cy="${cy}" r="${esEl?4.5:2.5}" fill="${esEl?'#CC0000':'#555'}" opacity="${esEl?1:0.55}"><title>${p.nombre}: ${p.v}${m.unidad||''}</title></circle>`;
      });
      if (enCero > 0) {
        svg += `<text x="16" y="${yVal+16}" fill="#777" font-size="8" text-anchor="start">${enCero} jug. en 0</text>`;
      }
      // Marca de promedio del grupo (línea vertical roja punteada) en modo colectivo
      if (setSel) {
        const xAvg = sx(ind[m.k] || 0);
        svg += `<line x1="${xAvg}" y1="${yVal-12}" x2="${xAvg}" y2="${yVal+12}" stroke="#CC0000" stroke-width="1.5" stroke-dasharray="3,2"/>`;
      }
      svg += `<text x="${W/2}" y="${H-6}" fill="#f5f5f5" font-size="11" text-anchor="middle" font-weight="800">${(ind[m.k]||0)}${m.unidad||''}</text>`;
      svg += '</svg>';
      return svg;
    }).join('')
  }</div>`;
}

function renderFoda(titulo, foda) {
  if (!foda) return '';
  const todoVacio = !foda.fortalezas.length && !foda.debilidades.length && !foda.oportunidades.length && !foda.amenazas.length && !foda.perfil;
  if (todoVacio) return '';
  const box = (clase, icono, titulo, items) => {
    const contenido = items.length
      ? `<ul>${items.map(it => `<li><span>${it.label}</span><span class="v">${it.valor}</span></li>`).join('')}</ul>`
      : '<div class="foda-empty">Sin señales destacadas</div>';
    return `<div class="foda-box ${clase}"><div class="foda-box-title">${icono} ${titulo}</div>${contenido}</div>`;
  };
  return `<div class="lectura">
    <div class="lectura-title">📖 ${titulo}</div>
    ${foda.perfil ? `<div class="foda-summary">${foda.perfil}</div>` : ''}
    <div class="foda-grid">
      ${box('f', '💪', 'Fortalezas',     foda.fortalezas)}
      ${box('o', '📈', 'Oportunidades',  foda.oportunidades)}
      ${box('d', '⚠',  'Debilidades',    foda.debilidades)}
      ${box('a', '🔻', 'Amenazas',       foda.amenazas)}
    </div>
  </div>`;
}

function renderRematesPorSuperficie(ind) {
  const filas = [
    ['Cabeza',      'rem_cab_'],
    ['Pie hábil',   'rem_pieh_'],
    ['Pie inhábil', 'rem_piei_'],
  ];
  const totalCualq = filas.reduce((s, [_, p]) => s + (ind[p+'total']||0), 0) + (ind.rem_sd_total||0);
  if (totalCualq === 0) {
    return `<div style="font-size:10px;color:var(--gris5);padding:6px 0 2px">Sin tags de superficie en estos remates. Etiquetá <i>Cabeza</i> / <i>Pie Habil</i> / <i>Pie Inhabil</i> en Sportcode para ver el desglose.</div>`;
  }
  const colorEf = ef => ef >= 50 ? 'green' : ef >= 30 ? 'amber' : 'red';
  const GRID = 'grid-template-columns:1fr 28px 28px 28px 28px 32px 38px';
  let html = '<div class="ind-block-title sub">Por superficie</div>';
  html += `<div style="display:grid;${GRID};gap:4px 8px;font-size:10px;color:var(--gris5);padding:4px 0 2px;text-transform:uppercase;letter-spacing:.4px">
    <span></span>
    <span style="text-align:right">Arco</span>
    <span style="text-align:right">Gol</span>
    <span style="text-align:right">Afu</span>
    <span style="text-align:right">Bloq</span>
    <span style="text-align:right">Total</span>
    <span style="text-align:right">Efect.</span>
  </div>`;
  filas.forEach(([lbl, pre]) => {
    const tot = ind[pre+'total']||0;
    const ef  = ind[pre+'efect']||0;
    const arco = ind[pre+'arco']||0;
    const gol  = ind[pre+'gol']||0;
    const afu  = ind[pre+'afuera']||0;
    const blo  = ind[pre+'bloq']||0;
    html += `<div style="display:grid;${GRID};gap:4px 8px;align-items:center;padding:3px 0;border-top:1px dashed var(--gris3)">
      <span style="font-size:12px">${lbl}</span>
      <span class="ind-row-val red"   style="text-align:right">${arco}</span>
      <span class="ind-row-val amber" style="text-align:right">${gol}</span>
      <span class="ind-row-val"       style="text-align:right">${afu}</span>
      <span class="ind-row-val"       style="text-align:right">${blo}</span>
      <span class="ind-row-val"       style="text-align:right">${tot}</span>
      <span class="ind-row-val ${colorEf(ef)}" style="text-align:right">${ef}%</span>
    </div>`;
  });
  if ((ind.rem_sd_total||0) > 0) {
    html += `<div style="font-size:10px;color:var(--gris5);padding:6px 0 0">${ind.rem_sd_total} remate(s) sin tag de superficie.</div>`;
  }
  return html;
}

// Desglose de pérdidas por tipo, con el mismo formato que "Por superficie" de los
// remates (pedido A.U.: "cómo fueron las pérdidas: control, pase o gambeta").
function renderPerdidasPorTipo(ind) {
  const filas = [
    ['Por control',  'perd_control'],
    ['Por pase',     'perd_pase'],
    ['Por gambeta',  'perd_gambeta'],
  ];
  const total = filas.reduce((s, [_, k]) => s + (ind[k]||0), 0);
  if (total === 0) {
    return `<div style="font-size:10px;color:var(--gris5);padding:6px 0 2px">Sin tags de tipo de pérdida. Etiquetá <i>PERDIDAS: xControl</i> / <i>xPase</i> / <i>xGambeta</i> en Sportcode para ver el desglose.</div>`;
  }
  const GRID = 'grid-template-columns:1fr 34px 42px';
  let html = '<div class="ind-block-title sub">Pérdidas por tipo</div>';
  html += `<div style="display:grid;${GRID};gap:4px 8px;font-size:10px;color:var(--gris5);padding:4px 0 2px;text-transform:uppercase;letter-spacing:.4px">
    <span></span>
    <span style="text-align:right">Cant.</span>
    <span style="text-align:right">% del tot.</span>
  </div>`;
  filas.forEach(([lbl, k]) => {
    const n = ind[k]||0;
    const pct = Math.round(n / total * 100);
    // El tipo dominante se marca en rojo: es por donde más pierde la pelota.
    const col = pct >= 45 ? 'red' : pct >= 30 ? 'amber' : '';
    html += `<div style="display:grid;${GRID};gap:4px 8px;align-items:center;padding:3px 0;border-top:1px dashed var(--gris3)">
      <span style="font-size:12px">${lbl}</span>
      <span class="ind-row-val"      style="text-align:right">${n}</span>
      <span class="ind-row-val ${col}" style="text-align:right">${pct}%</span>
    </div>`;
  });
  const dif = (ind.perd_total||0) - total;
  if (dif > 0) {
    html += `<div style="font-size:10px;color:var(--gris5);padding:6px 0 0">${dif} pérdida(s) sin tag de tipo.</div>`;
  }
  return html;
}

// Bloque de remates. Con TODO el plantel seleccionado los números salen del
// informe COLECTIVO, no de sumar los individuales: hay goles y remates que no
// quedan taggeados a ningún jugador, así que la suma da menos que el marcador.
// Con una selección parcial sí corresponde la suma de esos jugadores.
function bloqueRemates(ind) {
  const col = (ind.__esColectivo && ind.__todos && datosActuales) ? datosActuales.colectivas : null;
  const lp = col ? col.llegadas_prop : null;

  let total, arco, goles, afuera, bloq, efect, fuente = '';
  if (lp) {
    arco   = lp.tiros_arco || 0;          // en el tagging un gol también es "Arco"
    afuera = lp.afuera || 0;
    bloq   = lp.bloqueado || 0;
    goles  = (col.goles_propios && col.goles_propios.total) || 0;   // marcador real
    total  = arco + afuera + bloq;
    efect  = total ? Math.round(arco / total * 100) : 0;
    // Si la suma individual no llega al colectivo, es tagging incompleto: hay
    // goles/remates sin jugador asignado. Se avisa en vez de esconderlo.
    const gInd = ind.remates_gol || 0, rInd = ind.remates_total || 0;
    const partes = [];
    if (goles > gInd) partes.push(`${goles - gInd} gol(es) sin jugador asignado`);
    if (total > rInd) partes.push(`${total - rInd} remate(s) sin asignar`);
    fuente = `<div style="font-size:9.5px;color:var(--gris5);padding:4px 0 0;line-height:1.4">
      Del informe colectivo${partes.length ? ' · ' + partes.join(' · ') : ''}
    </div>`;
  } else {
    total  = ind.remates_total || 0;
    arco   = ind.remates_arco || 0;
    goles  = ind.remates_gol || 0;
    afuera = ind.remates_afuera || 0;
    bloq   = ind.remates_bloq || 0;
    efect  = ind.remates_efect || 0;
  }

  return `
    <div class="ind-block-title sub">Remates · efectividad ${efect}%</div>
    ${ir('Total', total, 'remates_total')}
    ${ir('Al arco', arco, 'remates_arco')}
    ${ir('Goles', goles, 'remates_gol')}
    ${ir('Afuera', afuera, 'remates_afuera')}
    ${ir('Bloqueado', bloq, 'remates_bloq')}
    ${fuente}
    ${renderRematesPorSuperficie(ind)}`;
}

function buildIndHTML(ind) {
  if (!ind || Object.keys(ind).length === 0) return '<p style="color:var(--gris5)">Sin datos individuales para este jugador.</p>';

  const efect = ind.pases_efect || 0;
  const colorEf = efect >= 75 ? 'var(--verde)' : efect >= 60 ? 'var(--ambar)' : 'var(--rojo)';

  // Semáforo automático por percentil contra el plantel.
  // Generoso con amarillo: verde solo si destaca (top 30%), rojo solo si está claramente abajo (bottom 20%).
  // Métricas "menos es mejor" se invierten (perd_total, pases_incompletos, etc.).
  const METRICAS_INVERTIDAS = new Set([
    'pases_incompletos', 'centros_i', 'remates_afuera', 'remates_bloq',
    'dao_minus', 'dad_minus', 'aereo_op', 'aereo_dp', 'regate_i',
    'perd_total', 'perd_pase', 'perd_control', 'perd_gambeta',
    'faltas_hec', 'interv_entrada_p', 'interv_anticipo_p',
    'rem_cab_afuera', 'rem_cab_bloq', 'rem_pieh_afuera', 'rem_pieh_bloq',
    'rem_piei_afuera', 'rem_piei_bloq', 'negativos',
    'pases_largo_i', 'apoyo_i',
  ]);
  const COLORES_FIJOS = new Set(['', 'red', 'green', 'amber', 'blue']);

  function _semaforoColor(metKey) {
    if (!datosJugadores || !ind || ind.__esColectivo || !metKey) return '';
    const pool = Object.values(datosJugadores).filter(j => (j.intervenciones||0) >= 8);
    if (pool.length < 4) return '';
    const valores = pool.map(j => j[metKey] || 0);
    const v = ind[metKey] || 0;
    let p = _percentil(v, valores);
    if (METRICAS_INVERTIDAS.has(metKey)) p = 100 - p;
    // Simétrico: top 30% verde, bottom 30% rojo, 40% medio amarillo
    if (p >= 70) return 'green';
    if (p >= 30) return 'amber';
    return 'red';
  }

  // ir(label, val, color|metricaKey)
  //   - Si el 3er arg es 'red'/'green'/'amber'/'blue'/'' → color fijo (compat)
  //   - Si es una clave de métrica (ej. 'pases_total') → color por percentil
  function ir(label, val, colorOMet='') {
    const color = COLORES_FIJOS.has(colorOMet) ? colorOMet : _semaforoColor(colorOMet);
    return `<div class="ind-row"><span class="ind-row-label">${label}</span><span class="ind-row-val ${color}">${val}</span></div>`;
  }
  function irTip(label, val, tip, colorOMet='') {
    const color = COLORES_FIJOS.has(colorOMet) ? colorOMet : _semaforoColor(colorOMet);
    return `<div class="ind-row"><span class="ind-row-label">${label}<span class="info-dot" data-tip="${tip.replace(/"/g,'&quot;')}">i</span></span><span class="ind-row-val ${color}">${val}</span></div>`;
  }

  return `
  <div class="ind-header">
    <div>
      <div class="ind-nombre">${ind.jugador}</div>
      <div class="ind-sub">${ind.condicion} · ${ind.minutos}min · ${ind.intervenciones} intervenciones</div>
    </div>
    <div class="ind-kpis">
      <div class="kpi"><div class="kpi-val red">${ind.goles||0}</div><div class="kpi-label">Goles</div></div>
      <div class="kpi"><div class="kpi-val amber">${ind.asistencias||0}</div><div class="kpi-label">Asistencias</div></div>
      <div class="kpi"><div class="kpi-val blue">${ind.pases_clave||0}</div><div class="kpi-label">Pases clave</div></div>
    </div>
  </div>

  ${(datosJugadores && Object.keys(datosJugadores).length >= 4) ? (() => {
    const esColectivo = !!ind.__esColectivo;
    // En colectivo, las visualizaciones comparativas usan el promedio por jugador del grupo
    const indPerfil = esColectivo ? (ind.__promedio || ind) : ind;
    const est = detectarEstilo(indPerfil, datosJugadores, esColectivo);
    const esMixto = !est || est.nombre.includes('mixto');
    const tituloPiz = esColectivo ? '🍕 Percentiles (promedio del grupo vs plantel)' : '🍕 Percentiles en el plantel';
    const tituloBee = esColectivo ? '🐝 Distribución del plantel (con jugadores seleccionados marcados)' : '🐝 Distribución del plantel';
    const piePieBee = esColectivo
      ? `Puntos rojos = los ${ind.__seleccionados?.length||'N'} jugadores del colectivo · puntos grises = no seleccionados`
      : `Punto rojo grande = ${ind.jugador} · puntos grises = resto del plantel · hover para ver nombre y valor`;
    return `
  <div class="perfil-visual">
    <div>
      ${est ? `<div class="estilo-badge ${esMixto?'mixto':''}">
        <div class="ico">${est.icon}</div>
        <div class="nombre">${est.nombre}</div>
        <div class="detalle">${est.detalle}</div>
      </div>` : ''}
      <div class="perfil-titulo">${esColectivo ? tituloPiz : '🎯 Perfil por posición'}</div>
      ${esColectivo
        ? pizzaPlayer(indPerfil, datosJugadores)
        : pizzaPosicional(indPerfil, datosJugadores)}
      ${esColectivo ? `
      <div class="perfil-leyenda">
        <span class="lg-top">Top (p ≥ 70)</span>
        <span class="lg-medio">Medio (p 40-69)</span>
        <span class="lg-bajo">Bajo (p &lt; 40)</span>
      </div>` : `
      <div style="font-size:10px;color:var(--gris5);margin-top:6px;text-align:center">
        Cuña verde: percentil del jugador vs compañeros · Puntos grises: distribución del grupo
      </div>
      ${renderSelectorComparables(indPerfil, datosJugadores)}`}
    </div>
    <div>
      <div class="perfil-titulo">${tituloBee}</div>
      ${beeswarmCompacto(indPerfil, datosJugadores, esColectivo ? (ind.__seleccionados||[]) : null)}
      <div style="font-size:10px;color:var(--gris5);margin-top:10px;text-align:center">${piePieBee}</div>
      ${!esColectivo ? (() => {
        const txt = analisisJugador(ind, datosJugadores);
        return txt ? `<div class="analisis-jug">
          <div class="analisis-jug-titulo">
            <span>📝 Análisis del jugador</span>
            <span class="analisis-jug-badge">Generado por <b>River360 IA</b></span>
          </div>
          <p class="analisis-jug-text" data-content="${encodeURIComponent(txt)}"></p>
        </div>` : '';
      })() : ''}
    </div>
  </div>`;
  })() : ''}

  ${(coordsActuales && coordsActuales.length > 0) ? `
  <div class="pitch-section">
    <div class="pitch-head">
      <div class="perfil-titulo">🗺 Mapa en cancha · <span id="pitch-count">${_filtrarPorCat(coordsActuales).length}</span> / ${coordsActuales.length} acciones</div>
      <div class="pitch-modos">
        <button class="${pitchModo==='calor'?'active':''}"   onclick="setPitchModo('calor')">🔥 Calor</button>
        <button class="${pitchModo==='puntos'?'active':''}"  onclick="setPitchModo('puntos')">⦿ Puntos</button>
        <button class="${pitchModo==='flechas'?'active':''}" onclick="setPitchModo('flechas')">➤ Progresivas</button>
      </div>
    </div>
    <div id="pitch-acciones-filter" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center">
      <span style="font-size:10px;color:var(--gris5);text-transform:uppercase;letter-spacing:.5px;margin-right:4px">Acciones:</span>
      ${CATS_ACCION.map(([id,lbl]) => `
        <label class="part-chip" style="padding:3px 9px">
          <input type="checkbox" data-cat="${id}" ${accionFiltros.has(id)?'checked':''} onchange="onAccionFiltroToggle()">
          <span style="font-size:10.5px">${lbl}</span>
        </label>`).join('')}
      <button class="btn" style="padding:3px 9px;font-size:10.5px" onclick="setAccionFiltros(true)">Todos</button>
      <button class="btn" style="padding:3px 9px;font-size:10.5px" onclick="setAccionFiltros(false)">Ninguno</button>
      <label class="part-chip" style="padding:3px 9px;margin-left:auto" title="Mostrar centro de gravedad y elipse de dispersión">
        <input type="checkbox" ${mostrarCG?'checked':''} onchange="toggleCG(this.checked)">
        <span style="font-size:10.5px">🎯 CG + dispersión</span>
      </label>
    </div>
    <div id="pitch-container">${dibujarCancha(coordsActuales, pitchModo)}</div>
    <div class="pitch-leyenda">
      ${pitchModo==='puntos' ? `
        <span><span style="display:inline-block;width:8px;height:8px;background:#3ecf8e;border-radius:50%;margin-right:5px;vertical-align:middle"></span>Completa / positiva</span>
        <span><span style="display:inline-block;width:8px;height:8px;background:#f5a623;border-radius:50%;margin-right:5px;vertical-align:middle"></span>En área rival</span>
        <span><span style="display:inline-block;width:8px;height:8px;background:#CC0000;border-radius:50%;margin-right:5px;vertical-align:middle"></span>Incompleta / pérdida</span>
      ` : pitchModo==='flechas' ? `
        <span><span style="display:inline-block;width:10px;height:3px;background:#3ecf8e;margin-right:5px;vertical-align:middle"></span>Flecha verde: pase/centro/1v1O+ progresivo</span>
        <span><span style="display:inline-block;width:10px;height:3px;background:#f5a623;margin-right:5px;vertical-align:middle"></span>Flecha: termina en área rival</span>

      ` : `
        <span>Color rojo más intenso = más acciones en esa zona · grilla 12 × 8</span>
      `}

  ${ind.__esColectivo ? `

    <div id="mapa-ter-container">

      ${ir('Adelante', ind.pases_adelante, 'pases_adelante')}
      ${ir('Atrás', ind.pases_atras, 'pases_atras')}

      ${ir('Aéreos Def. Ganados', ind.aereo_dg||0, 'aereo_dg')}
      ${ir('Aéreos Def. Perdidos', ind.aereo_dp||0, 'aereo_dp')}
      ${ir('Regate completo', ind.regate_c, 'regate_c')}
      ${ir('Regate incompleto', ind.regate_i, 'regate_i')}
      ${bloqueRemates(ind)}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Mapa posicional</div>
      ${irTip('Centro de gravedad', `(${ind.centro_grav_x||0}, ${ind.centro_grav_y||0})`, 'Promedio de coordenadas (x, y) de todas las acciones del jugador. Indica dónde se posicionó habitualmente. x crece hacia el arco rival (0-120). y es el ancho (0-80).')}
      ${irTip('Dispersión x · y', `${ind.dispersion_x||0} · ${ind.dispersion_y||0}`, 'Desvío estándar de las coordenadas. Alto = jugador móvil que cubre mucho terreno. Bajo = jugador anclado a una zona.')}
      ${irTip('Acciones con coord.', ind.acciones_xy||0, 'Cantidad de acciones del jugador que tienen coordenadas registradas. Es la base de todas las métricas posicionales.', 'acciones_xy')}
      ${irTip('% último tercio', (ind.pct_ultimo_tercio||0)+'%', 'Porcentaje de las acciones del jugador que ocurrieron en x ≥ 80 (último tercio ofensivo).', 'pct_ultimo_tercio')}
      ${irTip('% área rival', (ind.pct_area||0)+'%', 'Porcentaje de las acciones dentro del área rival (x > 102, y entre 18 y 62).', 'pct_area')}
      <div class="ind-block-title sub">Progresión</div>
      ${irTip('Progresión media (mts)', ind.progresion_media||0, 'Promedio de metros que avanza hacia el arco rival en cada acción con origen y destino (x_destino − x_origen). Positivo = avanza, negativo = retrocede.', 'progresion_media')}
      ${irTip('Distancia media (mts)', ind.distancia_media||0, 'Promedio de la distancia euclídea entre origen y destino de cada acción. Mide qué tan largas son sus acciones, sin importar dirección.', 'distancia_media')}
      ${irTip('% acciones progresivas', (ind.pct_progresivo||0)+'%', 'Porcentaje de las acciones con destino que avanzaron ≥ 10 metros hacia el arco rival. Mide cuánto aporta el jugador al ataque del equipo.', 'pct_progresivo')}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Defensa y táctica</div>
      ${ir('Recup. posicional', ind.recup_posic, 'recup_posic')}
      ${ir('Recup. x intervención', ind.recup_interv, 'recup_interv')}
      ${ir('Tras pérdida', ind.recup_tras, 'recup_tras')}
      ${ir('Pérdidas totales', ind.perd_total, 'perd_total')}
      ${ir('Intercepciones', ind.intercepciones, 'intercepciones')}
      ${ir('Bloqueos', ind.bloqueos, 'bloqueos')}
      ${renderPerdidasPorTipo(ind)}
      <div class="ind-block-title sub">Movimiento</div>
      ${ir('Toques en área rival', ind.toques_area, 'toques_area')}
      ${ir('Recep. entre líneas', ind.recep_lineas, 'recep_lineas')}
      ${ir('Recep. a espaldas del volante', ind.recep_espal, 'recep_espal')}
      ${ir('Recep. al espacio', ind.recep_espacio, 'recep_espacio')}
      ${ir('Ruptura en conducción', ind.ruptura, 'ruptura')}
    </div>
  </div>

  ${!ind.__esColectivo ? `
  <div style="background:var(--gris1);border:1px solid var(--gris3);border-radius:8px;padding:12px 16px;margin-top:1rem;font-size:11.5px;color:var(--gris5);line-height:1.55">
    <div style="font-weight:700;color:var(--blanco);margin-bottom:6px;font-size:12px">🚦 Cómo se lee el semáforo</div>
    <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px">
      <span><span class="ind-row-val green" style="font-weight:800">VERDE</span> · destaca (top 30% del plantel)</span>
      <span><span class="ind-row-val amber" style="font-weight:800">AMARILLO</span> · cerca del promedio (mayoría del plantel)</span>
      <span><span class="ind-row-val red" style="font-weight:800">ROJO</span> · por debajo (bottom 30%)</span>
    </div>
    <div>
      Cada valor compara al jugador contra el resto del plantel (jugadores con ≥8 intervenciones). En métricas
      <i>"menos es mejor"</i> el semáforo se invierte — ej. pocas <b>pérdidas</b>, pocos <b>1v1 perdidos</b> o pocos
      <b>remates afuera</b> también se ven en verde. % Pase y % Centros completos usan thresholds fijos
      (75%/60% y 35%/20%) en vez del percentil.
    </div>
  </div>` : ''}

  ${(() => {
    const esCol = !!ind.__esColectivo;
    const indFoda = esCol ? (ind.__promedio || ind) : ind;
    const titulo = esCol ? 'FODA del colectivo (promedio del grupo)' : 'FODA de ' + ind.jugador;
    return renderFoda(titulo, analisisFoda(indFoda, datosJugadores));
  })()}`;
}
</script>
</body>
</html>
