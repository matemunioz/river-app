<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Plate · Videoanálisis</title>
  <style>
    :root {
      --rojo:    #CC0000;
      --rojo2:   #990000;
      --negro:   #0a0a0a;
      --gris1:   #141414;
      --gris2:   #1e1e1e;
      --gris3:   #2a2a2a;
      --gris4:   #3a3a3a;
      --gris5:   #555;
      --grisc:   #ccc;
      --blanco:  #f5f5f5;
      --verde:   #3ecf8e;
      --ambar:   #f5a623;
      --azul:    #4a90d9;
      --r: var(--border-radius-md, 8px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--negro);
      color: var(--blanco);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--gris1);
      border-bottom: 3px solid var(--rojo);
      padding: 0 1.5rem;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-img { height: 42px; filter: drop-shadow(0 0 6px rgba(204,0,0,0.4)); }
    .brand { display: flex; flex-direction: column; }
    .brand-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
    .brand-sub { font-size: 10px; color: var(--gris5); letter-spacing: 1px; text-transform: uppercase; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    /* MAIN */
    main { max-width: 1180px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
    .section { margin-top: 2.5rem; }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: .5rem;
      border-bottom: 1px solid var(--gris3);
    }
    .section-title {
      font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--blanco);
    }
    .section-title span { color: var(--rojo); }
    .section-hint { font-size: 11px; color: var(--gris5); }

    /* DROP ZONE */
    #drop-zone {
      border: 1.5px dashed var(--gris4);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--rojo);
      background: rgba(204,0,0,0.05);
    }
    #drop-zone input { display: none; }
    .drop-icon { font-size: 32px; margin-bottom: 10px; display: block; }
    .drop-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
    .drop-sub { color: var(--gris5); font-size: 12px; }

    /* BTN */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 6px;
      border: 1px solid var(--gris4);
      background: var(--gris3); color: var(--blanco);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background .15s, border-color .15s; text-decoration: none;
    }
    .btn:hover { background: var(--gris4); border-color: var(--gris5); }
    .btn-red { background: var(--rojo); border-color: var(--rojo); }
    .btn-red:hover { background: var(--rojo2); }
    .btn-outline { background: transparent; border-color: var(--rojo); color: var(--rojo); }
    .btn-outline:hover { background: rgba(204,0,0,0.1); }
    .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

    /* STATUS */
    #status-bar {
      display: none; align-items: center; gap: 10px;
      margin-top: 1.2rem; padding: 10px 14px;
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 6px; font-size: 12px; color: var(--gris5);
    }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--gris4);
      border-top-color: var(--rojo); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULTADOS */
    #results { margin-top: 2rem; }

    .partido-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem;
    }
    .partido-title { font-size: 18px; font-weight: 700; }
    .partido-title span { color: var(--rojo); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* SCORE */
    .score-box {
      background: linear-gradient(135deg, var(--gris1) 0%, var(--gris2) 100%);
      border-radius: 14px;
      border: 1px solid var(--gris3);
      display: flex; align-items: center; justify-content: center;
      gap: 3rem; padding: 2rem 2rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .score-box::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(204,0,0,.08) 0, transparent 50%);
      pointer-events: none;
    }
    .score-team { text-align: center; position: relative; }
    .score-name { font-size: 11px; color: var(--gris5); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
    .score-num { font-size: 78px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
    .score-num.river { color: var(--rojo); text-shadow: 0 0 30px rgba(204,0,0,.3); }
    .score-num.rival { color: var(--grisc); }
    .score-sep { font-size: 40px; color: var(--gris4); font-weight: 200; }

    /* KPI HERO (los 4 destacados) */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 0;
    }
    @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card {
      background: var(--gris2);
      border: 1px solid var(--gris3);
      border-radius: 12px;
      padding: 18px 20px;
      transition: border-color .2s, transform .2s;
    }
    .kpi-card:hover { border-color: var(--gris4); transform: translateY(-1px); }
    .kpi-card-label { font-size: 10px; color: var(--gris5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; }
    .kpi-card-val { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .kpi-card-val.red { color: var(--rojo); }
    .kpi-card-val.amber { color: var(--ambar); }
    .kpi-card-val.green { color: var(--verde); }
    .kpi-card-sub { font-size: 10px; color: var(--gris5); margin-top: 6px; }

    /* TABS */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 2rem; overflow-x: auto;
      padding: 5px; background: var(--gris1); border-radius: 10px;
      border: 1px solid var(--gris3);
    }
    .tab {
      padding: 10px 18px; font-size: 12px; font-weight: 600;
      color: var(--gris5); cursor: pointer;
      border-radius: 7px; white-space: nowrap;
      transition: color .15s, background .15s;
      flex: 1; text-align: center; min-width: max-content;
    }
    .tab:hover { color: var(--blanco); background: var(--gris2); }
    .tab.active { color: white; background: var(--rojo); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* SECTION TITLE (subtítulo dentro de tab) */
    .sec-title {
      font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--gris5);
      margin: 1.5rem 0 .8rem;
    }
    .sec-title.red { color: var(--rojo); }
    .sec-title:first-child { margin-top: 0; }

    /* BAR COMPARE — más aire */
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .bar-track { flex: 1; height: 10px; background: var(--gris3); border-radius: 5px; overflow: hidden; position: relative; }
    .bar-fill-river { height: 100%; background: linear-gradient(90deg, var(--rojo2), var(--rojo)); border-radius: 5px; transition: width .5s; }
    .bar-fill-rival { height: 100%; background: var(--gris5); border-radius: 5px; transition: width .5s; }
    .bar-val { font-size: 13px; font-weight: 700; min-width: 28px; }
    .bar-val.river { color: var(--rojo); text-align: right; }

    .compare-panel {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 1.5rem 1.8rem;
    }
    .compare-legend { display: flex; gap: 24px; margin-bottom: 1.2rem; font-size: 11px; font-weight: 600; }
    .compare-legend .lg-river { color: var(--rojo); }
    .compare-legend .lg-rival { color: var(--gris5); }
    .compare-legend .lg-river::before, .compare-legend .lg-rival::before {
      content: ''; display: inline-block; width: 10px; height: 10px;
      border-radius: 2px; margin-right: 6px; vertical-align: middle;
    }
    .compare-legend .lg-river::before { background: var(--rojo); }
    .compare-legend .lg-rival::before { background: var(--gris5); }

    /* MINI GRID — cards más generosas */
    .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
    .mini-card {
      background: var(--gris2); border: 1px solid var(--gris3);
      border-radius: 10px; padding: 14px 12px; text-align: center;
      transition: border-color .15s;
    }
    .mini-card:hover { border-color: var(--gris4); }
    .mini-label { font-size: 10px; color: var(--gris5); text-transform: uppercase; margin-bottom: 6px; letter-spacing: .5px; }
    .mini-val { font-size: 22px; font-weight: 800; line-height: 1; }
    .mini-val.red { color: var(--rojo); }
    .mini-val.green { color: var(--verde); }
    .mini-val.amber { color: var(--ambar); }

    /* PANEL — contenedor genérico para tabs */
    .panel-card {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 1.5rem 1.8rem;
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }

    /* GOLES */
    .gol-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; background: var(--gris2);
      border: 1px solid var(--gris3); border-radius: 10px; margin-bottom: 8px;
      transition: border-color .15s;
    }
    .gol-item:hover { border-color: var(--gris4); }
    .gol-min { font-size: 14px; font-weight: 800; color: var(--rojo); min-width: 56px; }
    .gol-eq { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: .5px; }
    .gol-eq.river { background: rgba(204,0,0,.2); color: var(--rojo); }
    .gol-eq.rival { background: var(--gris3); color: var(--grisc); }
    .gol-info { flex: 1; }
    .gol-tipo { font-size: 10px; color: var(--gris5); margin-bottom: 2px; letter-spacing: .3px; }
    .gol-carril { font-weight: 700; font-size: 13px; }

    /* CAMBIOS */
    .cambio-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; background: var(--gris2);
      border: 1px solid var(--gris3); border-radius: 10px; margin-bottom: 8px;
    }
    .cambio-item:hover { border-color: var(--gris4); }
    .cambio-min { font-size: 14px; font-weight: 800; color: var(--rojo); min-width: 56px; }
    .cambio-sale { color: #ff6666; font-weight: 600; font-size: 12px; }
    .cambio-entra { color: #66ff99; font-weight: 600; font-size: 12px; }
    .cambio-eq { font-size: 9px; color: var(--gris5); margin-left: auto; letter-spacing: .5px; }

    /* MINUTOS */
    .min-jugador {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px;
    }
    .min-nombre { font-size: 12px; min-width: 160px; font-weight: 600; }
    .min-track { flex: 1; height: 12px; background: var(--gris3); border-radius: 6px; overflow: hidden; }
    .min-fill { height: 100%; border-radius: 6px; transition: width .4s; }
    .min-fill.titular { background: linear-gradient(90deg, var(--rojo2), var(--rojo)); }
    .min-fill.suplente { background: var(--gris5); }
    .min-tiempo { font-size: 12px; color: var(--blanco); font-weight: 700; min-width: 50px; text-align: right; }
    .min-cond { font-size: 9px; padding: 3px 8px; border-radius: 10px; font-weight: 600; letter-spacing: .5px; }
    .min-cond.titular { background: rgba(204,0,0,.2); color: var(--rojo); }
    .min-cond.suplente { background: var(--gris3); color: var(--gris5); }

    /* INDIVIDUAL */
    .ind-selector {
      display: flex; gap: 8px; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .ind-selector label { font-size: 12px; color: var(--gris5); }
    .ind-selector select {
      padding: 6px 10px; background: var(--gris2); border: 1px solid var(--gris4);
      color: var(--blanco); border-radius: 6px; font-size: 12px;
    }

    /* COMBOBOX custom (búsqueda de jugador) */
    .combo { position: relative; }
    .combo input {
      background: var(--gris2); border: 1px solid var(--gris4);
      color: var(--blanco); padding: 8px 32px 8px 12px;
      border-radius: 8px; font-size: 12px; min-width: 280px;
      transition: border-color .15s;
    }
    .combo input:focus { outline: none; border-color: var(--rojo); }
    .combo::after {
      content: '▾'; position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%); color: var(--gris5); pointer-events: none; font-size: 10px;
    }
    .combo-list {
      position: absolute; top: calc(100% + 4px); left: 0;
      width: 100%; max-height: 260px; overflow-y: auto;
      background: var(--gris1); border: 1px solid var(--gris4);
      border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
      z-index: 100; padding: 4px;
      display: none;
    }
    .combo-list.open { display: block; }
    .combo-item {
      padding: 7px 10px; font-size: 12px; cursor: pointer;
      border-radius: 5px; color: var(--blanco);
    }
    .combo-item:hover, .combo-item.active { background: var(--rojo); }
    .combo-empty { padding: 10px; color: var(--gris5); font-size: 11px; text-align: center; }

    /* IND stats */
    .ind-header {
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 10px; padding: 1rem 1.2rem;
      display: flex; gap: 16px; align-items: center; margin-bottom: 1rem;
    }
    .ind-nombre { font-size: 20px; font-weight: 800; }
    .ind-sub { font-size: 11px; color: var(--gris5); margin-top: 3px; }
    .ind-kpis { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
    .kpi { text-align: center; }
    .kpi-val { font-size: 22px; font-weight: 800; }
    .kpi-val.red { color: var(--rojo); }
    .kpi-val.amber { color: var(--ambar); }
    .kpi-val.blue { color: var(--azul); }
    .kpi-label { font-size: 9px; color: var(--gris5); text-transform: uppercase; }

    .ind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .ind-grid { grid-template-columns: 1fr; } }
    .ind-block {
      background: var(--gris2); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 16px 18px;
      transition: border-color .15s;
    }
    .ind-block:hover { border-color: var(--gris4); }
    .ind-block-title {
      font-size: 10px; font-weight: 700; letter-spacing: 1.3px;
      text-transform: uppercase; color: var(--rojo);
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--gris3);
    }
    .ind-block-title.sub { color: var(--gris5); margin-top: 16px; border-bottom: none; padding-bottom: 4px; }
    /* Tooltip de ayuda */
    .info-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--gris3); border: 1px solid var(--gris4);
      color: var(--gris5); font-size: 9px; font-weight: 700;
      margin-left: 6px; cursor: help; position: relative;
    }
    .info-dot:hover { color: var(--rojo); border-color: var(--rojo); }
    .info-dot::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: var(--negro); color: var(--blanco);
      border: 1px solid var(--rojo); border-radius: 6px;
      padding: 8px 10px; font-size: 11px; font-weight: 400;
      white-space: normal; width: 240px; text-align: left; line-height: 1.4;
      opacity: 0; pointer-events: none; transition: opacity .15s;
      z-index: 1000; box-shadow: 0 6px 20px rgba(0,0,0,.6);
    }
    .info-dot:hover::after { opacity: 1; }

    .ind-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--gris3); }
    .ind-row:last-child { border-bottom: none; }
    .ind-row-label { font-size: 11px; color: var(--grisc); }
    .ind-row-val { font-size: 14px; font-weight: 700; }
    .ind-row-val.red { color: var(--rojo); }
    .ind-row-val.green { color: var(--verde); }
    .ind-row-val.amber { color: var(--ambar); }

    .efect-bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .efect-pct { font-size: 26px; font-weight: 800; }
    .efect-track { flex: 1; height: 8px; background: var(--gris3); border-radius: 4px; overflow: hidden; }
    .efect-fill { height: 100%; border-radius: 4px; }

    .part-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 14px;
      background: var(--gris2); border: 1px solid var(--gris4);
      font-size: 11px; cursor: pointer; user-select: none;
    }
    .part-chip input { accent-color: var(--rojo); cursor: pointer; }
    .part-chip:has(input:not(:checked)) { opacity: 0.45; }
    .part-chip:hover { border-color: var(--rojo); }

    /* SUB-TABS DENTRO DE INDIVIDUAL */
    .ind-subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--gris4); margin-bottom: 1rem; }
    .ind-subtab {
      padding: 7px 14px; font-size: 11px; font-weight: 600; cursor: pointer;
      color: var(--gris5); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .ind-subtab:hover { color: var(--blanco); }
    .ind-subtab.active { color: var(--rojo); border-bottom-color: var(--rojo); }

    .col-modos { display: inline-flex; gap: 4px; background: var(--gris2); border: 1px solid var(--gris4); border-radius: 6px; padding: 3px; margin-bottom: 1rem; }
    .col-modos button { padding: 4px 12px; font-size: 11px; border: none; background: transparent; color: var(--gris5); cursor: pointer; border-radius: 4px; }
    .col-modos button.active { background: var(--rojo); color: white; }

    /* CREADOR DE GRÁFICOS */
    .chart-builder { background: var(--gris2); border: 1px solid var(--gris4); border-radius: 10px; padding: 14px; margin-bottom: 1rem; }
    .chart-builder-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .chart-builder-row:last-child { margin-bottom: 0; }
    .chart-builder-label {
      font-size: 10px; color: var(--gris5); text-transform: uppercase;
      letter-spacing: .5px; min-width: 90px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--rojo); color: white;
      font-size: 10px; font-weight: 800;
    }
    .chip-toggle {
      padding: 6px 12px; background: var(--gris3); border: 1px solid var(--gris4);
      border-radius: 16px; font-size: 11px; cursor: pointer; color: var(--blanco);
      transition: all .15s; font-weight: 500;
    }
    .chip-toggle:hover { border-color: var(--rojo); }
    .chip-toggle.active { background: var(--rojo); border-color: var(--rojo); color: white; }
    .metric-check {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px; background: var(--gris3); border: 1px solid var(--gris4);
      border-radius: 12px; font-size: 10px; cursor: pointer; user-select: none;
    }
    .metric-check input { accent-color: var(--rojo); cursor: pointer; }
    .metric-check:has(input:not(:checked)) { opacity: 0.45; }
    .metric-check:hover { border-color: var(--rojo); }
    .bar-chart { background: var(--gris1); border: 1px solid var(--gris4); border-radius: 8px; padding: 1rem; }
    .bar-chart-title { font-size: 11px; color: var(--gris5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .bar-row-c { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .bar-row-c .nombre { min-width: 150px; font-size: 11px; }
    .bar-row-c .track { flex: 1; height: 18px; background: var(--gris3); border-radius: 4px; overflow: hidden; }
    .bar-row-c .fill { height: 100%; background: linear-gradient(90deg, var(--rojo), var(--rojo2)); border-radius: 4px; }
    .bar-row-c .val { min-width: 42px; font-size: 12px; font-weight: 700; text-align: right; }

    .scatter-ctrls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; padding: 10px; background: var(--gris2); border: 1px solid var(--gris4); border-radius: 8px; }
    .scatter-ctrls label { font-size: 10px; color: var(--gris5); text-transform: uppercase; letter-spacing: .5px; }
    .scatter-ctrls select {

    .scatter-dot { cursor: pointer; transition: r .15s; }

    /* BLOQUE LECTURA — insights automáticos */
    .lectura {

    /* FODA del jugador */
    .foda-summary {

    /* FILTRO TEMPORAL — dual range */
    .tiempo-filter {

    .dual-range {
      position: relative; flex: 1; min-width: 240px; height: 28px;

    .dual-range .track {
      position: absolute; top: 50%; left: 0; right: 0; height: 4px;

    .dual-range .range {
      position: absolute; top: 50%; height: 4px;
      background: linear-gradient(90deg, var(--rojo2), var(--rojo));
      border-radius: 2px; transform: translateY(-50%);
    }
    .dual-range input[type=range] {
      position: absolute; top: 0; left: 0; width: 100%; height: 28px;
      background: transparent; appearance: none; pointer-events: none;
    }
    .dual-range input[type=range]::-webkit-slider-thumb {
      pointer-events: auto; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--rojo); border: 2px solid #fff; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .dual-range input[type=range]::-moz-range-thumb {
      pointer-events: auto;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--rojo); border: 2px solid #fff; cursor: pointer;
    }
    .tiempo-vals {
      font-size: 12px; color: var(--blanco); font-weight: 700;
      font-variant-numeric: tabular-nums; min-width: 90px; text-align: center;
    }
    .tiempo-presets { display: flex; gap: 4px; }
    .tiempo-presets button {
      padding: 5px 10px; font-size: 11px; border: 1px solid var(--gris4);
      background: var(--gris3); color: var(--blanco); cursor: pointer;
      border-radius: 14px; font-weight: 600;
    }
    .tiempo-presets button:hover { border-color: var(--rojo); }
    .tiempo-presets button.active { background: var(--rojo); border-color: var(--rojo); }

    /* EFICIENCIA + MATRIZ DE LLEGADAS */
    .efic-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px; margin-bottom: 1.2rem;
    }
    .efic-card {
      background: var(--gris2); border: 1px solid var(--gris3);
      border-radius: 10px; padding: 14px 16px;
    }
    .efic-label { font-size: 10px; color: var(--gris5); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
    .efic-val   { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -.5px; }
    .efic-sub   { font-size: 10px; color: var(--gris5); margin-top: 4px; }
    .efic-val.red   { color: var(--rojo); }
    .efic-val.amber { color: var(--ambar); }
    .efic-val.green { color: var(--verde); }

    .matriz-wrap {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 10px; padding: 1.2rem 1.4rem;
    }
    .matriz {
      width: 100%; border-collapse: separate; border-spacing: 3px;
    }
    .matriz th, .matriz td {
      padding: 10px 8px; text-align: center; font-size: 12px;
      border-radius: 6px;
    }
    .matriz th {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--gris5); font-weight: 700; background: transparent;
    }
    .matriz th.row-head { text-align: right; padding-right: 12px; color: var(--blanco); }
    .matriz td {
      background: var(--gris2); color: var(--blanco); font-weight: 700;
      position: relative; transition: background .15s;
    }
    .matriz td .v { font-size: 16px; font-weight: 800; }
    .matriz td .p { display: block; font-size: 9px; color: var(--gris5); margin-top: 2px; }

    /* CANCHA 2D + HEATMAP */
    .pitch-section {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 1.5rem 1.6rem;
      margin: 1.2rem 0;
    }
    .pitch-head {
      display: flex; align-items: center; justify-content: space-between;

    }
    .pitch-svg {
      width: 100%; height: auto;
      max-width: 540px;
      display: block; margin: 0 auto;
      background: #141414; border-radius: 8px;
    }
    .pitch-modos {
      display: inline-flex; gap: 3px; background: var(--gris2);
      border: 1px solid var(--gris4); border-radius: 6px; padding: 3px;
    }
    .pitch-modos button {
      padding: 4px 10px; font-size: 10px; border: none;
      background: transparent; color: var(--gris5); cursor: pointer;
      border-radius: 4px; font-weight: 600;
    }
    .pitch-modos button.active { background: var(--rojo); color: white; }
    .pitch-leyenda {
      display: flex; gap: 16px; justify-content: center;
      font-size: 10px; color: var(--gris5); margin-top: 10px;

    /* PERFIL VISUAL (pizza + beeswarm) */
    .perfil-visual {
      background: var(--gris1); border: 1px solid var(--gris3);
      border-radius: 12px; padding: 1.5rem 1.6rem;
      margin: 1.2rem 0; display: grid; gap: 1.5rem;
      grid-template-columns: minmax(380px, 1fr) 1.3fr;
      align-items: start;
    }
    @media (max-width: 900px) { .perfil-visual { grid-template-columns: 1fr; } }
    .perfil-titulo {
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--rojo); margin-bottom: 10px;
    }
    .estilo-badge {
      background: linear-gradient(135deg, var(--rojo2), var(--rojo));
      border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
      text-align: center; box-shadow: 0 4px 18px rgba(204,0,0,.25);
    }
    .estilo-badge .ico { font-size: 28px; line-height: 1; margin-bottom: 4px; }
    .estilo-badge .nombre { font-size: 16px; font-weight: 800; color: white; letter-spacing: -.2px; }
    .estilo-badge .detalle { font-size: 10px; color: rgba(255,255,255,.75); margin-top: 4px; letter-spacing: .3px; }
    .estilo-badge.mixto { background: var(--gris2); border: 1px solid var(--gris4); box-shadow: none; }
    .estilo-badge.mixto .nombre { color: var(--gris5); }
    .estilo-badge.mixto .detalle { color: var(--gris5); }
    .perfil-leyenda {

    .perfil-leyenda .lg-medio::before  { background: var(--ambar); }
    .perfil-leyenda .lg-bajo::before   { background: var(--rojo); }

    .beeswarm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
    .beeswarm-svg { background: var(--gris2); border: 1px solid var(--gris3); border-radius: 6px; width: 100%; height: auto; }

    /* ANÁLISIS DEL JUGADOR (párrafo) */
    .analisis-jug {
      margin-top: 18px;
      background: linear-gradient(135deg, var(--gris2), rgba(204,0,0,0.05));
      border: 1px solid var(--gris3); border-left: 3px solid var(--rojo);
      border-radius: 8px; padding: 14px 16px;
    }
    .analisis-jug-titulo {
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--rojo); margin-bottom: 8px;
    }
    .analisis-jug p {
      font-size: 13px; line-height: 1.6; color: var(--blanco);
    }
    .analisis-jug p b { color: var(--rojo); font-weight: 700; }
    .analisis-jug p i { color: var(--ambar); font-style: normal; font-weight: 600; }

    .error-box { background: rgba(204,0,0,.1); border: 1px solid var(--rojo); border-radius: 6px; padding: 10px 14px; color: var(--rojo); font-size: 12px; margin-top: 1rem; }
  </style>
</head>
<body>

<header>
  <img src="/static/logo_transparente.png" class="logo-img" alt="River Plate">
  <div class="brand">
    <div class="brand-title">Área de Videoanálisis</div>
    <div class="brand-sub">Fútbol Formativo · CARP</div>
  </div>
</header>

<main>
  <div id="drop-zone"
       onclick="document.getElementById('fi').click()"
       ondragover="ev(event,'over')" ondragleave="ev(event,'leave')" ondrop="ev(event,'drop')">
    <input type="file" id="fi" accept=".csv,.xlsx,.xls" multiple onchange="procesar(this.files)">
    <span class="drop-icon" id="drop-icon">📂</span>
    <div class="drop-title">Seleccioná o arrastrá uno o varios exports de Sportcode</div>
    <div class="drop-sub">CSV o XLSX · arrastrá múltiples partidos para acumular estadísticas</div>
  </div>

  <div id="status-bar">
    <div class="spinner"></div>
    <span id="status-msg">Procesando...</span>
  </div>
  <div id="cache-bar" style="display:none;margin-top:.6rem;font-size:11px;color:var(--gris5);align-items:center;gap:8px">
    <span>💾 <span id="cache-info"></span></span>
    <button class="btn" style="padding:3px 8px;font-size:10px" onclick="borrarCache()">Borrar guardados</button>
  </div>
  <div id="error-box" class="error-box" style="display:none;"></div>
  <div id="results"></div>
</main>

<script>
let archivosActuales = [];
let datosActuales = null;
let nombresPartidos = [];
let partidosSel = new Set();
let tabActiva = 'individual';
let jugadorActivo = '';
let vistaInd = 'jugador';
let modoColectivo = 'suma';
let jugadoresSel = new Set();
let datosJugadores = null;
let xMetric = 'pases_total';
let yMetric = 'pases_efect';
let tMinMin = 0;     // minutos
let tMaxMin = 90;    // minutos
let tiempoTimer = null;
let chartType = 'scatter';
let radarMetrics = ['pases_efect', 'remates_arco', 'recup_posic', 'toques_area', 'dao_plus'];

const METRICAS = [
  ['minutos', 'Minutos'],
  ['intervenciones', 'Intervenciones'],
  ['pases_total', 'Pases totales'],
  ['pases_completos', 'Pases completos'],
  ['pases_incompletos', 'Pases incompletos'],
  ['pases_efect', '% Efectividad pases'],
  ['pases_clave', 'Pases clave'],
  ['pases_filtrado', 'Pases filtrados'],
  ['pases_largo_c', 'Pases largos completos'],
  ['centros_c', 'Centros completos'],
  ['centros_i', 'Centros incompletos'],
  ['goles', 'Goles'],
  ['asistencias', 'Asistencias'],
  ['remates_arco', 'Remates al arco'],
  ['remates_afuera', 'Remates afuera'],
  ['dao_plus', '1v1 Of. Ganados'],
  ['dao_minus', '1v1 Of. Perdidos'],
  ['dad_plus', '1v1 Def. Ganados'],
  ['dad_minus', '1v1 Def. Perdidos'],
  ['regate_c', 'Regates completos'],
  ['recup_posic', 'Recup. posicional'],
  ['recup_interv', 'Recup. por intervención'],
  ['recup_tras', 'Recup. tras pérdida'],
  ['perd_total', 'Pérdidas totales'],
  ['intercepciones', 'Intercepciones'],
  ['bloqueos', 'Bloqueos'],
  ['toques_area', 'Toques en área rival'],
  ['recep_lineas', 'Recep. entre líneas'],
  ['recep_espacio', 'Recep. al espacio'],
  ['ruptura', 'Rupturas en conducción'],
  ['despeje_or', 'Despejes orientados'],
  ['faltas_rec', 'Faltas recibidas'],
  ['faltas_hec', 'Faltas hechas'],
  ['acciones_xy', 'Acciones con coord.'],
  ['centro_grav_x', 'Centro gravedad X'],
  ['centro_grav_y', 'Centro gravedad Y'],
  ['dispersion_x', 'Dispersión X'],
  ['dispersion_y', 'Dispersión Y'],
  ['pct_ultimo_tercio', '% Último tercio'],
  ['pct_area', '% Área rival'],
  ['pct_progresivo', '% Acciones progresivas'],
  ['progresion_media', 'Progresión media (m)'],
  ['distancia_media', 'Distancia media (m)'],
];

const STORAGE_KEY = 'river_csvs_v1';

function fileToB64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

function b64ToFile(dataUrl, name) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/data:(.*?);base64/) || [, 'text/csv'])[1];
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new File([buf], name, { type: mime });
}

async function guardarEnCache(files) {
  try {
    const arr = await Promise.all(Array.from(files).map(async f => ({
      name: f.name,
      data: await fileToB64(f),
    })));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    actualizarBarraCache();
  } catch (e) {
    console.warn('No se pudo guardar en cache:', e);
  }
}

function cargarDeCache() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return arr.map(o => b64ToFile(o.data, o.name));
  } catch { return []; }
}

function actualizarBarraCache() {
  const bar = document.getElementById('cache-bar');
  const info = document.getElementById('cache-info');
  if (archivosActuales.length) {
    bar.style.display = 'flex';
    info.textContent = `${archivosActuales.length} archivo(s) guardado(s) en este navegador`;
  } else {
    bar.style.display = 'none';
  }
}

function borrarCache() {
  localStorage.removeItem(STORAGE_KEY);
  archivosActuales = [];
  partidosSel = new Set();
  datosActuales = null;
  jugadorActivo = '';
  nombresPartidos = [];
  tabActiva = 'comparativa';
  document.getElementById('results').innerHTML = '';
  document.getElementById('drop-icon').textContent = '📂';
  actualizarBarraCache();
}

window.addEventListener('DOMContentLoaded', () => {
  const stored = cargarDeCache();
  if (stored.length) procesar(stored, { fromCache: true });

  // Tooltip flotante para la cancha (instantáneo, sin delay nativo)
  const tip = document.createElement('div');
  tip.id = 'pitch-tooltip';
  tip.style.cssText =
    'position:fixed;background:#0a0a0a;color:#fff;border:1px solid #CC0000;' +
    'border-radius:6px;padding:6px 10px;font-size:11px;font-weight:500;' +
    'line-height:1.4;pointer-events:none;z-index:10000;display:none;' +
    'box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:280px';
  document.body.appendChild(tip);

  document.addEventListener('mouseover', e => {
    const g = e.target.closest && e.target.closest('[data-tip]');
    if (!g) return;
    tip.textContent = g.getAttribute('data-tip');
    tip.style.display = 'block';
  });
  document.addEventListener('mousemove', e => {
    if (tip.style.display === 'none') return;
    const x = e.clientX + 14, y = e.clientY + 14;
    const maxX = window.innerWidth - tip.offsetWidth - 8;
    tip.style.left = Math.min(x, maxX) + 'px';
    tip.style.top  = y + 'px';
  });
  document.addEventListener('mouseout', e => {
    const g = e.target.closest && e.target.closest('[data-tip]');
    if (!g) return;
    const rel = e.relatedTarget;
    if (rel && rel.closest && rel.closest('[data-tip]') === g) return;
    tip.style.display = 'none';
  });
});

function ev(e, tipo) {
  e.preventDefault();
  const dz = document.getElementById('drop-zone');
  if (tipo === 'over') dz.classList.add('drag-over');
  else if (tipo === 'leave') dz.classList.remove('drag-over');
  else { dz.classList.remove('drag-over'); if (e.dataTransfer.files.length) procesar(e.dataTransfer.files); }
}

async function procesar(files, opts = {}) {
  const lista = Array.from(files || []);
  if (!lista.length) return;
  archivosActuales = lista;
  partidosSel = new Set(lista.map((_, i) => i));
  nombresPartidos = lista.map(f => f.name.replace(/\.(csv|xlsx|xls)$/i, ''));
  tabActiva = 'individual';
  jugadorActivo = '';
  if (!opts.fromCache) guardarEnCache(lista);
  actualizarBarraCache();
  await analizarConFiltro({ mostrarStatus: true });
}

function actualizarRangeBar() {
  const bar = document.getElementById('tiempo-range');
  const vals = document.getElementById('tiempo-vals');
  if (bar) {
    const a = (tMinMin / 90) * 100;
    const b = (tMaxMin / 90) * 100;
    bar.style.left  = a + '%';
    bar.style.width = (b - a) + '%';
  }
  if (vals) vals.textContent = `${tMinMin}' – ${tMaxMin}'`;
}

function onTiempo(thumb) {
  const a = parseInt(document.getElementById('t-min').value) || 0;
  const b = parseInt(document.getElementById('t-max').value) || 90;
  if (thumb === 'min' && a > b) {
    tMinMin = b; tMaxMin = b;
    document.getElementById('t-min').value = b;
  } else if (thumb === 'max' && b < a) {
    tMaxMin = a; tMinMin = a;
    document.getElementById('t-max').value = a;
  } else {
    tMinMin = a; tMaxMin = b;
  }
  actualizarRangeBar();
  if (tiempoTimer) clearTimeout(tiempoTimer);
  tiempoTimer = setTimeout(() => analizarConFiltro(), 250);
}

function presetTiempo(a, b) {
  tMinMin = a; tMaxMin = b;
  const mi = document.getElementById('t-min'), ma = document.getElementById('t-max');
  if (mi) mi.value = a;
  if (ma) ma.value = b;
  actualizarRangeBar();
  analizarConFiltro();
}

function fdTiempo(fd) {
  if (tMinMin > 0)  fd.append('t_min', String(tMinMin * 60));
  if (tMaxMin < 90) fd.append('t_max', String(tMaxMin * 60));
  return fd;
}

async function analizarConFiltro({ mostrarStatus = false } = {}) {
  datosJugadores = null;
  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (mostrarStatus) {
    document.getElementById('status-bar').style.display = 'flex';
    document.getElementById('status-msg').textContent =
      archivosActuales.length === 1 ? `Analizando ${archivosActuales[0].name}...`
                                    : `Analizando ${archivosActuales.length} partidos...`;
    document.getElementById('results').innerHTML = '';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('drop-icon').textContent = '⏳';
  }

  if (!idxs.length) {
    datosActuales = null;
    document.getElementById('status-bar').style.display = 'none';
    document.getElementById('results').innerHTML =
      '<p style="color:var(--gris5);text-align:center;padding:2rem">Seleccioná al menos un partido.</p>';
    renderFiltroPartidos();
    return;
  }

  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fdTiempo(fd);

  try {
    const r = await fetch('/api/analizar', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok || data.error) { showError(data.error || 'Error'); document.getElementById('drop-icon').textContent = '❌'; return; }
    datosActuales = data;
    if (data.partidos && data.partidos.length === idxs.length) {
      idxs.forEach((origIdx, k) => { nombresPartidos[origIdx] = data.partidos[k]; });
    }
    document.getElementById('status-bar').style.display = 'none';
    document.getElementById('drop-icon').textContent = '✅';
    renderResultados(data);
    // Precarga del plantel + selección automática del jugador más destacado
    fetchJugadoresStats().then(ds => {
      if (!ds) return;
      datosJugadores = ds;
      if (!jugadorActivo) {
        jugadorActivo = jugadorDestacado(ds);
        const inp = document.getElementById('jug-select');
        if (inp && jugadorActivo) inp.value = jugadorActivo;
      }
      if (jugadorActivo) renderIndividual(jugadorActivo);
    });
  } catch(e) {
    showError('No se pudo conectar con el servidor. ¿Está corriendo app.py?');
    document.getElementById('drop-icon').textContent = '❌';
  }
}

function renderFiltroPartidos() {
  // Sólo re-pinta los checkboxes (sin recalcular). Útil cuando no hay datos.
  const cont = document.getElementById('part-filter');
  if (!cont) return;
  cont.querySelectorAll('input[type=checkbox]').forEach(b => {
    b.checked = partidosSel.has(parseInt(b.dataset.idx, 10));

}

function showError(msg) {
  document.getElementById('status-bar').style.display = 'none';
  const el = document.getElementById('error-box');
  el.textContent = '⚠ ' + msg; el.style.display = 'block';
}

async function exportarPDF(tipo) {
  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (!idxs.length) { alert('Seleccioná al menos un partido'); return; }
  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fdTiempo(fd);
  if (tipo === 'individual') {
    const sel = document.getElementById('jug-select');
    if (!sel || !sel.value) { alert('Seleccioná un jugador primero'); return; }
    fd.append('jugador', sel.value);
  }
  const url = tipo === 'colectivo' ? '/api/pdf/colectivo' : '/api/pdf/individual';
  const r = await fetch(url, { method: 'POST', body: fd });
  if (!r.ok) { alert('Error al generar PDF'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${tipo}_${(datosActuales?.partido||'partido').replace(/\s+/g,'_')}.pdf`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function switchTab(id, el) {
  tabActiva = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

function togglePartidos(on) {
  partidosSel = on ? new Set(archivosActuales.map((_, i) => i)) : new Set();

function onPartidoToggle() {
  partidosSel = new Set();
  document.querySelectorAll('#part-filter input[type=checkbox]').forEach(b => {
    if (b.checked) partidosSel.add(parseInt(b.dataset.idx, 10));
  });
  analizarConFiltro();
}

let comboHover = -1;

function comboAbrir() {
  comboFiltrar(document.getElementById('jug-select').value);
}

function comboCerrar() {
  document.getElementById('jug-combo-list')?.classList.remove('open');
  comboHover = -1;
}

function comboFiltrar(q) {
  const lista = document.getElementById('jug-combo-list');
  if (!lista || !datosActuales) return;
  const txt = (q || '').toLowerCase().trim();
  const todos = datosActuales.jugadores || [];
  const filtrados = txt ? todos.filter(j => j.toLowerCase().includes(txt)) : todos;
  comboHover = -1;
  if (!filtrados.length) {
    lista.innerHTML = '<div class="combo-empty">Sin coincidencias</div>';
  } else {
    lista.innerHTML = filtrados.map((j, i) =>
      `<div class="combo-item" data-jug="${j}" onmousedown="comboElegir('${j.replace(/'/g, "\\'")}')">${j}</div>`
    ).join('');
  }
  lista.classList.add('open');
}

function comboElegir(jugador) {
  document.getElementById('jug-select').value = jugador;
  comboCerrar();
  renderIndividual(jugador);
}

function comboTecla(e) {
  const lista = document.getElementById('jug-combo-list');
  const items = lista?.querySelectorAll('.combo-item') || [];
  if (e.key === 'ArrowDown') { e.preventDefault(); comboHover = Math.min(items.length - 1, comboHover + 1); pintarHover(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); comboHover = Math.max(0, comboHover - 1); pintarHover(items); }
  else if (e.key === 'Enter') { e.preventDefault(); if (comboHover >= 0 && items[comboHover]) comboElegir(items[comboHover].dataset.jug); }
  else if (e.key === 'Escape') comboCerrar();
}

function pintarHover(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === comboHover));
  if (comboHover >= 0) items[comboHover]?.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#jug-combo')) comboCerrar();
});

function renderIndividual(jugador) {
  if (!jugador || !datosActuales) return;
  jugadorActivo = jugador;

  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (!idxs.length) {
    document.getElementById('ind-content').innerHTML =
      '<p style="color:var(--gris5)">Seleccioná al menos un partido.</p>';
    return;
  }

  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fd.append('jugador', jugador);
  fdTiempo(fd);

  // Stats individuales + coordenadas en paralelo
  Promise.all([
    fetch('/api/individual',     { method: 'POST', body: fd }).then(r => r.json()),
    fetchCoordsJugador(jugador),
  ]).then(([ind, coords]) => {
    coordsActuales = coords || [];
    document.getElementById('ind-content').innerHTML = buildIndHTML(ind);
  }).catch(() => {
    coordsActuales = [];
    document.getElementById('ind-content').innerHTML = `<p style="color:var(--gris5)">Sin datos individuales disponibles para ${jugador}.</p>`;
  });
}

function jugadorDestacado(ds) {
  if (!ds) return '';
  const arr = Object.values(ds);
  if (!arr.length) return '';
  // Score: actividad + aporte ofensivo · sirve como "más destacado del partido"
  arr.sort((a, b) => {
    const sa = (a.intervenciones||0) + (a.goles||0)*15 + (a.asistencias||0)*8 + (a.pases_clave||0)*2;
    const sb = (b.intervenciones||0) + (b.goles||0)*15 + (b.asistencias||0)*8 + (b.pases_clave||0)*2;
    return sb - sa;
  });
  return arr[0].jugador;
}

async function fetchJugadoresStats() {
  const idxs = Array.from(partidosSel).sort((a,b)=>a-b);
  if (!idxs.length) return null;
  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fdTiempo(fd);
  try {
    const r = await fetch('/api/jugadores-stats', { method:'POST', body:fd });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

function sumarJugadores(lista) {
  const out = {};
  lista.forEach(j => {
    const st = datosJugadores[j];
    if (!st) return;
    Object.entries(st).forEach(([k,v]) => {
      if (typeof v === 'number') out[k] = (out[k]||0) + v;
    });
  });
  const pt = out.pases_total || 0;
  out.pases_efect = pt ? Math.round((out.pases_completos||0)/pt*100) : 0;
  return out;
}

function promediarJugadores(lista) {
  // Promedio por jugador — base honesta para comparar el grupo contra el plantel
  const n = lista.length;
  if (!n) return {};
  const suma = sumarJugadores(lista);
  const out = {};
  Object.entries(suma).forEach(([k, v]) => {
    if (typeof v === 'number') out[k] = Math.round((v / n) * 10) / 10;
  });
  // Para % la división simple sirve (es promedio de porcentajes)
  // Pero re-deriva efectividad de pase del agregado
  const pt = suma.pases_total || 0;
  out.pases_efect = pt ? Math.round((suma.pases_completos||0)/pt*100) : 0;
  // Reconstruir centro de gravedad y dispersión desde sumas crudas del grupo
  if (suma.acciones_xy) {
    out.centro_grav_x = Math.round(suma._sum_x / suma.acciones_xy * 10) / 10;
    out.centro_grav_y = Math.round(suma._sum_y / suma.acciones_xy * 10) / 10;
    const var_x = suma._sum_x2 / suma.acciones_xy - (suma._sum_x / suma.acciones_xy) ** 2;
    const var_y = suma._sum_y2 / suma.acciones_xy - (suma._sum_y / suma.acciones_xy) ** 2;
    out.dispersion_x = var_x > 0 ? Math.round(Math.sqrt(var_x) * 10) / 10 : 0;
    out.dispersion_y = var_y > 0 ? Math.round(Math.sqrt(var_y) * 10) / 10 : 0;
    out.pct_ultimo_tercio = Math.round((suma.acciones_ult3||0) / suma.acciones_xy * 100);
    out.pct_area = Math.round((suma.acciones_area||0) / suma.acciones_xy * 100);
  }
  if (suma.acciones_destino) {
    out.progresion_media = Math.round(suma._sum_prog / suma.acciones_destino * 10) / 10;
    out.distancia_media = Math.round(suma._sum_dist / suma.acciones_destino * 10) / 10;
    out.pct_progresivo = Math.round((suma.acciones_progresivas||0) / suma.acciones_destino * 100);
  }
  return out;
}

function dibujarScatter(jugadores) {
  const W = 700, H = 460, padL = 60, padR = 30, padT = 20, padB = 50;
  const xLab = METRICAS.find(m=>m[0]===xMetric)?.[1] || xMetric;
  const yLab = METRICAS.find(m=>m[0]===yMetric)?.[1] || yMetric;
  const pts = jugadores.map(j => ({
    nombre: j,
    x: Number(datosJugadores[j]?.[xMetric] || 0),
    y: Number(datosJugadores[j]?.[yMetric] || 0),
  }));
  const xMax = Math.max(1, ...pts.map(p=>p.x));
  const yMax = Math.max(1, ...pts.map(p=>p.y));
  const sx = v => padL + (v/xMax)*(W-padL-padR);
  const sy = v => H-padB - (v/yMax)*(H-padT-padB);
  const xAvg = pts.reduce((a,p)=>a+p.x,0)/pts.length;
  const yAvg = pts.reduce((a,p)=>a+p.y,0)/pts.length;

  const ticks = (max) => {
    const step = Math.ceil(max/5) || 1;
    const out = [];
    for (let v=0; v<=max; v+=step) out.push(v);
    return out;
  };

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="scatter-svg">`;
  // Grid + ticks X
  ticks(xMax).forEach(v => {
    const x = sx(v);
    svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H-padB}" stroke="#2a2a2a"/>`;
    svg += `<text x="${x}" y="${H-padB+14}" fill="#777" font-size="10" text-anchor="middle">${v}</text>`;
  });
  // Grid + ticks Y
  ticks(yMax).forEach(v => {
    const y = sy(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#2a2a2a"/>`;
    svg += `<text x="${padL-8}" y="${y+3}" fill="#777" font-size="10" text-anchor="end">${v}</text>`;
  });
  // Cuadrantes (medias)
  svg += `<line x1="${sx(xAvg)}" y1="${padT}" x2="${sx(xAvg)}" y2="${H-padB}" stroke="#f5a623" stroke-dasharray="4,4" opacity="0.5"/>`;
  svg += `<line x1="${padL}" y1="${sy(yAvg)}" x2="${W-padR}" y2="${sy(yAvg)}" stroke="#f5a623" stroke-dasharray="4,4" opacity="0.5"/>`;
  // Ejes
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#555"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#555"/>`;
  // Labels
  svg += `<text x="${(W+padL-padR)/2}" y="${H-10}" fill="#ccc" font-size="12" text-anchor="middle">${xLab}</text>`;
  svg += `<text x="${padL-45}" y="${(H+padT-padB)/2}" fill="#ccc" font-size="12" text-anchor="middle" transform="rotate(-90 ${padL-45} ${(H+padT-padB)/2})">${yLab}</text>`;
  // Puntos
  pts.forEach(p => {
    const cx = sx(p.x), cy = sy(p.y);
    svg += `<circle class="scatter-dot" cx="${cx}" cy="${cy}" r="5" fill="#CC0000" opacity="0.85"><title>${p.nombre}\n${xLab}: ${p.x}\n${yLab}: ${p.y}</title></circle>`;
    svg += `<text x="${cx+8}" y="${cy+3}" fill="#f5f5f5" font-size="10">${p.nombre}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function renderColContent() {
  const cont = document.getElementById('col-content');
  if (!cont) return;
  if (!datosJugadores) { cont.innerHTML = '<p style="color:var(--gris5)">Cargando...</p>'; return; }
  const seleccionados = Array.from(jugadoresSel).filter(j => datosJugadores[j]);
  if (!seleccionados.length) {
    cont.innerHTML = '<p style="color:var(--gris5)">Seleccioná al menos un jugador.</p>';
    return;
  }
  if (modoColectivo === 'suma') {
    if (!seleccionados.length) {
      cont.innerHTML = '<p style="color:var(--gris5)">Seleccioná al menos un jugador.</p>';
      return;
    }
    const sum = sumarJugadores(seleccionados);
    sum.jugador = `Colectivo · ${seleccionados.length} jugadores`;
    sum.condicion = `${seleccionados.length} jugadores`;
    sum.__promedio = promediarJugadores(seleccionados);
    sum.__esColectivo = true;
    sum.__seleccionados = seleccionados;
    cont.innerHTML = buildIndHTML(sum);
  } else {
    cont.innerHTML = renderCreadorGraficos(seleccionados);
  }
}

      <span style="font-size:10px;color:var(--gris5);margin-left:auto">Ordenado de mayor a menor</span>`;
  } else if (chartType === 'scatter') {
    metricsCtrl = `<span style="font-size:10px;color:var(--gris5)">X</span>
      <select onchange="xMetric=this.value;renderColContent()" style="${selStyle}">${metOpts(xMetric)}</select>
      <span style="font-size:10px;color:var(--gris5)">Y</span>

function presetJugadores(preset) {

  const todos = Object.keys(datosJugadores);
  if (preset === 'todos') {

    jugadoresSel = new Set();
  } else if (preset === 'titulares') {
    jugadoresSel = new Set(todos.filter(j => datosJugadores[j].condicion === 'Titular'));

    const ordenados = todos.slice().sort((a,b) => (datosJugadores[b].minutos||0) - (datosJugadores[a].minutos||0)).slice(0,5);
    jugadoresSel = new Set(ordenados);

  document.querySelectorAll('#jug-filter input[type=checkbox]').forEach(b => {

function dibujarBarras(jugadores, metric) {
  const lab = METRICAS.find(m=>m[0]===metric)?.[1] || metric;
  const data = jugadores.map(j => ({nombre:j, val: Number(datosJugadores[j]?.[metric]||0)}))
                       .sort((a,b) => b.val - a.val);
  const maxV = Math.max(1, ...data.map(d => d.val));
  return `
    <div class="bar-chart">
      <div class="bar-chart-title">${lab} · ${jugadores.length} jugadores</div>
      ${data.map(d => `
        <div class="bar-row-c">
          <div class="nombre">${d.nombre}</div>
          <div class="track"><div class="fill" style="width:${(d.val/maxV*100).toFixed(1)}%"></div></div>
          <div class="val">${d.val}</div>
        </div>`).join('')}
    </div>`;
}

function dibujarRadar(jugadores) {
  const W = 560, H = 540, cx = W/2, cy = H/2, R = 180;
  const metrics = radarMetrics;
  const n = metrics.length;
  const maxes = metrics.map(m => Math.max(1, ...jugadores.map(j => Number(datosJugadores[j]?.[m]||0))));
  const pt = (i, scale) => {
    const a = -Math.PI/2 + i*(2*Math.PI/n);
    return [cx + Math.cos(a)*R*scale, cy + Math.sin(a)*R*scale];
  };
  const colors = ['#CC0000', '#3ecf8e', '#f5a623', '#4a90d9', '#cc66ff'];
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="scatter-svg" style="max-width:560px;margin:0 auto;display:block">`;
  // Grid concéntrico
  [0.25, 0.5, 0.75, 1].forEach(s => {
    const pts = metrics.map((_,i) => pt(i, s).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="#2a2a2a"/>`;
  });
  // Ejes + labels
  metrics.forEach((m, i) => {
    const [x, y] = pt(i, 1);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3a3a3a"/>`;
    const lab = METRICAS.find(x=>x[0]===m)?.[1] || m;
    const [lx, ly] = pt(i, 1.18);
    svg += `<text x="${lx}" y="${ly+3}" fill="#ccc" font-size="10" text-anchor="middle">${lab}</text>`;
  });
  // Polígonos por jugador
  jugadores.forEach((j, idx) => {
    const c = colors[idx % colors.length];
    const pts = metrics.map((m, i) => pt(i, Number(datosJugadores[j]?.[m]||0) / maxes[i]).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="${c}" fill-opacity="0.18" stroke="${c}" stroke-width="2"/>`;
    metrics.forEach((m, i) => {
      const [px, py] = pt(i, Number(datosJugadores[j]?.[m]||0) / maxes[i]);
      svg += `<circle cx="${px}" cy="${py}" r="3" fill="${c}"/>`;
    });
  });
  // Leyenda
  jugadores.forEach((j, idx) => {
    const c = colors[idx % colors.length];
    svg += `<rect x="14" y="${14+idx*20}" width="12" height="12" fill="${c}" rx="2"/>`;
    svg += `<text x="32" y="${24+idx*20}" fill="#f5f5f5" font-size="11">${j}</text>`;
  });
  svg += '</svg>';
  return svg;
}

// ─── Motor de lectura textual ────────────────────────────────────────────
function lecturaEquipo(d) {
  const out = [];
  const c = d.colectivas;
  const lp = c.llegadas_prop, lr = c.llegadas_riv;
  const gp = c.goles_propios, gr = c.goles_rivales;
  const sp = c.salidas_prop, cp = c.centros_prop;

  // 1. Dominancia territorial
  if (lp.total && lr.total) {
    const ratio = lp.total / lr.total;
    if (ratio >= 1.5)
      out.push(`River <b>dominó territorialmente</b>: ${lp.total} llegadas contra ${lr.total} del rival.`);
    else if (ratio <= 0.7)
      out.push(`El rival fue <i>superior en generación</i> — ${lr.total} llegadas contra ${lp.total} de River.`);
    else
      out.push(`Partido <i>parejo en llegadas</i> (${lp.total} River — ${lr.total} rival).`);
  }

  // 2. Carril predominante
  const carriles = [['izquierda', lp.izq], ['eje', lp.eje], ['derecha', lp.der]];
  const totalCar = carriles.reduce((a,c) => a+c[1], 0);
  if (totalCar) {
    const ganador = carriles.sort((a,b) => b[1]-a[1])[0];
    const pct = Math.round(ganador[1]/totalCar*100);
    if (pct >= 45) out.push(`El equipo concentró el <b>${pct}%</b> de las llegadas por el carril <b>${ganador[0]}</b> (${ganador[1]} de ${totalCar}).`);
    else out.push(`Llegadas <i>distribuidas</i> entre los tres carriles (izq ${lp.izq}, eje ${lp.eje}, der ${lp.der}).`);
  }

  // 3. Tipo de juego
  const totalTipo = lp.asociado + lp.directo + lp.detenidas;
  if (totalTipo) {
    const aso = Math.round(lp.asociado/totalTipo*100);
    if (aso >= 60) out.push(`Predominó el <b>juego asociado</b> en las llegadas (${aso}%).`);
    else if (aso <= 30) out.push(`El equipo apostó al <b>juego directo</b> (sólo ${aso}% asociado).`);
  }

  // 4. Eficacia ofensiva
  if (c.sit_gol_prop) {
    if (gp.total) {
      const conv = Math.round(gp.total/c.sit_gol_prop*100);
      out.push(`Conversión de <b>${conv}%</b> — ${gp.total} goles en ${c.sit_gol_prop} situaciones de gol.`);
    } else {
      out.push(`Generó ${c.sit_gol_prop} situaciones de gol pero <i>no las concretó</i>.`);
    }
  }
  if (lp.total >= 5 && c.sit_gol_prop) {
    const gen = (c.sit_gol_prop / lp.total).toFixed(2);
    out.push(`Generación: <b>${gen}</b> situaciones de gol por cada llegada.`);
  }

  // 5. Balance defensivo
  if (c.recuperadas || c.perdidas) {
    const bal = c.recuperadas - c.perdidas;
    if (Math.abs(bal) >= 5) {
      const s = bal > 0 ? 'positivo' : 'negativo';
      out.push(`Balance <b>${s}</b> de balones: ${c.recuperadas} recuperadas vs ${c.perdidas} pérdidas (${bal > 0 ? '+' : ''}${bal}).`);
    }
  }

  // 6. Pelota parada
  if (cp.total) {
    const efc = cp.total ? Math.round(cp.completos/cp.total*100) : 0;
    if (efc >= 50) out.push(`Centros <b>eficientes</b>: ${cp.completos}/${cp.total} completados (${efc}%).`);
    else if (cp.total >= 5) out.push(`<i>Baja eficacia</i> de centros (${cp.completos}/${cp.total}, ${efc}%).`);
  }

  return out.slice(0, 7);
}

// Métricas a evaluar en el FODA. invert=true significa "menos es mejor".
const METRICAS_FODA = [
  { k: 'pases_efect',        l: 'Efectividad de pase',        minVal: 20, unidad: '%' },
  { k: 'pases_clave',        l: 'Pases clave',                minVal: 1 },
  { k: 'pases_filtrado',     l: 'Pases filtrados',            minVal: 1 },
  { k: 'pases_largo_c',      l: 'Pases largos completados',   minVal: 1 },
  { k: 'centros_c',          l: 'Centros completados',        minVal: 1 },
  { k: 'pct_progresivo',     l: '% acciones progresivas',     minVal: 8, unidad: '%' },
  { k: 'progresion_media',   l: 'Progresión media',           minVal: 2, unidad: 'm' },
  { k: 'pct_ultimo_tercio',  l: '% último tercio',            unidad: '%' },
  { k: 'pct_area',           l: '% área rival',               unidad: '%' },
  { k: 'toques_area',        l: 'Toques en área rival',       minVal: 1 },
  { k: 'remates_arco',       l: 'Remates al arco',            minVal: 1 },
  { k: 'goles',              l: 'Goles',                      minVal: 1 },
  { k: 'asistencias',        l: 'Asistencias',                minVal: 1 },
  { k: 'dao_plus',           l: '1v1 ofensivos ganados',      minVal: 1 },
  { k: 'dad_plus',           l: '1v1 defensivos ganados',     minVal: 1 },
  { k: 'recup_posic',        l: 'Recup. posicionales',        minVal: 2 },
  { k: 'recup_interv',       l: 'Recup. por intervención',    minVal: 1 },
  { k: 'intercepciones',     l: 'Intercepciones',             minVal: 1 },
  { k: 'bloqueos',           l: 'Bloqueos',                   minVal: 1 },
  { k: 'ruptura',            l: 'Rupturas en conducción',     minVal: 1 },
  { k: 'recep_lineas',       l: 'Recepciones entre líneas',   minVal: 1 },
  { k: 'recep_espacio',      l: 'Recepciones al espacio',     minVal: 1 },
  { k: 'perd_total',         l: 'Pérdidas',                   invert: true, minVal: 4 },
];

function _percentil(valor, valores) {
  // Devuelve percentil 0-100 (100 = mejor del plantel)
  const orden = [...valores].sort((a,b) => a-b);
  let pos = 0;
  for (let i = 0; i < orden.length; i++) { if (orden[i] <= valor) pos = i + 1; }
  return Math.round(pos / orden.length * 100);
}

function analisisFoda(ind, todos) {
  const fortalezas = [], debilidades = [];
  const oportunidades = [], amenazas = [];
  if (!todos) return { fortalezas, oportunidades, debilidades, amenazas, perfil: '' };

  // Filtrar plantel a los que tuvieron volumen (evita suplentes con 1 acción)
  const candidatos = Object.values(todos).filter(j => (j.intervenciones || 0) >= 8);
  if (candidatos.length < 4) return { fortalezas, oportunidades, debilidades, amenazas, perfil: '' };

  METRICAS_FODA.forEach(m => {
    const v = ind[m.k] || 0;
    const valores = candidatos.map(j => j[m.k] || 0);
    let pct = _percentil(v, valores);
    // Para métricas invertidas, "alto valor" es malo, así que invierto el percentil para que "100" siga siendo bueno
    if (m.invert) pct = 100 - pct;
    if (m.minVal != null && (m.invert ? v < m.minVal : v < m.minVal)) {
      // Si no tiene suficiente volumen, sólo se considera para destacar negativos
      if (m.invert && v >= m.minVal) {} // no aplica
      else if (!m.invert) return;
    }
    const display = v + (m.unidad || '');
    if (pct >= 80) fortalezas.push({ label: m.l, valor: display, pct });
    else if (pct <= 25) debilidades.push({ label: m.l, valor: display, pct });
  });

  fortalezas.sort((a,b) => b.pct - a.pct);
  debilidades.sort((a,b) => a.pct - b.pct);

  // ── OPORTUNIDADES: patrones de "casi" o "podría aprovechar" ────────────
  // Llega al último tercio pero remata poco
  if (ind.pct_ultimo_tercio >= 30 && ind.acciones_xy >= 15 && (ind.remates_arco || 0) <= 1) {
    oportunidades.push({ label: 'Llega al último tercio pero remata poco', valor: `${ind.remates_arco||0} rem.` });
  }
  // Aporta pases clave pero sin asistencias
  if ((ind.pases_clave || 0) >= 2 && (ind.asistencias || 0) === 0) {
    oportunidades.push({ label: 'Genera juego pero no concreta asistencia', valor: `${ind.pases_clave} clave` });
  }
  // Buena progresión pero centros bajos
  if ((ind.pct_progresivo || 0) >= 30 && (ind.centros_c || 0) === 0 && (ind.centros_i || 0) >= 2) {
    oportunidades.push({ label: 'Progresa bien pero falla todos los centros', valor: `${ind.centros_i} fallados` });
  }
  // Está en área rival pero no remata
  if ((ind.toques_area || 0) >= 3 && (ind.remates_arco || 0) === 0) {
    oportunidades.push({ label: 'Llega al área pero no define', valor: `${ind.toques_area} toques` });
  }
  // 1v1 ofensivos sin intentar
  if ((ind.pct_ultimo_tercio || 0) >= 25 && ((ind.dao_plus||0) + (ind.dao_minus||0)) === 0 && ind.acciones_xy >= 15) {
    oportunidades.push({ label: 'Juega arriba pero no encara al rival', valor: '0 duelos 1v1' });
  }

  // ── AMENAZAS: patrones de riesgo ────────────────────────────────────
  // Muchas pérdidas en zona baja
  if ((ind.perd_total || 0) >= 5 && (ind.centro_grav_x || 50) < 50) {
    amenazas.push({ label: 'Concentra pérdidas en zona propia', valor: `${ind.perd_total} pérd.` });
  }
  // Pierde duelos defensivos
  const dad = (ind.dad_plus||0) + (ind.dad_minus||0);
  if (dad >= 3 && (ind.dad_minus||0) > (ind.dad_plus||0)) {
    const pctP = Math.round((ind.dad_minus||0)/dad*100);
    amenazas.push({ label: 'Pierde duelos defensivos', valor: `${ind.dad_minus}/${dad} (${pctP}%)` });
  }
  // Pierde duelos ofensivos
  const dao = (ind.dao_plus||0) + (ind.dao_minus||0);
  if (dao >= 3 && (ind.dao_minus||0) > (ind.dao_plus||0) * 1.5) {
    amenazas.push({ label: 'Mal rendimiento en 1v1 ofensivos', valor: `${ind.dao_plus}/${dao}` });
  }
  // Baja efectividad de pase con volumen
  if ((ind.pases_total||0) >= 30 && (ind.pases_efect||0) < 60) {
    amenazas.push({ label: 'Baja efectividad con alto volumen de pase', valor: `${ind.pases_efect}%` });
  }
  // Muchos pases laterales/atrás vs adelante (juego conservador)
  const lateral_atras = (ind.pases_lateral||0) + (ind.pases_atras||0);
  if ((ind.pases_adelante||0) >= 1 && lateral_atras > (ind.pases_adelante||0) * 2.5 && (ind.pases_total||0) >= 20) {
    amenazas.push({ label: 'Juego conservador (pocos pases hacia adelante)', valor: `${ind.pases_adelante} adelante vs ${lateral_atras} atrás/lateral` });
  }

  // ── PERFIL CORTO ────────────────────────────────────────────────────
  let perfil = '';
  if (ind.acciones_xy >= 10) {
    const x = ind.centro_grav_x, y = ind.centro_grav_y;
    const dx = ind.dispersion_x, dy = ind.dispersion_y;
    let z = x >= 80 ? 'muy adelantado' : x >= 60 ? 'en zona alta-media' : x >= 40 ? 'en zona media' : 'en zona baja';
    let m = (dx >= 25 || dy >= 22) ? ', con alta movilidad' : (dx <= 15 && dy <= 12) ? ', con posicionamiento estático' : '';
    perfil = `Operó ${z} (CG ${x}, ${y})${m}. ${ind.intervenciones} intervenciones en ${ind.minutos} min.`;
  }

  return {
    fortalezas: fortalezas.slice(0, 4),
    debilidades: debilidades.slice(0, 4),
    oportunidades: oportunidades.slice(0, 3),
    amenazas: amenazas.slice(0, 3),
    perfil,
  };
}

function renderEficiencia(col) {
  const lp = col.llegadas_prop, gp = col.goles_propios, cp = col.centros_prop;
  const tot = lp.total || 0;
  const sg = col.sit_gol_prop || 0;
  const goles = gp.total || 0;
  const conv  = sg ? Math.round(goles / sg * 100) : 0;
  const gen   = tot ? Math.round(sg / tot * 100) : 0;
  const efRem = tot ? Math.round(lp.tiros_arco / tot * 100) : 0;
  const efCen = cp.total ? Math.round(cp.completos / cp.total * 100) : 0;
  const cards = [
    { l: 'Conversión',          v: conv + '%',  sub: `${goles} gol${goles!==1?'es':''} / ${sg} sit. gol`,    color: conv >= 25 ? 'green' : conv >= 12 ? 'amber' : 'red' },
    { l: 'Generación',          v: gen  + '%',  sub: `${sg} sit. gol / ${tot} llegadas`,                    color: gen  >= 30 ? 'green' : gen  >= 15 ? 'amber' : 'red' },
    { l: 'Remate al arco',      v: efRem+ '%',  sub: `${lp.tiros_arco} al arco / ${tot} llegadas`,          color: efRem>= 40 ? 'green' : efRem>= 25 ? 'amber' : 'red' },
    { l: 'Centros completados', v: efCen+ '%',  sub: `${cp.completos}/${cp.total||0} centros`,              color: efCen>= 40 ? 'green' : efCen>= 25 ? 'amber' : 'red' },
  ];
  return `<div class="efic-grid">${cards.map(c => `
    <div class="efic-card">
      <div class="efic-label">${c.l}</div>
      <div class="efic-val ${c.color}">${c.v}</div>
      <div class="efic-sub">${c.sub}</div>
    </div>`).join('')}</div>`;
}

function renderMatriz(titulo, mat, ordenFilas, ordenCols) {
  if (!mat || !Object.keys(mat).length) return '';
  // Conservar orden definido y filtrar las filas/cols presentes
  const filas = ordenFilas.filter(f => mat[f]);
  const cols = ordenCols.filter(c => filas.some(f => mat[f][c]));
  if (!filas.length || !cols.length) return '';
  // Total para porcentajes y coloreado
  let total = 0;
  filas.forEach(f => cols.forEach(c => { total += (mat[f][c] || 0); }));
  let max = 0;
  filas.forEach(f => cols.forEach(c => { max = Math.max(max, mat[f][c] || 0); }));

  let html = `<div class="matriz-wrap">
    <div class="sec-title red" style="margin-top:0">${titulo}</div>
    <table class="matriz">
      <tr><th></th>${cols.map(c => `<th>${c}</th>`).join('')}<th style="opacity:.6">Total</th></tr>`;
  filas.forEach(f => {
    const filaTotal = cols.reduce((a,c) => a + (mat[f][c]||0), 0);
    html += `<tr><th class="row-head">${f}</th>`;
    cols.forEach(c => {
      const v = mat[f][c] || 0;
      const pct = total ? Math.round(v/total*100) : 0;
      const intensity = max ? v/max : 0;
      const bg = v ? `rgba(204,0,0,${0.12 + intensity*0.55})` : 'var(--gris2)';
      html += `<td style="background:${bg}"><span class="v">${v}</span><span class="p">${pct ? pct+'%' : ''}</span></td>`;
    });
    html += `<td style="opacity:.7"><span class="v">${filaTotal}</span></td></tr>`;
  });
  html += `</table></div>`;
  return html;
}

function _describirAccion(tagsStr) {
  if (!tagsStr) return 'Acción';
  const t = tagsStr.split(',').map(x => x.trim());
  const has = (...xs) => xs.every(x => t.includes(x));
  const any = (...xs) => xs.some(x => t.includes(x));
  if (t.includes('Gol')) return '⚽ Gol';
  if (any('Arco') && any('Tiros'))    return 'Remate al arco';
  if (t.includes('Afuera'))            return 'Remate afuera';
  if (t.includes('Bloqueado'))         return 'Remate bloqueado';
  if (t.includes('PCompletos')) {
    const x = [];
    if (t.includes('Adelante')) x.push('adelante');
    if (t.includes('Atras'))    x.push('atrás');
    if (t.includes('Lateral'))  x.push('lateral');
    if (t.includes('Largo Completo')) x.push('largo');
    if (t.includes('Filtrado')) x.push('filtrado');
    if (t.includes('Clave'))    x.push('clave');
    return 'Pase completo' + (x.length ? ` (${x.join(', ')})` : '');
  }
  if (t.includes('PIncompletos')) return 'Pase incompleto' + (t.includes('Largo Incompleto') ? ' (largo)' : '');
  if (t.includes('CCompletos'))   return 'Centro completo' + (t.includes('CAsistencia') ? ' (asistencia)' : '');
  if (t.includes('CIncompletos')) return 'Centro fallado';
  if (t.includes('1v1O+')) return '1v1 ofensivo ganado';
  if (t.includes('1v1O-')) return '1v1 ofensivo perdido';
  if (t.includes('1v1D+')) return '1v1 defensivo ganado';
  if (t.includes('1v1D-')) return '1v1 defensivo perdido';
  if (t.includes('DAO+')) return 'Duelo aéreo of. ganado';
  if (t.includes('DAO-')) return 'Duelo aéreo of. perdido';
  if (t.includes('DAD+')) return 'Duelo aéreo def. ganado';
  if (t.includes('DAD-')) return 'Duelo aéreo def. perdido';
  if (t.includes('R+')) return 'Regate completado';
  if (t.includes('R-')) return 'Regate fallado';
  if (t.some(x => x.startsWith('RECUPERACION'))) {
    if (t.includes('RECUPERACION xIntervencion')) return 'Recuperación por intervención';
    if (t.includes('RECUPERACION xPosicional'))    return 'Recuperación posicional';
    if (t.includes('Tras Perdida')) return 'Recuperación tras pérdida';
    return 'Recuperación';
  }
  if (t.some(x => x.startsWith('PERDIDAS'))) {
    if (t.includes('PERDIDAS: xPase')) return 'Pérdida por pase';
    if (t.includes('PERDIDAS: xControl')) return 'Pérdida por control';
    if (t.includes('PERDIDAS: xGambeta')) return 'Pérdida por gambeta';
    return 'Pérdida';
  }
  if (t.includes('Intervencion Defensiva')) {
    if (t.includes('E+')) return 'Entrada exitosa';
    if (t.includes('E-')) return 'Entrada fallada';
    if (t.includes('A+')) return 'Anticipo logrado';
    if (any('I+','I-')) return 'Intercepción';
    if (any('B+','B-')) return 'Bloqueo';
    return 'Intervención defensiva';
  }
  if (t.includes('Despeje')) return 'Despeje' + (t.includes('D+') ? ' orientado' : '');
  if (t.includes('Toques en Area Rival')) return 'Toque en área rival';
  if (t.includes('Recepcion entre Lineas')) return 'Recepción entre líneas';
  if (t.includes('Recepcion al espacio')) return 'Recepción al espacio';
  if (t.includes('Recepcion a espaldas del volante')) return 'Recepción a espaldas del vol.';
  if (t.includes('Ruptura en conduccion')) return 'Ruptura en conducción';
  if (t.includes('Faltas Hechas')) return 'Falta hecha';
  if (t.includes('Faltas Recibidas')) return 'Falta recibida';
  const ignorar = new Set(['POSITIVO','NEGATIVO','Asociado','Directo','Adelante','Atras','Lateral','Apoyo']);
  return t.find(x => x && !ignorar.has(x)) || 'Acción';
}

function _outcomeAccion(tagsStr) {
  // 'neg' = pase/centro fallado, remate afuera/bloqueado, pérdida, duelo perdido
  // 'pos' = completos, ganados, recuperaciones, recepciones, toques (acciones registradas exitosas)
  if (!tagsStr) return 'pos';
  const t = tagsStr.split(',').map(x => x.trim());
  const neg = ['PIncompletos','CIncompletos','1v1O-','1v1D-','DAO-','DAD-','R-',
               'E-','A-','NEGATIVO','Afuera','Bloqueado','Incompleto','Largo Incompleto'];
  if (neg.some(n => t.includes(n))) return 'neg';
  if (t.some(x => x.startsWith('PERDIDAS'))) return 'neg';
  return 'pos';
}

function _rivalDePartido(timeline) {
  if (!timeline) return 'rival';
  const m = timeline.match(/vs\.?\s+(.+?)$/i);
  return m ? m[1].trim() : timeline.trim();
}

function _formatMin(s) {
  const m = Math.floor(s/60);
  const sec = Math.round(s % 60);
  return `${m}'${String(sec).padStart(2,'0')}"`;
}

function _tituloAccion(a) {
  const acc = _describirAccion(a.tags);
  const rival = _rivalDePartido(a.partido);
  const min = _formatMin(a.t);
  return `${acc} · vs ${rival} · ${min}`;
}

function dibujarCancha(acciones, modo = 'calor') {
  // Nacsport: y crece hacia un lado y el SVG hacia el otro — invertimos para
  // que las acciones de los laterales caigan en su carril correcto.
  acciones = acciones.map(a => ({
    ...a,
    y:  80 - a.y,
    ye: a.ye != null ? 80 - a.ye : null,
  }));
  const cellW = 10, cellH = 10;
  let svg = `<svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMid meet" class="pitch-svg">`;
  // Fondo
  svg += `<rect width="120" height="80" fill="#141414"/>`;

  if (modo === 'calor' || modo === 'flechas') {
    // Heatmap binning
    const bins = {};
    acciones.forEach(a => {
      if (a.x == null || a.y == null) return;
      const cx = Math.min(11, Math.max(0, Math.floor(a.x / cellW)));
      const cy = Math.min(7,  Math.max(0, Math.floor(a.y / cellH)));
      bins[`${cx},${cy}`] = (bins[`${cx},${cy}`] || 0) + 1;
    });
    const maxV = Math.max(1, ...Object.values(bins));
    Object.entries(bins).forEach(([k, count]) => {
      const [cx, cy] = k.split(',').map(Number);
      const ratio = count / maxV;
      const op = 0.12 + ratio * 0.65;
      svg += `<rect x="${cx*cellW}" y="${cy*cellH}" width="${cellW}" height="${cellH}" fill="#CC0000" opacity="${op}"/>`;
    });
  }

  // Líneas de cancha
  svg += _pitchLines();

  const escAttr = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  if (modo === 'puntos') {
    acciones.forEach(a => {
      const out = _outcomeAccion(a.tags);
      const color = out === 'neg' ? '#CC0000'
                  : a.area        ? '#f5a623'
                  :                 '#3ecf8e';
      svg += `<g data-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
             `<circle cx="${a.x}" cy="${a.y}" r="3" fill="transparent"/>` +
             `<circle cx="${a.x}" cy="${a.y}" r="1.1" fill="${color}" opacity="0.85"/>` +
             `</g>`;
    });
  } else if (modo === 'flechas') {
    acciones.filter(a => a.prog && a.xe != null && a.ye != null).forEach(a => {
      const out = _outcomeAccion(a.tags);
      const destEnArea = a.xe >= 102 && a.ye >= 18 && a.ye <= 62;
      const color = out === 'neg' ? '#CC0000'
                  : destEnArea    ? '#f5a623'
                  :                 '#3ecf8e';
      svg += `<g data-tip="${escAttr(_tituloAccion(a))}" style="cursor:default">` +
             `<line x1="${a.x}" y1="${a.y}" x2="${a.xe}" y2="${a.ye}" stroke="${color}" stroke-width="0.6" opacity="0.5"/>` +
             `<line x1="${a.x}" y1="${a.y}" x2="${a.xe}" y2="${a.ye}" stroke="${color}" stroke-width="0.4" opacity="0.9"/>` +
             `<circle cx="${a.xe}" cy="${a.ye}" r="0.9" fill="${color}" opacity="0.98"/>` +
             `<circle cx="${a.x}" cy="${a.y}" r="2.5" fill="transparent"/>` +
             `</g>`;
    });
  }

  svg += '</svg>';
  return svg;
}

function setPitchModo(m) {
  pitchModo = m;
  const cont = document.getElementById('pitch-container');
  if (cont) cont.innerHTML = dibujarCancha(coordsActuales, m);
  document.querySelectorAll('.pitch-modos button').forEach((b, i) => {
    b.classList.toggle('active',
      (i === 0 && m === 'calor') || (i === 1 && m === 'puntos') || (i === 2 && m === 'flechas'));
  });
}

async function fetchCoordsJugador(jugador) {
  const idxs = Array.from(partidosSel).sort((a,b)=>a-b);

  const fd = new FormData();

  try {
    const r = await fetch('/api/coords-jugador', { method: 'POST', body: fd });
    return r.ok ? await r.json() : [];
