<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Plate · Videoanálisis</title>
  <style>
    :root {
      --rojo:    #CC0000;
      --rojo2:   #990000;
      --negro:   #0a0a0a;
      --gris1:   #141414;
      --gris2:   #1e1e1e;
      --gris3:   #2a2a2a;
      --gris4:   #3a3a3a;
      --gris5:   #555;
      --grisc:   #ccc;
      --blanco:  #f5f5f5;
      --verde:   #3ecf8e;
      --ambar:   #f5a623;
      --azul:    #4a90d9;
      --r: var(--border-radius-md, 8px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--negro);
      color: var(--blanco);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--gris1);
      border-bottom: 3px solid var(--rojo);
      padding: 0 1.5rem;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-img { height: 42px; filter: drop-shadow(0 0 6px rgba(204,0,0,0.4)); }
    .brand { display: flex; flex-direction: column; }
    .brand-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
    .brand-sub { font-size: 10px; color: var(--gris5); letter-spacing: 1px; text-transform: uppercase; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    /* MAIN */
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* DROP ZONE */
    #drop-zone {
      border: 1.5px dashed var(--gris4);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--rojo);
      background: rgba(204,0,0,0.05);
    }
    #drop-zone input { display: none; }
    .drop-icon { font-size: 32px; margin-bottom: 10px; display: block; }
    .drop-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
    .drop-sub { color: var(--gris5); font-size: 12px; }

    /* BTN */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 6px;
      border: 1px solid var(--gris4);
      background: var(--gris3); color: var(--blanco);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background .15s, border-color .15s; text-decoration: none;
    }
    .btn:hover { background: var(--gris4); border-color: var(--gris5); }
    .btn-red { background: var(--rojo); border-color: var(--rojo); }
    .btn-red:hover { background: var(--rojo2); }
    .btn-outline { background: transparent; border-color: var(--rojo); color: var(--rojo); }
    .btn-outline:hover { background: rgba(204,0,0,0.1); }
    .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

    /* STATUS */
    #status-bar {
      display: none; align-items: center; gap: 10px;
      margin-top: 1.2rem; padding: 10px 14px;
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 6px; font-size: 12px; color: var(--gris5);
    }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--gris4);
      border-top-color: var(--rojo); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULTADOS */
    #results { margin-top: 2rem; }

    .partido-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem;
    }
    .partido-title { font-size: 18px; font-weight: 700; }
    .partido-title span { color: var(--rojo); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* SCORE */
    .score-box {
      background: var(--gris2); border-radius: 10px;
      border: 1px solid var(--gris4);
      display: flex; align-items: center; justify-content: center;
      gap: 2rem; padding: 1.2rem 2rem;
      margin-bottom: 1.5rem;
    }
    .score-team { text-align: center; }
    .score-name { font-size: 10px; color: var(--gris5); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .score-num { font-size: 52px; font-weight: 800; line-height: 1; }
    .score-num.river { color: var(--rojo); }
    .score-num.rival { color: var(--grisc); }
    .score-sep { font-size: 28px; color: var(--gris4); }

    /* METRIC GRID */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px; margin-bottom: 1.2rem;
    }
    .metric-card {
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 8px; padding: 12px 14px;
    }
    .metric-label { font-size: 10px; color: var(--gris5); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
    .metric-val { font-size: 24px; font-weight: 700; }
    .metric-val.red { color: var(--rojo); }
    .metric-val.green { color: var(--verde); }
    .metric-val.amber { color: var(--ambar); }

    /* TABS */
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--gris4); margin-bottom: 1.5rem; overflow-x: auto; }
    .tab {
      padding: 8px 16px; font-size: 12px; font-weight: 500;
      color: var(--gris5); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      white-space: nowrap; transition: color .15s;
    }
    .tab:hover { color: var(--blanco); }
    .tab.active { color: var(--rojo); border-bottom-color: var(--rojo); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* SECTION TITLE */
    .sec-title {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--gris5);
      margin: 1rem 0 .6rem;
    }
    .sec-title.red { color: var(--rojo); }

    /* COMPARISON ROWS */
    .compare-table { width: 100%; border-collapse: collapse; }
    .compare-table td { padding: 5px 8px; font-size: 12px; }
    .compare-row { border-bottom: 1px solid var(--gris3); }
    .compare-row:hover { background: var(--gris2); }
    .compare-label { text-align: center; color: var(--grisc); font-size: 11px; }
    .compare-val { font-weight: 700; font-size: 14px; }
    .compare-val.river { color: var(--rojo); text-align: right; }
    .compare-val.rival { text-align: left; }

    /* BAR COMPARE */
    .bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .bar-label { font-size: 10px; color: var(--gris5); min-width: 120px; text-align: right; }
    .bar-track { flex: 1; height: 8px; background: var(--gris3); border-radius: 4px; overflow: hidden; position: relative; }
    .bar-fill-river { height: 100%; background: var(--rojo); border-radius: 4px; transition: width .4s; }
    .bar-fill-rival { height: 100%; background: var(--gris5); border-radius: 4px; transition: width .4s; }
    .bar-val { font-size: 11px; font-weight: 700; min-width: 22px; }
    .bar-val.river { color: var(--rojo); }

    /* MINI GRID */
    .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: .8rem; }
    .mini-card { background: var(--gris2); border: 1px solid var(--gris4); border-radius: 6px; padding: 8px; text-align: center; }
    .mini-label { font-size: 9px; color: var(--gris5); text-transform: uppercase; margin-bottom: 3px; }
    .mini-val { font-size: 18px; font-weight: 700; }

    /* GOLES */
    .gol-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: var(--gris2);
      border: 1px solid var(--gris4); border-radius: 6px; margin-bottom: 6px;
    }
    .gol-min { font-size: 12px; font-weight: 700; color: var(--rojo); min-width: 44px; }
    .gol-eq { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .gol-eq.river { background: rgba(204,0,0,.2); color: var(--rojo); }
    .gol-eq.rival { background: var(--gris3); color: var(--grisc); }
    .gol-info { flex: 1; }
    .gol-tipo { font-size: 10px; color: var(--gris5); }
    .gol-carril { font-weight: 600; }

    /* CAMBIOS */
    .cambio-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: var(--gris2);
      border: 1px solid var(--gris4); border-radius: 6px; margin-bottom: 6px;
    }
    .cambio-min { font-size: 12px; font-weight: 700; color: var(--rojo); min-width: 44px; }
    .cambio-sale { color: #ff6666; font-weight: 500; }
    .cambio-entra { color: #66ff99; font-weight: 500; }
    .cambio-eq { font-size: 9px; color: var(--gris5); margin-left: auto; }

    /* MINUTOS */
    .min-jugador {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 5px;
    }
    .min-nombre { font-size: 11px; min-width: 130px; font-weight: 500; }
    .min-track { flex: 1; height: 10px; background: var(--gris3); border-radius: 5px; overflow: hidden; }
    .min-fill { height: 100%; border-radius: 5px; }
    .min-fill.titular { background: var(--rojo); }
    .min-fill.suplente { background: var(--gris5); }
    .min-tiempo { font-size: 11px; color: var(--gris5); min-width: 36px; text-align: right; }
    .min-cond { font-size: 9px; padding: 1px 6px; border-radius: 10px; }
    .min-cond.titular { background: rgba(204,0,0,.2); color: var(--rojo); }
    .min-cond.suplente { background: var(--gris3); color: var(--gris5); }

    /* INDIVIDUAL */
    .ind-selector {
      display: flex; gap: 8px; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .ind-selector label { font-size: 12px; color: var(--gris5); }
    .ind-selector select {
      padding: 6px 10px; background: var(--gris2); border: 1px solid var(--gris4);
      color: var(--blanco); border-radius: 6px; font-size: 12px;
    }

    /* IND stats */
    .ind-header {
      background: var(--gris2); border: 1px solid var(--gris4);
      border-radius: 10px; padding: 1rem 1.2rem;
      display: flex; gap: 16px; align-items: center; margin-bottom: 1rem;
    }
    .ind-nombre { font-size: 20px; font-weight: 800; }
    .ind-sub { font-size: 11px; color: var(--gris5); margin-top: 3px; }
    .ind-kpis { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
    .kpi { text-align: center; }
    .kpi-val { font-size: 22px; font-weight: 800; }
    .kpi-val.red { color: var(--rojo); }
    .kpi-val.amber { color: var(--ambar); }
    .kpi-val.blue { color: var(--azul); }
    .kpi-label { font-size: 9px; color: var(--gris5); text-transform: uppercase; }

    .ind-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .ind-block { background: var(--gris2); border: 1px solid var(--gris4); border-radius: 8px; padding: 10px 12px; }
    .ind-block-title { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--rojo); margin-bottom: 8px; border-bottom: 1px solid var(--gris4); padding-bottom: 4px; }
    .ind-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--gris3); }
    .ind-row:last-child { border-bottom: none; }
    .ind-row-label { font-size: 10px; color: var(--grisc); }
    .ind-row-val { font-size: 13px; font-weight: 700; }
    .ind-row-val.red { color: var(--rojo); }
    .ind-row-val.green { color: var(--verde); }
    .ind-row-val.amber { color: var(--ambar); }

    .efect-bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .efect-pct { font-size: 26px; font-weight: 800; }
    .efect-track { flex: 1; height: 8px; background: var(--gris3); border-radius: 4px; overflow: hidden; }
    .efect-fill { height: 100%; border-radius: 4px; }

    .part-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 14px;
      background: var(--gris2); border: 1px solid var(--gris4);
      font-size: 11px; cursor: pointer; user-select: none;
    }
    .part-chip input { accent-color: var(--rojo); cursor: pointer; }
    .part-chip:has(input:not(:checked)) { opacity: 0.45; }
    .part-chip:hover { border-color: var(--rojo); }

    .error-box { background: rgba(204,0,0,.1); border: 1px solid var(--rojo); border-radius: 6px; padding: 10px 14px; color: var(--rojo); font-size: 12px; margin-top: 1rem; }
  </style>
</head>
<body>

<header>
  <img src="/static/logo.png" class="logo-img" alt="River Plate">
  <div class="brand">
    <div class="brand-title">Área de Videoanálisis</div>
    <div class="brand-sub">Fútbol Formativo · CARP</div>
  </div>
</header>

<main>
  <div id="drop-zone"
       onclick="document.getElementById('fi').click()"
       ondragover="ev(event,'over')" ondragleave="ev(event,'leave')" ondrop="ev(event,'drop')">
    <input type="file" id="fi" accept=".csv,.xlsx,.xls" multiple onchange="procesar(this.files)">
    <span class="drop-icon" id="drop-icon">📂</span>
    <div class="drop-title">Seleccioná o arrastrá uno o varios exports de Sportcode</div>
    <div class="drop-sub">CSV o XLSX · arrastrá múltiples partidos para acumular estadísticas</div>
  </div>

  <div id="status-bar">
    <div class="spinner"></div>
    <span id="status-msg">Procesando...</span>
  </div>
  <div id="cache-bar" style="display:none;margin-top:.6rem;font-size:11px;color:var(--gris5);align-items:center;gap:8px">
    <span>💾 <span id="cache-info"></span></span>
    <button class="btn" style="padding:3px 8px;font-size:10px" onclick="borrarCache()">Borrar guardados</button>
  </div>
  <div id="error-box" class="error-box" style="display:none;"></div>
  <div id="results"></div>
</main>

<script>
let archivosActuales = [];
let datosActuales = null;
let nombresPartidos = [];
let partidosSel = new Set();
let tabActiva = 'comparativa';
let jugadorActivo = '';

const STORAGE_KEY = 'river_csvs_v1';

function fileToB64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

function b64ToFile(dataUrl, name) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/data:(.*?);base64/) || [, 'text/csv'])[1];
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new File([buf], name, { type: mime });
}

async function guardarEnCache(files) {
  try {
    const arr = await Promise.all(Array.from(files).map(async f => ({
      name: f.name,
      data: await fileToB64(f),
    })));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    actualizarBarraCache();
  } catch (e) {
    console.warn('No se pudo guardar en cache:', e);
  }
}

function cargarDeCache() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return arr.map(o => b64ToFile(o.data, o.name));
  } catch { return []; }
}

function actualizarBarraCache() {
  const bar = document.getElementById('cache-bar');
  const info = document.getElementById('cache-info');
  if (archivosActuales.length) {
    bar.style.display = 'flex';
    info.textContent = `${archivosActuales.length} archivo(s) guardado(s) en este navegador`;
  } else {
    bar.style.display = 'none';
  }
}

function borrarCache() {
  localStorage.removeItem(STORAGE_KEY);
  archivosActuales = [];
  partidosSel = new Set();
  datosActuales = null;
  jugadorActivo = '';
  nombresPartidos = [];
  tabActiva = 'comparativa';
  document.getElementById('results').innerHTML = '';
  document.getElementById('drop-icon').textContent = '📂';
  actualizarBarraCache();
}

window.addEventListener('DOMContentLoaded', () => {
  const stored = cargarDeCache();
  if (stored.length) procesar(stored, { fromCache: true });
});

function ev(e, tipo) {
  e.preventDefault();
  const dz = document.getElementById('drop-zone');
  if (tipo === 'over') dz.classList.add('drag-over');
  else if (tipo === 'leave') dz.classList.remove('drag-over');
  else { dz.classList.remove('drag-over'); if (e.dataTransfer.files.length) procesar(e.dataTransfer.files); }
}

async function procesar(files, opts = {}) {
  const lista = Array.from(files || []);
  if (!lista.length) return;
  archivosActuales = lista;
  partidosSel = new Set(lista.map((_, i) => i));
  nombresPartidos = lista.map(f => f.name.replace(/\.(csv|xlsx|xls)$/i, ''));
  tabActiva = 'comparativa';
  jugadorActivo = '';
  if (!opts.fromCache) guardarEnCache(lista);
  actualizarBarraCache();
  await analizarConFiltro({ mostrarStatus: true });
}

async function analizarConFiltro({ mostrarStatus = false } = {}) {
  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (mostrarStatus) {
    document.getElementById('status-bar').style.display = 'flex';
    document.getElementById('status-msg').textContent =
      archivosActuales.length === 1 ? `Analizando ${archivosActuales[0].name}...`
                                    : `Analizando ${archivosActuales.length} partidos...`;
    document.getElementById('results').innerHTML = '';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('drop-icon').textContent = '⏳';
  }

  if (!idxs.length) {
    datosActuales = null;
    document.getElementById('status-bar').style.display = 'none';
    document.getElementById('results').innerHTML =
      '<p style="color:var(--gris5);text-align:center;padding:2rem">Seleccioná al menos un partido.</p>';
    renderFiltroPartidos();
    return;
  }

  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));

  try {
    const r = await fetch('/api/analizar', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok || data.error) { showError(data.error || 'Error'); document.getElementById('drop-icon').textContent = '❌'; return; }
    datosActuales = data;
    if (data.partidos && data.partidos.length === idxs.length) {
      idxs.forEach((origIdx, k) => { nombresPartidos[origIdx] = data.partidos[k]; });
    }
    document.getElementById('status-bar').style.display = 'none';
    document.getElementById('drop-icon').textContent = '✅';
    renderResultados(data);
  } catch(e) {
    showError('No se pudo conectar con el servidor. ¿Está corriendo app.py?');
    document.getElementById('drop-icon').textContent = '❌';
  }
}

function renderFiltroPartidos() {
  // Sólo re-pinta los checkboxes (sin recalcular). Útil cuando no hay datos.
  const cont = document.getElementById('part-filter');
  if (!cont) return;
  cont.querySelectorAll('input[type=checkbox]').forEach(b => {
    b.checked = partidosSel.has(parseInt(b.dataset.idx, 10));
  });
}

function showError(msg) {
  document.getElementById('status-bar').style.display = 'none';
  const el = document.getElementById('error-box');
  el.textContent = '⚠ ' + msg; el.style.display = 'block';
}

async function exportarPDF(tipo) {
  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (!idxs.length) { alert('Seleccioná al menos un partido'); return; }
  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  if (tipo === 'individual') {
    const sel = document.getElementById('jug-select');
    if (!sel || !sel.value) { alert('Seleccioná un jugador primero'); return; }
    fd.append('jugador', sel.value);
  }
  const url = tipo === 'colectivo' ? '/api/pdf/colectivo' : '/api/pdf/individual';
  const r = await fetch(url, { method: 'POST', body: fd });
  if (!r.ok) { alert('Error al generar PDF'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${tipo}_${(datosActuales?.partido||'partido').replace(/\s+/g,'_')}.pdf`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function switchTab(id, el) {
  tabActiva = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

function renderResultados(d) {
  const { partido, jugadores, colectivas: col, minutos, cambios, goles } = d;
  const gp = col.goles_propios;
  const gr = col.goles_rivales;
  const lp = col.llegadas_prop;
  const lr = col.llegadas_riv;
  const sp = col.salidas_prop;
  const sr = col.salidas_riv;
  const cp = col.centros_prop;
  const cr = col.centros_riv;

  function bar(val, max, cls) {
    const pct = max > 0 ? Math.min(100, Math.round(val/max*100)) : 0;
    return `<div class="bar-fill-${cls}" style="width:${pct}%"></div>`;
  }

  function compareRow(label, vr, vv) {
    const tot = (vr||0)+(vv||0);
    const pr = tot>0 ? Math.round((vr||0)/tot*100) : 50;
    return `<div class="bar-row">
      <span class="bar-val river">${vr||0}</span>
      <div class="bar-track" style="flex:1">
        <div class="bar-fill-river" style="width:${pr}%"></div>
      </div>
      <span style="font-size:10px;color:var(--gris5);min-width:140px;text-align:center">${label}</span>
      <div class="bar-track" style="flex:1">
        <div class="bar-fill-rival" style="width:${100-pr}%"></div>
      </div>
      <span class="bar-val">${vv||0}</span>
    </div>`;
  }

  function miniCard(label, val, color='') {
    return `<div class="mini-card"><div class="mini-label">${label}</div><div class="mini-val ${color}">${val}</div></div>`;
  }

  // Jugadores select
  const jug_opts = jugadores.map(j => `<option value="${j}">${j}</option>`).join('');

  let html = `
  <div class="partido-header">
    <div>
      <div class="partido-title">⬤ <span>${partido.toUpperCase()}</span></div>
    </div>
    <div class="actions">
      <button class="btn btn-red" onclick="exportarPDF('colectivo')">⬇ PDF Colectivo</button>
      <button class="btn btn-outline" onclick="document.getElementById('fi').click()">↩ Nuevo archivo</button>
    </div>
  </div>

  ${archivosActuales.length > 1 ? `
  <div id="part-filter" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.2rem;align-items:center">
    <span style="font-size:10px;color:var(--gris5);text-transform:uppercase;letter-spacing:.5px;margin-right:4px">Partidos:</span>
    ${archivosActuales.map((f,i) => `
      <label class="part-chip">
        <input type="checkbox" data-idx="${i}" ${partidosSel.has(i) ? 'checked' : ''} onchange="onPartidoToggle()">
        <span>${nombresPartidos[i] || f.name}</span>
      </label>`).join('')}
    <button class="btn" style="padding:4px 10px;font-size:11px" onclick="togglePartidos(true)">Todos</button>
    <button class="btn" style="padding:4px 10px;font-size:11px" onclick="togglePartidos(false)">Ninguno</button>
  </div>` : ''}

  <div class="score-box">
    <div class="score-team">
      <div class="score-name">River Plate</div>
      <div class="score-num river">${gp.total}</div>
    </div>
    <div class="score-sep">–</div>
    <div class="score-team">
      <div class="score-name">Rival</div>
      <div class="score-num rival">${gr.total}</div>
    </div>
  </div>

  <div class="metric-grid">
    ${[
      ['Llegadas Propias', lp.total, 'red'],
      ['Sit. de Gol', col.sit_gol_prop, 'amber'],
      ['Remates al Arco', lp.tiros_arco, ''],
      ['Centros Prop.', cp.total, ''],
      ['Trans. Ofensiva', col.trans_of, ''],
      ['Circulaciones', col.circulaciones, ''],
      ['Bloques', col.bloques, 'green'],
      ['Recuperadas', col.recuperadas, 'green'],
    ].map(([l,v,c]) => `<div class="metric-card"><div class="metric-label">${l}</div><div class="metric-val ${c}">${v}</div></div>`).join('')}
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('comparativa',this)">⚖ Comparativa</div>
    <div class="tab" onclick="switchTab('llegadas',this)">🏹 Llegadas</div>
    <div class="tab" onclick="switchTab('salidas',this)">🥅 Salidas</div>
    <div class="tab" onclick="switchTab('goles',this)">⚽ Goles</div>
    <div class="tab" onclick="switchTab('cambios',this)">🔄 Cambios</div>
    <div class="tab" onclick="switchTab('minutos',this)">⏱ Minutos</div>
    <div class="tab" onclick="switchTab('individual',this)">👤 Individual</div>
  </div>

  <!-- COMPARATIVA -->
  <div class="tab-panel active" id="panel-comparativa">
    <div style="display:flex;gap:20px;align-items:center;margin-bottom:8px">
      <span style="font-size:11px;font-weight:700;color:var(--rojo)">RIVER</span>
      <span style="flex:1"></span>
      <span style="font-size:11px;color:var(--gris5)">RIVAL</span>
    </div>
    ${compareRow('Llegadas', lp.total, lr.total)}
    ${compareRow('Situaciones de Gol', col.sit_gol_prop, col.sit_gol_riv)}
    ${compareRow('Remates al Arco', lp.tiros_arco, lr.tiros_arco)}
    ${compareRow('Centros', cp.total, cr.total)}
    ${compareRow('Detenidas', col.detenidas_prop, col.detenidas_riv)}
    ${compareRow('Trans. Ofensiva', col.trans_of, 0)}
    ${compareRow('Trans. Defensiva', col.trans_def, 0)}
    ${compareRow('Circulaciones', col.circulaciones, 0)}
    ${compareRow('Bloques', col.bloques, 0)}
    ${compareRow('Perdidas', col.perdidas, 0)}
    ${compareRow('Recuperadas', col.recuperadas, 0)}
  </div>

  <!-- LLEGADAS -->
  <div class="tab-panel" id="panel-llegadas">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div>
        <div class="sec-title red">Llegadas Propias (${lp.total})</div>
        <div class="mini-grid">
          ${miniCard('Asociado', lp.asociado)}
          ${miniCard('Directo', lp.directo)}
          ${miniCard('Detenidas', lp.detenidas)}
        </div>
        <div class="sec-title">Finalización (carril)</div>
        <div class="mini-grid">
          ${miniCard('Izq', lp.izq, 'red')}
          ${miniCard('Eje', lp.eje, 'red')}
          ${miniCard('Der', lp.der, 'red')}
        </div>
        <div class="sec-title">Remates</div>
        <div class="mini-grid">
          ${miniCard('Al Arco', lp.tiros_arco, 'red')}
          ${miniCard('Afuera', lp.afuera)}
          ${miniCard('Bloqueado', lp.bloqueado)}
        </div>
        <div class="sec-title">Carriles utilizados</div>
        <div class="mini-grid">
          ${miniCard('1 Carril', lp['1carril'])}
          ${miniCard('2 Carriles', lp['2carriles'])}
          ${miniCard('3 Carriles', lp['3carriles'])}
        </div>
      </div>
      <div>
        <div class="sec-title">Llegadas Rivales (${lr.total})</div>
        <div class="mini-grid">
          ${miniCard('Asociado', lr.asociado)}
          ${miniCard('Directo', lr.directo)}
          ${miniCard('Detenidas', lr.detenidas)}
        </div>
        <div class="sec-title">Finalización (carril)</div>
        <div class="mini-grid">
          ${miniCard('Izq', lr.izq)}
          ${miniCard('Eje', lr.eje)}
          ${miniCard('Der', lr.der)}
        </div>
        <div class="sec-title">Remates</div>
        <div class="mini-grid">
          ${miniCard('Al Arco', lr.tiros_arco)}
          ${miniCard('Afuera', lr.afuera)}
          ${miniCard('Bloqueado', lr.bloqueado)}
        </div>
      </div>
    </div>
  </div>

  <!-- SALIDAS -->
  <div class="tab-panel" id="panel-salidas">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div>
        <div class="sec-title red">Salidas Propias (${sp.total})</div>
        <div class="mini-grid">
          ${miniCard('En Corto', sp.cortas)}
          ${miniCard('En Largo', sp.largas)}
          ${miniCard('Progresa', sp.progresa, 'green')}
        </div>
        <div class="sec-title">Orientación</div>
        <div class="mini-grid">
          ${miniCard('Izq', sp.izq)}
          ${miniCard('Eje', sp.eje)}
          ${miniCard('Der', sp.der)}
        </div>
      </div>
      <div>
        <div class="sec-title">Salidas Rivales (${sr.total})</div>
        <div class="mini-grid">
          ${miniCard('En Corto', sr.cortas)}
          ${miniCard('En Largo', sr.largas)}
          ${miniCard('Progresa', sr.progresa)}
        </div>
        <div class="sec-title">Orientación</div>
        <div class="mini-grid">
          ${miniCard('Izq', sr.izq)}
          ${miniCard('Eje', sr.eje)}
          ${miniCard('Der', sr.der)}
        </div>
      </div>
    </div>
  </div>

  <!-- GOLES -->
  <div class="tab-panel" id="panel-goles">
    ${goles.length ? goles.map(g => `
      <div class="gol-item">
        <div class="gol-min">${g.minuto}</div>
        <div class="gol-eq ${g.equipo === 'Propio' ? 'river' : 'rival'}">${g.equipo === 'Propio' ? 'RIVER' : 'RIVAL'}</div>
        <div class="gol-info">
          <div class="gol-tipo">${g.tipo}</div>
          <div class="gol-carril">${g.carril}</div>
        </div>
        <div style="font-size:10px;color:var(--gris5)">${g.remate}</div>
      </div>`).join('') : '<p style="color:var(--gris5)">No se registraron goles.</p>'}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:1.2rem">
      <div>
        <div class="sec-title red">Goles Propios · tipo</div>
        <div class="mini-grid">
          ${miniCard('Asociado', gp.asociado)}
          ${miniCard('Directo', gp.directo)}
          ${miniCard('Detenidas', gp.detenidas)}
        </div>
      </div>
      <div>
        <div class="sec-title">Goles Rivales · tipo</div>
        <div class="mini-grid">
          ${miniCard('Asociado', gr.asociado)}
          ${miniCard('Directo', gr.directo)}
          ${miniCard('Detenidas', gr.detenidas)}
        </div>
      </div>
    </div>
  </div>

  <!-- CAMBIOS -->
  <div class="tab-panel" id="panel-cambios">
    ${cambios.length ? cambios.map(c => `
      <div class="cambio-item">
        <div class="cambio-min">${c.minuto}</div>
        <div style="flex:1">
          <div class="cambio-sale">↑ ${c.sale}</div>
          <div class="cambio-entra">↓ ${c.entra}</div>
        </div>
        <div class="cambio-eq">${(c.equipo||'Propio').toUpperCase()}</div>
      </div>`).join('') : '<p style="color:var(--gris5)">No se detectaron cambios.</p>'}
  </div>

  <!-- MINUTOS -->
  <div class="tab-panel" id="panel-minutos">
    <div class="sec-title red">Minutos jugados — River Plate</div>
    ${['Titular','Suplente'].map(cond => {
      const grupo = minutos.filter(p => p.condicion === cond);
      if (!grupo.length) return '';
      return `<div class="sec-title" style="margin-top:.8rem">${cond}s</div>` +
        grupo.map(p => `
        <div class="min-jugador">
          <div class="min-nombre">${p.jugador}</div>
          <div class="min-track">
            <div class="min-fill ${p.condicion.toLowerCase()}" style="width:${Math.min(100,p.minutos/90*100).toFixed(1)}%"></div>
          </div>
          <div class="min-tiempo">${p.minutos}m</div>
          <div class="min-cond ${p.condicion.toLowerCase()}">${p.condicion}</div>
        </div>`).join('');
    }).join('')}
  </div>

  <!-- INDIVIDUAL -->
  <div class="tab-panel" id="panel-individual">
    <div class="ind-selector">
      <label>Jugador:</label>
      <select id="jug-select" onchange="renderIndividual(this.value)">
        <option value="">— Seleccioná un jugador —</option>
        ${jug_opts}
      </select>
      <button class="btn btn-red" onclick="exportarPDF('individual')">⬇ PDF Individual</button>
    </div>
    <div id="ind-content"></div>
  </div>
  `;

  document.getElementById('results').innerHTML = html;

  // Restaurar tab activa
  if (tabActiva && tabActiva !== 'comparativa') {
    const tabEl = Array.from(document.querySelectorAll('.tab'))
      .find(t => t.getAttribute('onclick')?.includes(`'${tabActiva}'`));
    if (tabEl) switchTab(tabActiva, tabEl);
  }

  // Restaurar jugador activo
  if (jugadorActivo) {
    const sel = document.getElementById('jug-select');
    if (sel && Array.from(sel.options).some(o => o.value === jugadorActivo)) {
      sel.value = jugadorActivo;
      renderIndividual(jugadorActivo);
    } else {
      jugadorActivo = '';
    }
  }
}

function togglePartidos(on) {
  partidosSel = on ? new Set(archivosActuales.map((_, i) => i)) : new Set();
  analizarConFiltro();
}

function onPartidoToggle() {
  partidosSel = new Set();
  document.querySelectorAll('#part-filter input[type=checkbox]').forEach(b => {
    if (b.checked) partidosSel.add(parseInt(b.dataset.idx, 10));
  });
  analizarConFiltro();
}

function renderIndividual(jugador) {
  if (!jugador || !datosActuales) return;
  jugadorActivo = jugador;

  const idxs = Array.from(partidosSel).sort((a,b) => a-b);
  if (!idxs.length) {
    document.getElementById('ind-content').innerHTML =
      '<p style="color:var(--gris5)">Seleccioná al menos un partido.</p>';
    return;
  }

  const fd = new FormData();
  idxs.forEach(i => fd.append('archivo', archivosActuales[i]));
  fd.append('jugador', jugador);

  // Obtener stats individuales del servidor
  fetch('/api/individual', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(ind => {
      document.getElementById('ind-content').innerHTML = buildIndHTML(ind);
    })
    .catch(() => {
      // fallback: mostrar solo datos básicos
      document.getElementById('ind-content').innerHTML = `<p style="color:var(--gris5)">Sin datos individuales disponibles para ${jugador}.</p>`;
    });
}

function buildIndHTML(ind) {
  if (!ind || Object.keys(ind).length === 0) return '<p style="color:var(--gris5)">Sin datos individuales para este jugador.</p>';

  const efect = ind.pases_efect || 0;
  const colorEf = efect >= 75 ? 'var(--verde)' : efect >= 60 ? 'var(--ambar)' : 'var(--rojo)';

  function ir(label, val, color='') {
    return `<div class="ind-row"><span class="ind-row-label">${label}</span><span class="ind-row-val ${color}">${val}</span></div>`;
  }

  return `
  <div class="ind-header">
    <div>
      <div class="ind-nombre">${ind.jugador}</div>
      <div class="ind-sub">${ind.condicion} · ${ind.minutos}min · ${ind.intervenciones} intervenciones</div>
    </div>
    <div class="ind-kpis">
      <div class="kpi"><div class="kpi-val red">${ind.goles}</div><div class="kpi-label">Goles</div></div>
      <div class="kpi"><div class="kpi-val amber">${ind.asistencias}</div><div class="kpi-label">Asistencias</div></div>
      <div class="kpi"><div class="kpi-val blue">${ind.pases_clave}</div><div class="kpi-label">Pases clave</div></div>
    </div>
  </div>

  <div class="ind-grid">
    <div class="ind-block">
      <div class="ind-block-title">Efectividad de pases</div>
      <div class="efect-bar">
        <div class="efect-pct" style="color:${colorEf}">${efect}%</div>
        <div class="efect-track"><div class="efect-fill" style="width:${efect}%;background:${colorEf}"></div></div>
      </div>
      ${ir('Total pases', ind.pases_total)}
      ${ir('Completos', ind.pases_completos, 'green')}
      ${ir('Incompletos', ind.pases_incompletos, 'red')}
      ${ir('Adelante', ind.pases_adelante)}
      ${ir('Atrás', ind.pases_atras)}
      ${ir('Lateral', ind.pases_lateral)}
      ${ir('Largo completo', ind.pases_largo_c)}
      ${ir('Largo incompleto', ind.pases_largo_i)}
      ${ir('Filtrado', ind.pases_filtrado)}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Duelos y remates</div>
      ${ir('1v1 Of. Ganados', ind.dao_plus, 'green')}
      ${ir('1v1 Of. Perdidos', ind.dao_minus, 'red')}
      ${ir('1v1 Def. Ganados', ind.dad_plus, 'green')}
      ${ir('1v1 Def. Perdidos', ind.dad_minus, 'red')}
      ${ir('Regate completo', ind.regate_c, 'green')}
      ${ir('Regate incompleto', ind.regate_i, 'red')}
      <div class="ind-block-title" style="margin-top:8px">Remates</div>
      ${ir('Al Arco', ind.remates_arco, 'red')}
      ${ir('Goles', ind.remates_gol, 'amber')}
      ${ir('Afuera', ind.remates_afuera)}
      ${ir('Bloqueado', ind.remates_bloq)}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Recuperadas y pérdidas</div>
      ${ir('Posicional', ind.recup_posic, 'green')}
      ${ir('Por intervención', ind.recup_interv, 'green')}
      ${ir('Tras pérdida', ind.recup_tras, 'green')}
      ${ir('Pérd. por pase', ind.perd_pase, 'red')}
      ${ir('Pérd. por control', ind.perd_control, 'red')}
      ${ir('Pérd. por gambeta', ind.perd_gambeta, 'red')}
      <div class="ind-block-title" style="margin-top:8px">Intervenciones def.</div>
      ${ir('Intercepciones', ind.intercepciones)}
      ${ir('Anticipos', ind.anticipos)}
      ${ir('Bloqueos', ind.bloqueos)}
      ${ir('Entradas', ind.entradas)}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Táctico</div>
      ${ir('Toques en área rival', ind.toques_area, 'amber')}
      ${ir('Ruptura en conducción', ind.ruptura)}
      ${ir('Recep. entre líneas', ind.recep_lineas)}
      ${ir('Recep. a espaldas vol.', ind.recep_espal)}
      ${ir('Recep. al espacio', ind.recep_espacio)}
      ${ir('Apoyos', ind.apoyos)}
    </div>

    <div class="ind-block">
      <div class="ind-block-title">Recepciones por zona</div>
      ${ir('Zona Alta', ind.rec_alta, 'red')}
      ${ir('Zona Media', ind.rec_media)}
      ${ir('Zona Baja', ind.rec_baja)}
      <div class="ind-block-title" style="margin-top:8px">Centros</div>
      ${ir('Completos', ind.centros_c, 'green')}
      ${ir('Incompletos', ind.centros_i, 'red')}
      <div class="ind-block-title" style="margin-top:8px">Despejes</div>
      ${ir('Orientado', ind.despeje_or, 'green')}
      ${ir('No orientado', ind.despeje_no)}
    </div>
  </div>`;
}
</script>
</body>
</html>
